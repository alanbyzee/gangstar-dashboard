<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>我方排期 · HQ Calendar</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --accent:#6d28d9; --gold:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:24px;line-height:1.4}
  .wrap{max-width:1280px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
  h1{font-size:22px;font-weight:700}
  h1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;min-width:64px}
  .stat b{display:block;font-size:20px;color:var(--accent)}
  .stat span{font-size:11px;color:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
  .lg{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;user-select:none;transition:.15s}
  .lg .dot{width:11px;height:11px;border-radius:3px}
  .lg.off{opacity:.35;text-decoration:line-through}
  .lg b{color:var(--muted);font-weight:600}
  .months{display:grid;grid-template-columns:1fr;gap:28px}
  @media(min-width:1080px){.months{grid-template-columns:1fr 1fr;gap:24px}}
  .month{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .month h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .month h2 .tag{font-size:11px;background:#ede9fe;color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:600}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
  .dow div{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cell{min-height:62px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;background:#fcfcfd;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;transition:.12s}
  .cell:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(109,40,217,.12)}
  .cell.empty{background:transparent;border-color:transparent;cursor:default}
  .cell.empty:hover{box-shadow:none}
  .dnum{font-size:12px;font-weight:700;color:var(--ink)}
  .cell.out .dnum{color:#cbd5e1}
  .cell.launch{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:var(--gold)}
  .cell.launch .dnum{color:#b45309}
  .cell.launch::after{content:"上线";font-size:9px;color:#fff;background:var(--gold);border-radius:4px;padding:0 4px;align-self:flex-start;margin-top:-1px}
  .chip{font-size:10px;line-height:1.25;padding:2px 5px;border-radius:5px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more{font-size:10px;color:var(--muted);font-weight:600;padding-left:2px}
  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:50}
  .overlay.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:380px;max-width:90vw;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.18);transform:translateX(100%);transition:.22s;z-index:60;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
  .dh h3{font-size:18px}
  .dh .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .close{cursor:pointer;border:none;background:#f3f4f6;width:30px;height:30px;border-radius:8px;font-size:16px;color:var(--muted)}
  .dbody{padding:14px 20px;overflow-y:auto;flex:1}
  .di{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .di .cat{font-size:11px;font-weight:700;display:inline-block;padding:1px 8px;border-radius:10px;margin-bottom:5px}
  .di .txt{font-size:13px;white-space:pre-wrap;word-break:break-word}
  .foot{margin-top:26px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>

function itemsOn(date){

function dayName(d){
  const w=['周一','周二','周三','周四','周五','周六','周日'];
  const dt=new Date(d+'T00:00:00');
  return w[(dt.getDay()+6)%7];
}

function monthGrid(year, month){ // month 0-based
  const first=new Date(year,month,1);
  const startIdx=(first.getDay()+6)%7; // Monday=0
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startIdx;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  return cells;
}

  const wrap=document.getElementById('months');
  wrap.innerHTML='';
  const defs=[[2026,6,'2026年7月'],[2026,7,'2026年8月']];
  defs.forEach(([y,m,title])=>{
    const cells=monthGrid(y,m);
    const box=document.createElement('div');
    box.className='month';
    let html=`<h2>${title}<span class="tag">预注册期</span></h2>`;
    html+=`<div class="dow"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>`;
    html+=`<div class="grid">`;
    cells.forEach(d=>{
      if(d===null){html+=`<div class="cell empty"></div>`;return;}
      const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const list=itemsOn(iso);
      const isLaunch=iso===LAUNCH;
      const cls='cell'+(isLaunch?' launch':'');
      let chips='';
      list.slice(0,4).forEach(it=>{
        chips+=`<div class="chip" style="background:${TINT[it.cat]};border-left-color:${COLORS[it.cat]};color:${COLORS[it.cat]}" title="${esc(it.text)}">${esc(it.short)}</div>`;
      });
      if(list.length>4) chips+=`<div class="more">+${list.length-4} 更多</div>`;
      const num=list.length?`<span style="float:right;font-size:10px;color:var(--muted)">${list.length}</span>`:'';
      html+=`<div class="${cls}" data-date="${iso}"><div class="dnum">${d}${num}</div>${chips}</div>`;
    });
    html+=`</div>`;
    box.innerHTML=html;
    wrap.appendChild(box);
  });
  // 事件委托：兼容自动化测试 click
  if(!wrap._calBound){
    wrap.addEventListener('click', e=>{
      const cell=e.target.closest('.cell[data-date]');
      if(cell) openDay(cell.dataset.date);
    });
    wrap._calBound=true;
  }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function openDay(date){
  const list=DATA.items.filter(i=>i.date===date);
  document.getElementById('dTitle').textContent=date;
  document.getElementById('dSub').textContent=dayName(date)+(date===LAUNCH?' · 🎮 游戏上线日':'');
  const body=document.getElementById('dBody');
  if(!list.length){body.innerHTML='<p style="color:var(--muted)">当日无排期</p>';}
  else{
    body.innerHTML=list.map(it=>{
      const c=it.cat;
      return `<div class="di"><span class="cat" style="background:${TINT[c]};color:${COLORS[c]}">${CN[c]||c}</span><div class="txt">${esc(it.text)}</div></div>`;
    }).join('');
  }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDay(){document.getElementById('overlay').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
document.getElementById('overlay').onclick=closeDay;
document.getElementById('dClose').onclick=closeDay;

renderMonths();
</script>
</body>
</html>
