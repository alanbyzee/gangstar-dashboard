<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gangstar 运营看板</title>
<meta name="build" content="2026-08-07T0017">
<style>
:root{
  --bg:#eef1f7;
  --card:#ffffff;
  --ink:#1e2433;
  --muted:#7c8499;
  --line:#e7eaf1;
  --brand:#6d28d9;
  --brand2:#2563eb;
  --brand-soft:#f2eeff;
  --ok:#10b981;
  --err:#ef4444;
  --warn:#f59e0b;
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 24px rgba(16,24,40,.09);
  --shadow-lg:0 16px 44px rgba(16,24,40,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 420px at 50% -140px, rgba(109,40,217,.07), transparent 62%),
    linear-gradient(180deg,#f7f8fc 0%, #eef1f7 100%);
  color:var(--ink);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* 自定义滚动条 */
.view.scroll::-webkit-scrollbar,.fan::-webkit-scrollbar,.regional::-webkit-scrollbar,.southasia::-webkit-scrollbar,.sa-modal::-webkit-scrollbar{width:10px;height:10px}
.view.scroll::-webkit-scrollbar-thumb,.fan::-webkit-scrollbar-thumb,.regional::-webkit-scrollbar-thumb,.southasia::-webkit-scrollbar-thumb{background:#d3d8e3;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.view.scroll::-webkit-scrollbar-thumb:hover,.fan::-webkit-scrollbar-thumb:hover,.regional::-webkit-scrollbar-thumb:hover,.southasia::-webkit-scrollbar-thumb:hover{background:#b9c0d0;background-clip:padding-box}

/* ===== 顶部导航 ===== */
.topbar{
  display:flex;align-items:center;gap:18px;padding:13px 24px;
  background:linear-gradient(180deg,#ffffff,#fbfbff);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 14px rgba(16,24,40,.05);
  z-index:5;flex:none;
}
.brand{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:.2px}
.brand .dot{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 0 4px rgba(109,40,217,.13)}
.tabs{display:flex;gap:6px;margin-left:8px;background:#f1f2f7;padding:5px;border-radius:14px}
.tab{padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid transparent;background:transparent;transition:.18s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 4px 12px rgba(109,40,217,.28)}
.spacer{flex:1}
.upd{font-size:12px;color:var(--muted);background:#f3f4f8;padding:6px 13px;border-radius:20px;border:1px solid var(--line)}
.undo-btn{margin-left:10px;padding:8px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.undo-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);box-shadow:0 3px 10px rgba(109,40,217,.12)}
.undo-btn:active{transform:translateY(1px)}

/* ===== 内容区 ===== */
.stage{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.active{display:block;animation:viewIn .26s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view.scroll{overflow:auto;padding-right:2px}

/* ===== 粉丝监控 ===== */
.fan{padding:28px 24px 44px;max-width:1180px;margin:0 auto}
.fan h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.fan .sub{font-size:13px;color:var(--muted);margin-bottom:22px}

/* 汇总卡片 */
.summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 19px;min-width:152px;box-shadow:var(--shadow-sm);transition:.2s}
.stat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:23px;font-weight:800;margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}

/* 本周涨粉标签 */
.wk-up{font-size:11px;font-weight:700;color:var(--ok);background:#ecfdf5;border:1px solid #a7f3d0;padding:2px 8px;border-radius:8px;display:inline-flex;align-items:center}
.wk-down{font-size:11px;font-weight:700;color:var(--err);background:#fef2f2;border:1px solid #fecaca;padding:2px 8px;border-radius:8px;display:inline-flex;align-items:center}
.wk-flat{font-size:11px;font-weight:600;color:var(--muted);background:#f9fafb;border:1px solid var(--line);padding:2px 8px;border-radius:8px;display:inline-flex;align-items:center}
.wk-total{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));padding:2px 9px;border-radius:8px;margin-left:4px}

/* 工具栏 + 刷新状态 */
.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.refresh{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;padding:11px 21px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(109,40,217,.28);display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;transition:.18s}
.refresh:hover{box-shadow:0 6px 18px rgba(109,40,217,.36)}
.refresh:active{transform:translateY(1px)}
.refresh[disabled]{opacity:.65;cursor:default}

/* 刷新按钮内 spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.refresh .spin{display:none;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.refresh.loading .spin{display:inline-block}
.refresh.loading .btn-text{opacity:.5}

/* 状态文字 */
.status{font-size:13px;font-weight:600;padding:6px 13px;border-radius:9px;display:none}
.status.show{display:inline-block}
.status.ok{color:var(--ok);background:#ecfdf5;border:1px solid #a7f3d0}
.status.err{color:var(--err);background:#fef2f2;border:1px solid #fecaca}
.status.warn{color:var(--warn);background:#fffbeb;border:1px solid #fde68a}
.status.info{color:var(--brand2);background:#eff6ff;border:1px solid #bfdbfe}

/* Toast 通知 */
.toast{position:fixed;top:80px;right:24px;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:999;transform:translateX(120%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-width:380px;line-height:1.5;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(0)}
.toast.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.toast.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}

/* 平台卡片网格 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* 玩家反馈收集看板（按周 · 印度市场态度追踪） */
.feedback{padding:28px 24px 44px;max-width:1180px;margin:0 auto}
.feedback h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.feedback .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.att-track{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 15px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.att-track-label{font-size:12.5px;font-weight:700;color:var(--muted)}
.att-badge{font-size:11.5px;font-weight:700;border-radius:8px;padding:4px 10px}
.att-badge.pos{background:#dcfce7;color:#15803d}
.att-badge.neg{background:#fee2e2;color:#b91c1c}
.att-badge.wave{background:#ffedd5;color:#c2410c}
.att-badge.neu{background:#f1f5f9;color:#475569}
.wk-actions{margin-bottom:18px}
.add-week-btn{font-size:13px;font-weight:700;color:#fff;background:var(--brand);border:none;border-radius:10px;padding:9px 16px;cursor:pointer;transition:.15s}
.add-week-btn:hover{filter:brightness(.95)}
.wk-block{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.wk-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.wk-head .wk-title{font-size:16px;font-weight:800}
.wk-head .wk-att{font-size:12px;font-weight:700;border-radius:8px;padding:4px 11px}
.wk-head .wk-att.pos{background:#dcfce7;color:#15803d}
.wk-head .wk-att.neg{background:#fee2e2;color:#b91c1c}
.wk-head .wk-att.wave{background:#ffedd5;color:#c2410c}
.wk-head .wk-att.neu{background:#f1f5f9;color:#475569}
.wk-head .wk-del{margin-left:auto;cursor:pointer;color:#cbd5e1;font-size:13px;border:none;background:none;padding:3px 6px}
.wk-head .wk-del:hover{color:#e53e3e}
.wk-trend{background:#f8fafc;border:1px solid #eef2f7;border-left:4px solid var(--brand);border-radius:10px;padding:11px 14px;font-size:13px;line-height:1.6;color:var(--ink);margin:8px 0 16px;white-space:pre-wrap;word-break:break-word}
.wk-trend b{color:var(--brand)}
.fb-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.fb-cols{grid-template-columns:1fr}}
.fb-col{background:#fbfcfe;border:1px solid #eef2f7;border-radius:13px;padding:15px}
.fb-col h3{font-size:14px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.fb-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.fb-stat{font-size:11.5px;color:var(--muted);margin-bottom:10px;font-weight:600}
.fb-card{background:#fff;border:1px solid #eceff3;border-radius:10px;padding:10px 12px;margin-bottom:9px}
.fb-card .fb-meta{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.fb-card .fb-src{font-size:10.5px;font-weight:700;background:#eef2ff;color:#4338ca;border-radius:6px;padding:2px 7px}
.fb-card .fb-type{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px}
.fb-type.bug{background:#fee2e2;color:#b91c1c}
.fb-type.sug{background:#dcfce7;color:#15803d}
.fb-type.bad{background:#ffedd5;color:#c2410c}
.fb-type.good{background:#dbeafe;color:#1d4ed8}

.fb-card .fb-status{font-size:10.5px;color:var(--muted);background:#f1f5f9;border-radius:6px;padding:2px 7px}
.fb-card .fb-text{font-size:12.5px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.fb-card .fb-del{margin-left:auto;cursor:pointer;color:#cbd5e1;font-size:12px;border:none;background:none;padding:1px 3px}
.fb-card .fb-del:hover{color:#e53e3e}
/* 紧凑总结版（老板视角） */
.wk-summary{background:linear-gradient(90deg,#eef4ff,#f6f9ff);border:1px solid #dbe6ff;border-left:4px solid var(--brand);border-radius:11px;padding:13px 16px;font-size:14px;line-height:1.65;color:#1e293b;font-weight:500;margin:12px 0 14px;white-space:pre-wrap;word-break:break-word}
.wk-dims{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
@media(max-width:760px){.wk-dims{grid-template-columns:repeat(2,1fr)}}
.wk-dim{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.wk-dim-l{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}
.wk-dim-v{display:inline-block;font-size:13.5px;font-weight:800;border-radius:8px;padding:3px 10px}
.wk-dim-d{display:block;margin-top:6px;font-size:12.5px;line-height:1.45;color:var(--text);font-weight:400}
.wk-dim-v.pos{background:#dcfce7;color:#15803d}
.wk-dim-v.neg{background:#fee2e2;color:#b91c1c}
.wk-dim-v.wave{background:#ffedd5;color:#c2410c}
.wk-dim-v.neu{background:#f1f5f9;color:#475569}
.wk-themes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.wk-themes{grid-template-columns:1fr}}
.wk-sub{background:#fbfcfe;border:1px solid #eef2f7;border-radius:13px;padding:15px}
.wk-sub-h{font-size:14px;font-weight:800;margin:0 0 11px;display:flex;align-items:center;gap:8px}
.wk-sub-n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.wk-theme{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed #eef2f7}
.wk-theme:last-child{border-bottom:none}
.wk-theme .fb-type{flex:none;margin-top:1px}
.wk-theme-t{font-size:13px;line-height:1.55;color:var(--ink);flex:1}
.wk-theme-c{flex:none;font-size:11px;font-weight:700;color:#64748b;background:#f1f5f9;border-radius:7px;padding:2px 8px;white-space:nowrap}
.wk-invalid{margin-top:14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:9px 13px;font-size:12px;color:#92400e;line-height:1.55}
.fb-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:22px 0;border:1px dashed #e2e8f0;border-radius:11px}
.fb-empty.big{padding:40px 0;font-size:13.5px}
.fb-modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:1200}
.fb-modal{background:#fff;border-radius:16px;padding:22px;width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.fb-modal-h{font-size:17px;font-weight:800;margin-bottom:6px}
.fb-modal .hint{font-size:11.5px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.fb-modal label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.fb-modal input,.fb-modal select,.fb-modal textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;box-sizing:border-box}
.fb-modal textarea{resize:vertical}
.fb-modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn-cancel,.btn-save{font-size:13px;font-weight:700;border-radius:9px;padding:8px 16px;cursor:pointer;border:1px solid var(--line)}
.btn-cancel{background:#fff;color:var(--muted)}
.btn-save{background:var(--brand);color:#fff;border-color:var(--brand)}
.fb-modal .btn-save{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none}
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:.2s;box-shadow:var(--shadow-sm)}
.pc:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pc .bar{position:absolute;top:0;left:0;width:5px;height:100%;border-radius:16px 0 0 16px}
.pc .ph{display:flex;align-items:center;gap:9px}
.pc .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.pc .nm{font-size:14px;font-weight:800}
.pc .hd{font-size:11px;color:var(--muted)}
.pc .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.pc .big small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.pc .delta{font-size:12px;font-weight:700}
.pc .delta.up{color:var(--ok)}.pc .delta.down{color:var(--err)}.pc .delta.flat{color:#9ca3af}
.pc .note{font-size:11px;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:4px 8px}
/* 折线图区域 */
.chart-area{margin-top:4px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px}
.chart-area svg{width:100%;height:auto}
.pc .lk{font-size:11px;color:var(--brand);text-decoration:none;word-break:break-all}
.pc .lk:hover{text-decoration:underline}

/* ===== 洞察区：作战进度 + 占比 ===== */
.insights{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:22px}
@media(max-width:760px){.insights{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:var(--shadow-sm);transition:.2s}
.panel:hover{box-shadow:var(--shadow-md)}
.panel h3{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.panel h3 .em{font-size:15px}

/* 目标进度 */
.countdown{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.countdown .big{font-size:34px;font-weight:800;color:var(--brand);line-height:1}
.countdown .lbl{font-size:13px;color:var(--muted)}
.prog{height:14px;background:#eef2f7;border-radius:9px;overflow:hidden;margin:12px 0 6px;box-shadow:inset 0 1px 2px rgba(16,24,40,.06)}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:9px;transition:width .6s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

.target-edit{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:12px}
.target-edit input{width:84px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:700;color:var(--ink)}
.target-edit button{font-size:12px;padding:5px 11px;border:none;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:7px;cursor:pointer;font-weight:700;transition:.15s}
.target-edit button:hover{box-shadow:0 3px 10px rgba(109,40,217,.25)}
.target-edit button:active{transform:translateY(1px)}

/* 占比环图 */
.donut-wrap{display:flex;align-items:center;gap:18px}

.donut .center .t{font-size:10px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12px;flex:1}
.legend .row{display:flex;align-items:center;gap:7px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{font-weight:700;min-width:64px}
.legend .pc2{color:var(--muted)}
.legend .vl{margin-left:auto;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:6px 13px;border-radius:20px;font-size:13px;font-weight:800;box-shadow:0 3px 10px rgba(217,119,6,.3)}

/* 卡片动能行 */
.momentum{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.momentum .m{display:flex;flex-direction:column;gap:2px}
.momentum .m .k{font-size:10px;color:var(--muted)}
.momentum .m .v{font-size:13px;font-weight:800}
.m-up{color:var(--ok)}.m-down{color:var(--err)}.m-flat{color:#9ca3af}

/* ===== 区域素材周历 ===== */
.regional{padding:22px 24px 44px;max-width:1280px;margin:0 auto;position:relative}
.regional h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.regional .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
/* 周历表头 */
.cal-head{display:grid;grid-template-columns:140px repeat(7,1fr);gap:0;border:1px solid var(--line);border-radius:14px 14px 0 0;overflow:hidden;box-shadow:var(--shadow-sm)}
.cal-head>div{text-align:center;padding:12px 6px;font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.cal-head>div:first-child{background:#fbfbfe;color:var(--ink);border-right:1px solid var(--line)}
.cal-head .date-num{font-size:15px;display:block;margin-top:2px}
.cal-head .dow{font-size:11px;opacity:.85}
.cal-head .today-ring{box-shadow:inset 0 0 0 2px #fbbf24,0 0 8px rgba(251,191,36,.4);border-radius:8px}
/* 周历行 */
.cal-body{display:grid;grid-template-columns:140px repeat(7,1fr);gap:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.cal-row{display:contents}
.type-label{padding:12px 14px;font-size:12px;font-weight:700;color:var(--ink);background:#fafbfc;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.type-label .dot{width:9px;height:9px;border-radius:3px;flex:none}
.cell{padding:8px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:56px;background:#fff;font-size:12px;position:relative;transition:background .12s}
.cell:hover{background:#fcfcff}
.cell:last-child{border-right:none}
/* 素材卡片 */
.item{background:#fafbfd;border:1px solid #eef0f4;border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:12px;line-height:1.5;transition:box-shadow .15s,transform .12s;position:relative;text-align:left}
.item.dragging{opacity:.3}
.drag-ghost{position:fixed !important;left:0;top:0;margin:0 !important;pointer-events:none;z-index:9999;opacity:.96;box-shadow:0 12px 28px rgba(0,0,0,.2);transform:rotate(-1.5deg);background:#fff;transition:none !important;will-change:transform}
.cell.drop-over{background:#fff7ed;outline:2px dashed #f59e0b;outline-offset:-3px}
.item:hover{box-shadow:0 4px 14px rgba(16,24,40,.09);transform:translateY(-1px)}
/* 头部：DELAY + 类别 + 操作按钮（含拖拽手柄），flex 分层排布，互不重叠 */
.it-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;text-align:left}
.it-acts{margin-left:auto;display:flex;align-items:center;gap:1px;flex:none}
.item .drag-handle{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e2e5ea;border-radius:5px;background:#eef0f4;color:#9aa1ac;font-size:11px;line-height:1;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:.12s;flex:none}
.item .drag-handle:hover{background:#f59e0b;border-color:#f59e0b;color:#fff;transform:scale(1.08)}
.item .drag-handle:active{cursor:grabbing}
.it-body{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left}
.item .iact{cursor:pointer;font-size:10px;line-height:1.4;color:#9aa1ac;padding:1px 3px;border-radius:3px;user-select:none;-webkit-user-select:none}
.item .iact:hover{background:#eef0f4;color:#64748b}
.item .iact.del:hover{color:#ef4444}
.item .iact.cancel.on{color:#e14b4b;background:#fbdddd}
.item.cancelled .title,.item.cancelled .tag,.item.cancelled .partner{text-decoration:line-through;opacity:.6}
.reg-add{cursor:pointer;margin-left:5px;font-weight:800;opacity:.4;color:#fff;transition:.15s}
.reg-add:hover{opacity:1}
.cal-head>div{position:relative}
.item .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;display:inline-block;outline:none}
.item .title{font-weight:600;color:var(--ink);font-size:12.5px;line-height:1.45}
.item .partner{color:var(--muted);font-size:10.5px;margin-top:3px;line-height:1.4}
.item .partner u{color:var(--brand2);text-decoration:none;font-weight:600}
.item .req-row{margin-top:5px}
.req-box{display:inline-flex;align-items:center;gap:3px;margin-top:5px;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:9.5px;color:#c0c7d2;transition:.15s}
.req-box:hover{color:#959ba5}
.req-box .mk{width:12px;height:12px;border:1.2px solid #d0d5de;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;line-height:1;color:transparent;transition:.12s}
.req-box.on{color:#6aab54}
.req-box.on .mk{background:#58a83c;border-color:#58a83c;color:#fff}
/* 延期 / Delay：整卡高亮标记（点右上角「延」按钮触发） */
.sa-post.delayed,.item.delayed{border:1.5px solid #e53e3e !important;background:rgba(229,62,62,.08) !important}
.delay-badge{display:inline-block;flex:none;background:#e2e8f0;color:#4a5568;font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 6px;border-radius:4px;line-height:1.4}
/* 卡片右上角「延」按钮，置于「划」旁 */
.sa-post .act.delay{color:#9f7aea}
.sa-post .act.delay:hover{color:#e53e3e;background:#fff5f5}
.sa-post .act.delay.on{color:#fff;background:#e53e3e}
.item .iact.delay{color:#9f7aea}
.item .iact.delay:hover{color:#e53e3e;background:#fff5f5}
.item .iact.delay.on{color:#fff;background:#e53e3e}
/* 类型色 */
.t-copost{border-left:3px solid #2f80ed}.t-copost .tag{background:#dbeafe;color:#1d4ed8}
.t-meme{border-left:3px solid #f2994a}.t-meme .tag{background:#fdebd7;color:#b45309}
.t-kol{border-left:3px solid #e05299}.t-kol .tag{background:#fbdcee;color:#b0307a}
.t-koc{border-left:3px solid #12a594}.t-koc .tag{background:#d2f0eb;color:#0b7a6e}
.t-poster{border-left:3px solid #58a83c}.t-poster .tag{background:#e0f0d8;color:#3a7a24}
.t-gameplay{border-left:3px solid #8b5a2b}.t-gameplay .tag{background:#f3e9dc;color:#5c3a1e}
.t-drama{border-left:3px solid #eab308}.t-drama .tag{background:#fef9c3;color:#a16207}
/* 统计条 */
.regional-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rstat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 17px;min-width:122px;box-shadow:var(--shadow-sm);transition:.2s}
.rstat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.rstat .rk{font-size:11px;color:var(--muted)}.rstat .rv{font-size:18px;font-weight:800;margin-top:2px}
/* 周导航 */
.week-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.week-nav button{padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow-sm)}
.week-nav button:hover{border-color:var(--brand);color:var(--brand);box-shadow:var(--shadow-md)}
.week-nav .wlbl{font-size:15px;font-weight:800;color:var(--ink)}

/* ===== 区域素材周历 · 响应式（随窗口尺寸自适应排版）===== */
/* 周历容器常开横向滚动：小窗口保持固定列宽，允许左右滑动查看 */
.regional-week{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:#cbd5e0 transparent}
.regional-week::-webkit-scrollbar{height:11px}
.regional-week::-webkit-scrollbar-track{background:#f1f5f9;border-radius:6px}
.regional-week::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:6px;border:2px solid #f1f5f9}
.regional-week::-webkit-scrollbar-thumb:hover{background:#94a3b8}
/* 横滑箭头：鼠标点击左右滑动（小窗口查看当周被裁切的日期） */
.cal-arrows{position:absolute;right:16px;bottom:16px;z-index:9;display:flex;gap:6px}
.cal-arrow{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-md);font-size:20px;line-height:1;color:#475569;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.cal-arrow:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.cal-arrow:active{transform:scale(.94)}
.cal-head,.cal-body{grid-template-columns:140px repeat(7,minmax(122px,1fr));min-width:1024px}
@media (max-width:1080px){
  .regional{padding:18px 16px 36px}
  .type-label{padding:10px 10px}
  .cell{padding:7px 7px;min-height:52px}
  .item{padding:8px 9px;font-size:11.5px}
  .item .title{font-size:11.5px}
  .rstat{min-width:104px;padding:9px 13px}
  .rstat .rv{font-size:16px}
}
@media (max-width:760px){
  .regional{padding:14px 10px 28px}
  .regional h2{font-size:19px}
  .regional .sub{font-size:12px}
  /* 手机：标签列略缩，列最小宽保留，整体仍横向滚动 */
  .cal-head,.cal-body{grid-template-columns:104px repeat(7,minmax(110px,1fr));min-width:920px}
  .cal-head>div,.type-label,.cell{padding-left:8px;padding-right:8px}
  .cell{min-height:46px}
  .item{font-size:11px;padding:7px 8px}
  .item .title{font-size:11px}
  .it-head{gap:4px}
  .item .iact{padding:1px 2px}
  .week-nav{flex-wrap:wrap;gap:8px}
  .week-nav button{padding:6px 11px;font-size:12px}
  .rstat{flex:0 0 auto;min-width:92px;padding:8px 11px}
  .rstat .rv{font-size:15px}
}

/* ===== 南亚社群排期（HQ + 区域 合并）===== */
.southasia{padding:22px 24px 44px;max-width:1320px;margin:0 auto}
.southasia h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.southasia .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
/* 筛选开关 */
.sa-filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;align-items:center}
.sa-filters .f-label{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.chip{padding:7px 15px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#6b7280;transition:.15s;user-select:none;box-shadow:var(--shadow-sm)}
.chip:hover{border-color:#c5cad0;color:#4b5563;box-shadow:var(--shadow-md)}
.chip.on{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.chip.all.on{background:#64748b}
/* 莫兰迪色系：低饱和灰调，柔和耐看 */

.chip[data-f="hq"].on{background:#7c5cd6}
.chip[data-f="copost"]{border-color:#dbeafe}
.chip[data-f="copost"].on{background:#2f80ed}
.chip[data-f="kol"]{border-color:#fbdcee}
.chip[data-f="kol"].on{background:#e05299}
.chip[data-f="koc"]{border-color:#d2f0eb}
.chip[data-f="koc"].on{background:#12a594}
.chip[data-f="meme"]{border-color:#fdebd7}
.chip[data-f="meme"].on{background:#f2994a}
.chip[data-f="poster"]{border-color:#e0f0d8}
.chip[data-f="poster"].on{background:#58a83c}
.chip[data-f="gameplay"]{border-color:#f3e9dc}
.chip[data-f="gameplay"].on{background:#8b5a2b;color:#fff}
.chip[data-f="drama"]{border-color:#fef9c3}
.chip[data-f="drama"].on{background:#eab308;color:#fff}
.chip[data-f="delay"]{border-color:#fbd5d5}
.chip[data-f="delay"].on{background:#e53e3e;color:#fff}
/* 分区标题带 */
.sa-section{margin-bottom:30px}
.sa-banner{display:flex;align-items:center;gap:10px;padding:12px 19px;border-radius:13px 13px 0 0;font-size:15px;font-weight:800;color:#fff;box-shadow:var(--shadow-sm)}
.sa-banner.hq{background:linear-gradient(135deg,#8b6fe0,#7c5cd6)}
.sa-banner.region{background:linear-gradient(135deg,#f59e0b,#d97706)}
.sa-banner .cnt{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:9px}
.sa-restore{margin-left:8px;font-size:12px;font-weight:700;background:rgba(255,255,255,.28);padding:2px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.sa-restore:hover{background:rgba(255,255,255,.45)}
/* 团队产能 — 2列网格卡片 */
.cap-sup-row{display:flex;gap:16px;margin-bottom:16px;align-items:flex-start}
.cap-sup-row>.sa-cap{margin-bottom:0;flex:1 1 0;min-width:0}
.cap-sup-row>.supplier-cap{flex:0 1 auto;min-width:520px}
@media(max-width:1100px){.cap-sup-row{flex-direction:column}.cap-sup-row>.supplier-cap{min-width:auto;width:100%}}
.sa-cap{display:flex;flex-direction:column;gap:8px;padding:14px 18px;background:#faf9fc;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.sa-cap .ca-t{font-weight:800;color:var(--ink);font-size:15px;line-height:1;margin-bottom:2px}
/* 分组标签 */
.cap-grp{font-size:12px;font-weight:800;padding:3px 10px;border-radius:6px;display:inline-block;width:fit-content;margin-top:4px}

.cap-card .cc-icon{font-size:20px;flex-shrink:0}
.cap-card .cc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cap-card .cc-name{font-size:12.5px;font-weight:700;color:#374151}
.cap-card .cc-val{font-size:17px;font-weight:900;color:var(--c);line-height:1.2}
.cap-card .cc-badge{font-size:9px;font-weight:800;color:#fff;background:var(--c);border-radius:5px;padding:2px 7px;flex-shrink:0;line-height:1.4}

/* 月产能在底部 */
.cap-month{font-size:12.5px;font-weight:700;color:#92400e;background:linear-gradient(90deg,#fff7ed,#fffbf5);border:1px dashed #fbbf24;border-radius:8px;padding:7px 14px;text-align:center;margin-top:2px}
.cap-month b{color:#d97706}
/* 供应商人力安排块 — 组织结构图 */
.sa-cap.supplier-cap{background:#f4f8fc;border-color:#d6e6f5;flex-direction:column;align-items:stretch;gap:12px}
.sa-cap.supplier-cap .ca-t{color:#1d4e89;line-height:normal}
.sup-org{display:flex;flex-direction:column;align-items:center}
.sup-root{background:linear-gradient(135deg,#1d4e89,#2563eb);color:#fff;padding:9px 28px;border-radius:12px;font-weight:800;font-size:15px;box-shadow:0 2px 7px rgba(37,99,235,.25);position:relative;z-index:2}
.sup-root::after{content:'';position:absolute;left:50%;bottom:-22px;width:2px;height:22px;background:#c3d0e0;transform:translateX(-50%)}
.sup-cols{display:flex;gap:12px;margin-top:22px;position:relative;width:100%;flex-wrap:nowrap;justify-content:stretch}
.sup-cols::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#c3d0e0}
.sup-col{position:relative;flex:1 1 0;min-width:0;padding-top:20px}
.sup-col::before{content:'';position:absolute;top:0;left:50%;width:2px;height:20px;background:#c3d0e0;transform:translateX(-50%)}
.sup-head{border-radius:10px 10px 0 0;padding:9px 10px;text-align:center;font-weight:800;color:#fff;font-size:13px;background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sup-list{list-style:none;margin:0;padding:0;border:1px solid #e0e6ef;border-top:none;border-radius:0 0 10px 10px;overflow:hidden;background:#fff}

.sup-foot{margin-top:2px;font-size:12.5px;font-weight:700;color:#1d4e89;background:#e8f0fb;border:1px solid #cfe0f5;border-radius:10px;padding:8px 14px;text-align:center}
.sup-foot b{color:#2563eb}
/* HQ 周历网格 */
.sa-grid-wrap{position:relative}
.sa-grid{border:1px solid var(--line);border-radius:0 0 14px 14px;overflow-x:auto;overflow-y:hidden;background:#fff;box-shadow:var(--shadow-sm);scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
.sa-grid::-webkit-scrollbar{height:11px}
.sa-grid::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
.sa-grid::-webkit-scrollbar-track{background:transparent}
.sa-week{border-bottom:1px solid var(--line);min-width:min-content}
.sa-week:last-child{border-bottom:none}
.sa-wband{display:flex;align-items:center;gap:12px;padding:11px 17px;font-weight:700;font-size:13px;color:#fff;min-width:max-content}

.sa-wband .rng{font-size:12px;opacity:.92;white-space:nowrap}
.sa-wband .th{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sa-arrows{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:5}
.sa-arrow{width:34px;height:34px;border-radius:50%;border:none;background:rgba(99,102,241,.92);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transition:.15s}
.sa-arrow:hover{background:#6366f1;transform:translateY(-1px)}
.sa-cell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:9px 9px;min-height:68px;background:#fcfcfd;font-size:12px;transition:background .12s}

.sa-dhead{font-weight:700;color:var(--ink);display:flex;justify-content:space-between;margin-bottom:3px}

.sa-cell.is-today .sa-dhead{margin-bottom:4px}
.sa-cell.is-today .sa-dhead>span:first-child{background:#c0896a;color:#fff;border-radius:5px;padding:1px 6px;font-size:12px;box-shadow:0 1px 4px rgba(192,137,106,.4)}

.sa-cell.is-today .sa-add-btn:hover{background:#f3ddd0;color:#9c6b4f}
.sa-post{border:1px solid #eef0f4;border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:7px;box-shadow:0 1px 2px rgba(16,24,40,.03);transition:box-shadow .15s,.18s;position:relative;text-align:left}
.sa-post:hover{box-shadow:0 3px 10px rgba(16,24,40,.08);transform:translateY(-1px)}
.sp-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;text-align:left}
.sp-body{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left}
.sp-acts{margin-left:auto;display:flex;align-items:center;gap:1px;flex:none}
.sa-post .t{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#94a3b8;border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px}
.sa-post .b{font-size:12.5px;color:var(--ink);word-break:break-word;font-weight:600;line-height:1.45}
.sa-post .p{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.sa-empty-tip{font-size:11px;color:#cbd5e1;text-align:center;padding:14px 0}

<script src="./hq_data.js"></script>
<script>
// ===== 标签切换 =====
const tabs=document.querySelectorAll('.tab');
const views={sa:document.getElementById('view-sa'),fan:document.getElementById('view-fan'),feedback:document.getElementById('view-feedback'),regional:document.getElementById('view-regional')};
tabs.forEach(t=>t.onclick=()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const v=t.dataset.view;
  Object.values(views).forEach(x=>x.classList.remove('active'));
  views[v].classList.add('active');
  if(v==='fan') loadFans();
  if(v==='feedback') renderFeedback();
  if(v==='sa') renderSouthAsia();
  if(v==='regional') renderRegional();
});
document.getElementById('undoBtn').onclick=doUndo;

// ===== 工具函数 =====
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return Number(n).toLocaleString('en-US');}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function daysToLaunch(){
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.max(0, Math.round((new Date('2026-08-20')-today)/86400000));
}
function todayStr(){
  const t=new Date();
  const y=t.getFullYear();
  const m=String(t.getMonth()+1).padStart(2,'0');
  const d=String(t.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

// ===== 历史按天归一化：同天多条取最高值，按日期升序 =====
function dedupeHistory(hist){
  if(!hist||!hist.length) return [];
  const map={};
  hist.forEach(h=>{
    const v=Number(h.value)||0;
    if(map[h.date]===undefined || v>map[h.date]) map[h.date]=v;
  });
  return Object.keys(map).sort().map(date=>({date,value:map[date]}));
}
// 图表最多显示天数（按天数据）
const FAN_DISPLAY_DAYS=30;

// ===== 折线图绘制（内联 SVG） =====
function drawChart(hist,color,events){
  // 按天归一化 + 仅显示最近 FAN_DISPLAY_DAYS 天（完整历史仍存于 fan_data.json，不丢失）
  hist=dedupeHistory(hist).slice(-FAN_DISPLAY_DAYS);
  if(!hist||hist.length<2){
    return `<div class="chart-area" style="text-align:center;padding:20px;color:var(--muted);font-size:12px">
      数据点不足（需至少 2 次记录），继续更新后将自动画出增长曲线
    </div>`;
  }
  const W=250,H=90,padL=36,padR=14,padT=8,padB=20;
  const vals=hist.map(p=>p.value);
  const minV=Math.min(...vals)*0.95,maxV=Math.max(...vals)*1.03;
  const span=(maxV-minV)||1;
  const n=vals.length;
  // 坐标映射
  function px(i,v){return{x:padL+(W-padL-padR)*Math.max(0,Math.min(1,(n<=1?0.5:i/(n-1)))),y:padT+(H-padT-padB)*(1-Math.max(0,Math.min(1,(v-minV)/span)))};}
  const pts=vals.map((v,i)=>px(i,v));
  // 路径
  let lineD='';pts.forEach((p,i)=>lineD+=(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)+' ');
  // 面积填充
  const areaD=lineD+`L${pts[pts.length-1].x.toFixed(1)},${(H-padB).toFixed(1)} L${pts[0].x.toFixed(1)},${(H-padB).toFixed(1)} Z`;
  // 数据点圆（关键事件点高亮为金色 + 标注）
  const evtMap={};(events||[]).forEach(e=>evtMap[e.date]=e.label);
  const dotsCircs=pts.map((p,i)=>{
    const ev=evtMap[hist[i].date];
    if(ev){
      const ty=Math.max(padT+10,p.y-9);
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.6" fill="#f59e0b" stroke="#fff" stroke-width="1.6"/>`+
        `<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#b45309" font-weight="800">${esc(ev)}</text>`;
    }
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.8" fill="${color}" opacity=".75"/>`;
  }).join('');
  // X轴标签（每隔几个显示一个）
  const xLabels=[];
  const step=Math.ceil(n/6);
  hist.forEach((p,i)=>{if(i%step===0||i===n-1)xLabels.push(`<text x="${pts[i].x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="9" fill="#9ca3af">${p.date.slice(5)}</text>`);});
  // Y轴标签
  const yTicks=[minV,minV+(maxV-minV)*0.5,maxV];
  const yLabels=yTicks.map(v=>`<text x="${padL-4}" y="${padT+(H-padT-padB)*(1-(v-minV)/span).toFixed(1)}" text-anchor="end" font-size="9" fill="#9ca3af">${Math.round(v)}</text>`).join('');
  // 最新值标注
  const last=pts[pts.length-1];
  const lastLabel=`<text x="${last.x.toFixed(1)}" y="${Math.max(padT+10,last.y-8)}" text-anchor="middle" font-size="10" fill="${color}" font-weight="700">${fmt(vals[vals.length-1])}</text>`;
  // 网格线
  const gridLines=[0,.5,1].map(f=>`<line x1="${padL}" y1="${padT+(H-padT-padB)*(1-f)}" x2="${W-padR}" y2="${padT+(H-padT-padB)*(1-f)}" stroke="#e5e7eb" stroke-dasharray="3,3"/>`).join('');

  return `<div class="chart-area">
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <!-- 网格 -->${gridLines}
      <!-- 面积 --><path d="${areaD}" fill="${color}" opacity=".08"/>
      <!-- 线条 --><path d="${lineD}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 点 -->${dotsCircs}${lastLabel}
      <!-- X轴 -->${xLabels.join('')}
      <!-- Y轴 -->${yLabels}
    </svg>
  </div>`;
}

// ===== 周增长计算（基于历史，找 ~7 天前锚点）=====
function weeklyGrowth(pl){
  const hist=dedupeHistory(pl.history||[]);
  if(hist.length<2) return null;
  const last=hist[hist.length-1];
  const lastDate=new Date(last.date+'T00:00:00');
  const target=new Date(lastDate); target.setDate(target.getDate()-7);
  let base=null;
  for(const h of hist){
    const d=new Date(h.date+'T00:00:00');
    if(d<=target) base=h.value; else break;
  }
  if(base===null) base=hist[0].value;
  const diff=last.value-base;
  const pct=base? (diff/base*100):0;
  return {diff, pct, daily:diff/7};
}

// ===== 渲染粉丝卡片 =====
function renderFans(data){
  document.getElementById('upd').textContent='数据更新于 '+data.updated_at;
  const p=data.platforms;
  const totalAll=(p.instagram?.value||0)+(p.facebook?.value||0)+(p.youtube?.value||0)+(p.x?.value||0);
  const d=daysToLaunch();

  const igHist=p.instagram?.history||[];
  const igBase=igHist.length?igHist[0].value:0;
  const igGain=(p.instagram?.value||0)-igBase;

  // 本周涨粉（周一为节点，用 weeklyGrowth 算）
  const igWg=weeklyGrowth(p.instagram);
  const ytWg=weeklyGrowth(p.youtube);
  const fbWg=weeklyGrowth(p.facebook);
  const xWg=weeklyGrowth(p.x);
  const totalWg=(igWg?.diff||0)+(ytWg?.diff||0)+(fbWg?.diff||0)+(xWg?.diff||0);

  function wkTag(wg){
    if(!wg) return '';
    const v=wg.diff;
    if(v>0) return `<span class="wk-up">本周 ▲+${fmt(v)}</span>`;
    if(v<0) return `<span class="wk-down">本周 ▼${fmt(v)}</span>`;
    return '<span class="wk-flat">本周 ±0</span>';
  }

  document.getElementById('summary').innerHTML=`
    <div class="stat"><div class="k">距上线 8/20</div><div class="v">D-${d}</div></div>
    <div class="stat"><div class="k">社区总粉丝（4 平台）</div><div class="v">${fmt(totalAll)}${totalWg>0?`<small class="wk-total">本周 ▲+${fmt(totalWg)}</small>`:''}</div></div>
    <div class="stat"><div class="k">Instagram</div><div class="v">${fmt(p.instagram?.value||0)}${wkTag(igWg)}</div></div>
    <div class="stat"><div class="k">YouTube 订阅</div><div class="v">${fmt(p.youtube?.value||0)}${wkTag(ytWg)}</div></div>
    <div class="stat"><div class="k">Facebook</div><div class="v">${fmt(p.facebook?.value||0)}${wkTag(fbWg)}</div></div>
    <div class="stat"><div class="k">X (Twitter)</div><div class="v">${fmt(p.x?.value||0)}${wkTag(xWg)}</div></div>`;

  // 洞察区（作战进度 + 占比 + 本周最佳）
  renderInsights(data);

  const order=['instagram','facebook','youtube','x'].sort((a,b)=>(p[b]?.value||0)-(p[a]?.value||0));
  document.getElementById('cards').innerHTML=order.map(k=>{
    const pl=p[k]; if(!pl) return '';
    const hist=dedupeHistory(pl.history||[]);
    const prev=hist.length>1?hist[hist.length-2].value:pl.value;
    const diff=pl.value-prev;
    const dcls=diff>0?'up':(diff<0?'down':'flat');
    const dtxt=diff>0?`▲ +${fmt(diff)}`:(diff<0?`▼ ${fmt(diff)}`:'—');
    const initial=(pl.name||'').replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()||'??';
    const wg=weeklyGrowth(pl);
    const momentum=wg?`<div class="momentum">
      <div class="m"><span class="k">近 7 天</span><span class="v ${wg.diff>0?'m-up':wg.diff<0?'m-down':'m-flat'}">${wg.diff>0?'+':''}${fmt(wg.diff)}</span></div>
      <div class="m"><span class="k">周环比</span><span class="v ${wg.pct>=0?'m-up':'m-down'}">${wg.pct>=0?'+':''}${wg.pct.toFixed(1)}%</span></div>
      <div class="m"><span class="k">日均增</span><span class="v ${wg.daily>=0?'m-up':'m-down'}">${wg.daily>=0?'+':''}${wg.daily.toFixed(1)}</span></div>
    </div>`:'';
    return `<div class="pc">
      <div class="bar" style="background:${pl.color}"></div>
      <div class="ph">
        <div class="ic" style="background:${pl.color}">${PLATFORM_ICONS[k]||initial}</div>
        <div><div class="nm">${esc(pl.name)}</div><div class="hd">${esc(pl.handle)}</div></div>
      </div>
      <div class="big">${fmt(pl.value)}<small>${esc(pl.label)}</small></div>
      <div class="delta ${dcls}">${dtxt}</div>
      ${momentum}
      ${drawChart(hist,pl.color,PLATFORM_EVENTS[k])}
      <a class="lk" href="${esc(pl.url)}" target="_blank" rel="noopener">${esc(pl.url)}</a>
    </div>`;
  }).join('');
}

// ===== 洞察区渲染：作战进度 + 平台占比 + 本周最佳 =====
function renderInsights(data){
  const p=data.platforms;
  const order=['instagram','facebook','youtube','x'];
  const vals=order.map(k=>p[k]?.value||0);
  const names=order.map(k=>p[k]?.name||k);
  const colors=order.map(k=>p[k]?.color||'#999');
  const total=vals.reduce((a,b)=>a+b,0);

  // 占比环图（SVG 描边分段）
  const R=52,C=2*Math.PI*R;
  let off=0;
  const segs=order.map((k,i)=>{
    const frac=total?vals[i]/total:0;
    const dash=frac*C;
    const seg=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${colors[i]}" stroke-width="18" stroke-dasharray="${dash.toFixed(1)} ${(C-dash).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)"/>`;
    off+=dash;
    return seg;
  }).join('');
  const donut=`<svg width="120" height="120" viewBox="0 0 120 120">${segs}</svg>`;
  const legendRows=order.map((k,i)=>`
    <div class="row"><span class="dot" style="background:${colors[i]}"></span>
      <span class="nm">${esc(names[i])}</span>
      <span class="pc2">${(total?vals[i]/total*100:0).toFixed(1)}%</span>
      <span class="vl">${fmt(vals[i])}</span></div>`).join('');

  // 本周最佳渠道（按周绝对增量，避免小基数百分比误导）
  const grows=order.map(k=>({name:p[k]?.name||k,wg:weeklyGrowth(p[k])}));
  const valid=grows.filter(g=>g.wg).sort((a,b)=>b.wg.diff-a.wg.diff);
  const best=valid[0];

  // 上线目标进度（目标值存 localStorage，可改）
  const target=Number(lsGet('gangstar_fan_target')||10000);
  const prog=Math.min(100,total/target*100);
  const remain=Math.max(0,target-total);
  const dl=daysToLaunch();
  const needDaily=dl>0?remain/dl:0;

  const el=document.getElementById('insights');
  if(!el) return;
  el.innerHTML=`
    <div class="panel">
      <h3><span class="em">🎯</span> 上线作战进度</h3>
      <div class="countdown"><span class="big">D-${dl}</span><span class="lbl">距 2026-08-20 正式上线</span></div>
      <div class="prog"><i style="width:${prog.toFixed(1)}%"></i></div>
      <div class="meta"><span>社区总粉丝 <b>${fmt(total)}</b></span><span>目标 <b>${fmt(target)}</b></span></div>
      <div class="meta"><span>完成度 <b>${prog.toFixed(1)}%</b></span><span>日均需 +<b>${needDaily.toFixed(0)}</b> 连 ${dl} 天</span></div>
      <div class="target-edit">目标值 <input id="targetInput" type="number" value="${target}" min="1"> <button id="targetSave">设为目标</button></div>
    </div>
    <div class="panel">
      <h3><span class="em">🥧</span> 平台粉丝占比</h3>
      <div class="donut-wrap">
        <div class="donut">${donut}<div class="center"><div class="n">${fmt(total)}</div><div class="t">总粉丝</div></div></div>
        <div class="legend">${legendRows}</div>
      </div>
      ${best?`<div style="margin-top:14px;text-align:center"><span class="badge">🏆 本周最佳 · ${esc(best.name)}（周 +${fmt(best.wg.diff)}）</span></div>`:''}
    </div>`;

  const saveBtn=document.getElementById('targetSave');
  if(saveBtn) saveBtn.onclick=()=>{
    const v=Number(document.getElementById('targetInput').value);
    if(v>0){pushUndo();lsSet('gangstar_fan_target',v);renderInsights(lastData);}
  };
}

let toastTimer=null;
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;
  clearTimeout(toastTimer);
  // 强制 reflow 后加 show
  void t.offsetWidth;
  t.classList.add('show');
  toastTimer=setTimeout(()=>t.classList.remove('show'),4000);
}

let lastData=null;
const isFile = (location.protocol==='file:');
async function loadFans(){
  try{
    const r=await fetch('fan_data.json',{cache:'no-store'});
    if(r.ok){lastData=await r.json();renderFans(lastData);return true;}
  }catch(e){}
  // 抓取失败（多为 file:// 或未连服务）→ 用内联兜底渲染，保证不空白
  if(lastData===null && typeof FALLBACK_DATA!=='undefined'){
    lastData=FALLBACK_DATA; renderFans(lastData); return true;
  }
  return false;
}

const SHARED = location.hostname.endsWith('github.io');
btn.onclick=async()=>{
  btn.disabled=true;btn.classList.add('loading');
  // 公网版（GitHub Pages）：无本地爬虫，刷新 = 重新拉取仓库内最新 fan_data.json
  if(SHARED){
    setStatus('⏳ 正在拉取最新粉丝数据…','info');
    try{
      const r=await fetch('./fan_data.json?t='+Date.now(),{cache:'no-store'});
      if(r.ok){
        const nd=await r.json();
        lastData=nd;renderFans(nd);
        btn.disabled=false;btn.classList.remove('loading');
        setStatus('✅ 已同步至 '+nd.updated_at,'ok');
        showToast('✅ 粉丝数据已同步\nIG: '+fmt(nd.platforms.instagram.value)+' | FB: '+fmt(nd.platforms.facebook.value)+' | YTB: '+fmt(nd.platforms.youtube.value),'ok');
      }else{ throw new Error('HTTP '+r.status); }
    }catch(e){
      btn.disabled=false;btn.classList.remove('loading');
      setStatus('⚠️ 拉取失败，请稍后重试','err');
    }
    return;
  }
  // ===== 以下为本地版（连接后台爬虫）逻辑 =====
  // 1. 进入加载态
  btn.disabled=true;btn.classList.add('loading');
  setStatus('⏳ 正在连接刷新服务…','info');

  try{
    // 2. POST 刷新请求
    const r=await fetch('/api/fan-refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ts:Date.now()})});

    if(r.ok){
      setStatus('✅ 请求已提交！后台正在读取 IG / FB / YTB / X…','ok');

      // 3. 轮询等待结果（最多 90 秒）
      let pollCount=0;
      const prevUpdate=lastData?lastData.updated_at:'';
      const pollTimer=setInterval(async()=>{
        pollCount++;
        try{
          const cr=await fetch('/fan_data.json?t='+Date.now(),{cache:'no-store'});
          if(cr.ok){
            const newData=await cr.json();
            if(newData.updated_at!==prevUpdate){
              // 数据已更新！
              clearInterval(pollTimer);
              lastData=newData;renderFans(newData);
              btn.disabled=false;btn.classList.remove('loading');
              setStatus('✅ 刷新成功！已更新至 '+newData.updated_at,'ok');
              showToast('✅ 粉丝数据刷新成功\nIG: '+fmt(newData.platforms.instagram.value)+
                ' | FB: '+fmt(newData.platforms.facebook.value)+
                ' | YTB: '+fmt(newData.platforms.youtube.value),'ok');
            }
          }
        }catch(e){/* ignore */}
        // 超时（已等待约 3.5 分钟）
        if(pollCount>70){
          clearInterval(pollTimer);
          btn.disabled=false;btn.classList.remove('loading');
          setStatus('⏱ 后台仍在读取中（通常几分钟内完成）。稍后切回本页即可看到更新；或直接在对话里让我「刷新粉丝数」立即更新','warn');
          showToast('⏱ 刷新请求已提交，后台读取中\n通常几分钟内完成，可稍后查看','err');
        }
      },3000);

    }else{
      throw new Error('HTTP '+r.status);
    }

  }catch(e){
    // 服务未连接 / file:// 直接打开：不跳走，仅提示正确打开方式
    btn.disabled=false;btn.classList.remove('loading');
    if(isFile){
      setStatus('请双击「Gangstar看板.app」打开看板，刷新按钮才能连接后台','warn');
    }else{
      setStatus('刷新服务未连接 — 请双击「Gangstar看板.app」重新打开','warn');
    }
  }
};

// 移动记录存 localStorage gangstar_sa_moves（pid -> 目标日期），源数据不动
function getSaMoves(){
  try{return JSON.parse(localStorage.getItem('gangstar_sa_moves')||'{}');}catch(e){return {};}
}
// 单日排序：南亚排期按「日期 -> [pid 序列]」记忆，pid 即卡片 data-pid（HQ/区域/自定义统一标识）
function getSaOrder(){try{return JSON.parse(localStorage.getItem('gangstar_sa_order')||'{}');}catch(e){return {};}}
function setSaOrder(date,pids){const o=getSaOrder();if(!pids||!pids.length)delete o[date];else o[date]=pids;localStorage.setItem('gangstar_sa_order',JSON.stringify(o));}
function sortSaPosts(posts,date){const ord=getSaOrder()[date];if(!ord||!ord.length)return posts;const idx={};ord.forEach((p,i)=>idx[p]=i);return posts.slice().sort((a,b)=>{const ia=(a.pid in idx)?idx[a.pid]:1e9;const ib=(b.pid in idx)?idx[b.pid]:1e9;return ia-ib;});}
(function bindSaDrag(){
  const root=document.getElementById('southAsiaView');
  if(!root) return;
  let drag=null;

  function cellAt(x,y){
    const els=document.elementsFromPoint(x,y)||[];
    for(const el of els){ if(el&&el.closest){const c=el.closest('.sa-cell'); if(c) return c;} }
    return null;
  }
  function moveGhost(x,y){
    if(!drag) return;
    drag.gx=x-drag.dx; drag.gy=y-drag.dy;
    if(!drag.raf){
      drag.raf=requestAnimationFrame(function(){
        drag.raf=0;
        drag.ghost.style.transform='translate3d('+drag.gx+'px,'+drag.gy+'px,0) rotate(-1.5deg)';
      });
    }
  }
  function cleanup(){
    if(!drag) return;
    const d=drag; drag=null;
    if(d.raf) cancelAnimationFrame(d.raf);
    if(d.ghost&&d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    d.item.classList.remove('dragging');
    if(d.cell) d.cell.classList.remove('drop-over');
    document.body.style.userSelect='';
    return d;
  }

  root.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0) return;
    const h=e.target.closest&&e.target.closest('.sa-drag');
    if(!h) return;
    const item=h.closest('.sa-post');
    if(!item||!item.getAttribute('data-pid')) return;
    e.preventDefault(); e.stopPropagation();
    const cell0=item.closest('.sa-cell')?item.closest('.sa-cell'):null;
    const originDate=cell0?cell0.getAttribute('data-date'):'';
    const rect=item.getBoundingClientRect();
    const ghost=item.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width=rect.width+'px';
    ghost.style.left='0px'; ghost.style.top='0px';
    ghost.style.transform='translate3d(0,0,0)';
    ghost.style.willChange='transform';
    document.body.appendChild(ghost);
    drag={pid:item.getAttribute('data-pid'),ruid:item.getAttribute('data-ruid')||'',date:originDate,item:item,ghost:ghost,dx:e.clientX-rect.left,dy:e.clientY-rect.top,cell:null,moved:false,raf:0,gx:0,gy:0};
    item.classList.add('dragging');
    try{h.setPointerCapture(e.pointerId);}catch(_){}
    document.body.style.userSelect='none';
    moveGhost(e.clientX,e.clientY);
  });

  document.addEventListener('pointermove',e=>{
    if(!drag) return;
    e.preventDefault();
    drag.moved=true;
    moveGhost(e.clientX,e.clientY);
    const cell=cellAt(e.clientX,e.clientY);
    if(drag.cell&&drag.cell!==cell) drag.cell.classList.remove('drop-over');
    if(cell) cell.classList.add('drop-over');
    drag.cell=cell;
    if(cell && cell.getAttribute('data-date')===drag.date){
      cell.querySelectorAll('.sa-post.rb,.sa-post.ra').forEach(x=>x.classList.remove('rb','ra'));
      const sp=[...cell.querySelectorAll('.sa-post')].filter(x=>x!==drag.item);
      let tgt=null;
      for(const p of sp){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){tgt=p;break;}}
      if(tgt) tgt.classList.add('rb'); else if(sp.length){sp[sp.length-1].classList.add('ra');}
    }else{
      root.querySelectorAll('.sa-post.rb,.sa-post.ra').forEach(x=>x.classList.remove('rb','ra'));
    }
  },{passive:false});

  document.addEventListener('pointerup',e=>{
    if(!drag) return;
    const cell=drag.cell, pid=drag.pid, ruid=drag.ruid, moved=drag.moved, od=drag.date, di=drag.item;
    cleanup();
    if(!cell||!moved) return;
    const target=cell.getAttribute('data-date');
    if(target===od){
      pushUndo();
      const c=root.querySelector('.sa-cell[data-date="'+target+'"]');
      const sp=[...c.querySelectorAll('.sa-post')].filter(x=>x!==di);
      let beforePid=null;
      for(const p of sp){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){beforePid=p.getAttribute('data-pid');break;}}
      let seq=sp.map(x=>x.getAttribute('data-pid'));
      if(beforePid===null) seq.push(pid); else{const i=seq.indexOf(beforePid);if(i<0)seq.push(pid);else seq.splice(i,0,pid);}
      setSaOrder(target,seq);
      renderSouthAsia();
      return;
    }
    if(!target) return;
    pushUndo();
    if(ruid){
      // 区域素材：与「区域素材周历」共用同一份移动记录，两个视图保持一致
      const orig=(ruid.split('|')[1])||'';
      const rm=getRegionMoves();
      if(target===orig) delete rm[ruid]; else rm[ruid]=target;
      localStorage.setItem('gangstar_regional_moves',JSON.stringify(rm));
    }else if(pid.indexOf('cus|')===0){
      // 自定义素材：与区域周历共用 gangstar_regional_moves（cus|<id> -> 目标日期），两表同步
      const cid=pid.slice(4);
      let orig='';
      try{const custom=JSON.parse(localStorage.getItem('gangstar_custom')||'{}');for(const d in custom){if((custom[d]||[]).some(x=>String(x._id)===cid)){orig=d;break;}}}catch(e){}
      const rm=getRegionMoves();
      if(target===orig) delete rm[pid]; else rm[pid]=target;
      localStorage.setItem('gangstar_regional_moves',JSON.stringify(rm));
    }else{
      const orig=(pid.split('|')[1])||'';
      const moves=getSaMoves();
      if(target===orig) delete moves[pid]; else moves[pid]=target;
      localStorage.setItem('gangstar_sa_moves',JSON.stringify(moves));
    }
    renderSouthAsia();
  });

  document.addEventListener('pointercancel',()=>{cleanup();});
  window.addEventListener('blur',()=>{cleanup();});
})();

function renderSouthAsia(){
  const el=document.getElementById('southAsiaView');
  if(!el) return;
  if(typeof HQ_DATA==='undefined'){
    el.innerHTML='<p style="color:var(--muted);padding:40px;text-align:center">HQ 数据未加载（hq_data.js）</p>';
    return;
  }
  saDetailMap={};saEditMap={}; // 每次渲染重置

  // 类型显示信息
  const TYPE_INFO={};
  (CONTENT_TYPES||[]).forEach(t=>TYPE_INFO[t.key]=t);
  TYPE_INFO['hq']={key:'hq',name:'HQ公线',color:'#7c5cd6'};
  const HQ_BADGE={name:'HQ公线',color:'#7c5cd6'};

  // 区域素材按日期索引（含 localStorage 自定义）
  const saMoves=getSaMoves();
  const regMoves=(typeof getRegionMoves==='function')?getRegionMoves():{};
  const regByDate={};
  const pushReg=(date,it,pid,ruid)=>{
    const eff=(ruid&&regMoves[ruid])||saMoves[pid]||date;
    (regByDate[eff]=regByDate[eff]||[]).push({...it,_pid:pid,_ruid:ruid||''});
  };
  ((REGIONAL_DATA&&REGIONAL_DATA.weeks)||[]).forEach(w=>{
    Object.entries(w.items||{}).forEach(([date,arr])=>{
      (arr||[]).forEach((it,ii)=>pushReg(date,it,'reg|'+date+'|'+it.type+'|'+it.title+'|'+ii,w.range+'|'+date+'|'+it.type+'|'+it.title+'|'+ii));
    });
  });
  // 合并 localStorage 自定义素材
  try{
    const custom=JSON.parse(localStorage.getItem('gangstar_custom')||'{}');
    Object.entries(custom).forEach(([date,arr])=>{
      (arr||[]).forEach(it=>pushReg(date,{...it,custom:true},it._id?('cus|'+it._id):('reg|'+date+'|'+it.type+'|'+it.title),it._id?('cus|'+it._id):''));
    });
  }catch(e){}
  // 加载隐藏/取消状态
  const hidden=new Set();
  const cancelledSet=new Set();
  try{
    JSON.parse(localStorage.getItem('gangstar_hidden')||'[]').forEach(id=>hidden.add(id));
    JSON.parse(localStorage.getItem('gangstar_cancelled')||'[]').forEach(id=>cancelledSet.add(id));
  }catch(e){}
  const reqs=getReqSubmitted();
  const dels=getDelayed();
  // 加载编辑覆盖
  const edits={};
  try{Object.assign(edits,JSON.parse(localStorage.getItem('gangstar_edits')||'{}'));}catch(e){}

  // 统计
  let hqCnt=0, regCnt=0;

  // 筛选开关
  const chipsHtml=`<div class="sa-filters">
    <span class="f-label">筛选：</span>
    <span class="chip all ${saActive.size===SA_ALL.length?'on':''}" data-f="all">全部</span>
    ${SA_FILTERS.map(f=>`<span class="chip ${saActive.has(f.key)?'on':''}" data-f="${f.key}">${f.label}</span>`).join('')}
  </div>`;

  // 图例
  const legendHtml=`<div class="sa-legend">
    <span class="lg"><span class="lgd" style="background:${HQ_BADGE.color}"></span>HQ公线</span>
    ${(CONTENT_TYPES||[]).map(t=>`<span class="lg"><span class="lgd" style="background:${t.color}"></span>${t.name}</span>`).join('')}
    <span class="lg"><span class="lgd" style="background:#e53e3e"></span>延期（点「延」标记）</span>
  </div>`;

  const today=todayStr();
  const hq=HQ_DATA;
  const allWeeks=hq.july.concat(hq.august);
  // HQ 素材按日期索引（应用拖拽移动记录）
  const hqByDate={};
  allWeeks.forEach(w=>(w.cells||[]).forEach(c=>{
    (c.posts||[]).forEach(p=>{
      const pid='hq|'+c.date+'|'+p.brief;
      const eff=saMoves[pid]||c.date;
      (hqByDate[eff]=hqByDate[eff]||[]).push({p:p,pid:pid});
    });
  }));
  allWeeks.forEach((w,i)=>w._idx=i);
  const current=allWeeks.find(w=>w.monday<=today&&today<=w.sunday)||(today<allWeeks[0].monday?allWeeks[0]:allWeeks[allWeeks.length-1]);
  const future=allWeeks.filter(w=>w!==current&&w.monday>today).sort((a,b)=>a._idx-b._idx);
  const past=allWeeks.filter(w=>w!==current&&w.sunday<today).sort((a,b)=>a._idx-b._idx);
  const order=[current,...future,...past];

  const weeksHtml=order.map((w)=>{
    const isCur=(w===current);
    const expanded=!(w.sunday<today); // 当前周+未来周展开，历史周折叠
    const band=`<div class="sa-wband" style="background:${w.color}">
      <span class="wk">第${w._idx+1}周</span>
      <span class="rng">${w.range}</span>
      <span class="th">📌 ${esc(w.theme)}</span>
      ${isCur?'<span class="cur">🔸 本周</span>':''}
      <button class="toggle" type="button">${expanded?'收起 ▴':'展开 ▾'}</button>
    </div>`;
    const cells=w.cells.map(c=>{
      const isLaunch=c.date===hq.launch;
      const isToday=(c.date===today);
      let posts=[];
      // HQ 公线素材
      (hqByDate[c.date]||[]).forEach(hp=>{
        const p=hp.p, pid=hp.pid;
        if(hidden.has(pid)) return;
        if(!!dels[pid] && !saActive.has('delay')) return; // 延期键未选中则隐藏延期卡（与其他类别键一致）
        if(saActive.has('hq')||(saActive.has('delay')&&!!dels[pid])){
          let brief=p.brief, plat=p.plat||'';
          const ov=edits[pid];
          if(ov){ if(ov.title) brief=ov.title; if(ov.partner!==undefined) plat=ov.partner; }
          saDetailMap[pid]={fullBrief:(ov&&ov.title)||p.fullBrief||p.brief,fullTime:p.fullTime||p.time,plat:plat};
          saEditMap[pid]={isHQ:true,title:brief,partner:plat};
          posts.push({pid,badge:HQ_BADGE,time:p.time,brief,plat,sub:'',cancelled:cancelledSet.has(pid),hasDetail:true});
          hqCnt++;
        }
      });
      // 区域自产素材（按日期匹配，含自定义）
      (regByDate[c.date]||[]).forEach(it=>{
        const pid=it._pid||(it._id?('cus|'+it._id):('reg|'+c.date+'|'+it.type+'|'+it.title));
        const opId=it._ruid||pid;
        if(hidden.has(opId)) return;
        const ov=edits[opId];
        let title=it.title, type=it.type, partner=it.partner||'', desc=it.desc||'', hashtags=[];
        if(ov){ if(ov.title) title=ov.title; if(ov.type) type=ov.type; if(ov.partner!==undefined) partner=ov.partner; if(ov.desc!==undefined) desc=ov.desc; if(ov.hashtags) hashtags=ov.hashtags; }
        const tag=(REGION_TAGS[type]||[])[0];
        if(saActive.has(tag)||(saActive.has('delay')&&!!dels[opId])){
          if(!!dels[opId] && !saActive.has('delay')) return; // 延期键未选中则隐藏延期卡（与其他类别键一致）
          const ti=TYPE_INFO[type]||{name:type,color:'#888'};
          saEditMap[opId]={isHQ:false,title,type,partner,desc,hashtags};
          posts.push({pid:opId,ruid:it._ruid||'',badge:ti,time:'',brief:title,plat:partner,sub:desc,hashtags,custom:!!it.custom,cid:it._id||'',cdate:c.date,cancelled:cancelledSet.has(opId),isRegion:true});
          regCnt++;
        }
      });
      posts=sortSaPosts(posts,c.date);
      // 延时项沉底（排到当天排期最后）
      posts=posts.slice().sort((a,b)=>(dels[a.pid]?1:0)-(dels[b.pid]?1:0));
      const body=posts.length?posts.map(p=>{
        const badge=`<span class="t" style="background:${p.badge.color}">${esc(p.badge.name)}</span>`;
        const timeHtml=p.time?`<span class="sa-mtime">${esc(p.time)}</span>`:'';
        const platHtml=p.plat?`<div class="p">${esc(p.plat)}</div>`:'';
        const subHtml=p.sub?`<div class="p" style="color:var(--ink)">${esc(p.sub)}</div>`:'';
        const htHtml=(p.hashtags&&p.hashtags.length)?`<div class="p ht-tags">${p.hashtags.map(h=>`<span class="ht-tag">${esc(h)}</span>`).join('')}</div>`:'';
        const cls=p.cancelled?' cancelled':'';
        const cancelCls=p.cancelled?'act cancel on':'act cancel';
        const detailAttr=p.hasDetail?` data-detail="${p.pid}" style="cursor:pointer"`:'';
        const reqOn=p.isRegion?!!p.pid&&!!reqs[p.pid]:false;
        const reqHtml=p.isRegion?`<span class="req-box ${reqOn?'on':''}" data-uid="${esc(p.pid)}" title="点此确认：已提交制作需求"><span class="mk">${reqOn?'✓':''}</span>${reqOn?'已提需求':'提需求'}</span>`:'';
        const delOn=!!p.pid&&!!dels[p.pid];
        const delCls=delOn?' delayed':'';
        const delayBadge=delOn?'<span class="delay-badge">DELAY</span>':'';
        return `<div class="sa-post${cls}${delCls}" data-pid="${p.pid}"${p.ruid?` data-ruid="${p.ruid}"`:''}${detailAttr}><div class="sp-head">${delayBadge}${badge}${timeHtml}<span class="sp-acts"><span class="act sa-drag" title="按住拖拽改日期">⠿</span><span class="act edit" data-pid="${p.pid}" title="编辑">✎</span><span class="${cancelCls}" data-pid="${p.pid}" title="划线/恢复">划</span><span class="act delay ${delOn?'on':''}" data-pid="${p.pid}" title="标记此素材为延期 / Delay">延</span><span class="act del" data-pid="${p.pid}" title="删除">×</span></span></div><div class="sp-body"><div class="b">${esc(p.brief)}</div>${platHtml}${subHtml}${htHtml}${reqHtml}</div></div>`;
      }).join(''):'<div class="sa-empty-tip">—</div>';
      return `<div class="sa-cell${isLaunch?' launch':''}${isToday?' is-today':''}${posts.length?'':' empty'}" data-date="${c.date}">
        <div class="sa-dhead"><span>${c.date.slice(5)}</span><span class="dow">${isToday?'今天':('周'+c.dow)}</span></div>${body}<span class="sa-add-btn" data-date="${c.date}" title="添加素材">+</span></div>`;
    }).join('');
    return `<div class="sa-week"><div class="sa-wband-wrap">${band}</div><div class="sa-wbody${expanded?'':' collapsed'}"><div class="sa-cells">${cells}</div></div></div>`;
  }).join('');

  const gridHtml=`<div class="sa-section">
    <div class="sa-banner hq">📋 南亚社群排期 <span class="cnt">HQ ${hqCnt} 条 · 区域 ${regCnt} 条</span>${hidden.size?`<span class="sa-restore" id="restoreBtn">↩ 恢复已删除(${hidden.size})</span>`:''}</div>
    <div class="sa-grid-wrap">
      <div class="sa-grid">${weeksHtml}</div>
      <div class="sa-arrows"><button class="sa-arrow sa-left" title="向左滑动">‹</button><button class="sa-arrow sa-right" title="向右滑动">›</button></div>
    </div>
  </div>`;

  const capHtml=`<div class="sa-cap">
    <span class="ca-t">🔧 团队产能</span>

// 弹窗关闭守卫：只要用户在任一输入框按下/聚焦/选中/输入，就视为已介入，点遮罩不再能误关
// （防编辑标题/描述时选中文字、拖选松手落背景等把弹窗秒关丢内容）。只有「完全没碰过」且
// 点击手势确实从背景开始（排除框内拖选松手到背景），点遮罩才允许直接关。保存/取消始终可用。
function modalChangedGuard(bg){
  let engaged=false;
  const fields=bg.querySelectorAll('input,select,textarea');
  fields.forEach(el=>{
    el.addEventListener('input',()=>engaged=true);
    el.addEventListener('change',()=>engaged=true);
    el.addEventListener('focus',()=>engaged=true);
    el.addEventListener('pointerdown',()=>engaged=true);
    el.addEventListener('mousedown',()=>engaged=true);
  });
  let downOnBg=false;
  bg.addEventListener('pointerdown',e=>{ downOnBg=(e.target===bg); });
  bg.addEventListener('click',e=>{
    if(e.target!==bg) return;        // 只处理点到背景遮罩
    if(!downOnBg) return;            // 手势不是从背景开始（如框内拖选松手到背景）→ 忽略
    if(engaged) return;             // 已介入过 → 必须点 取消/保存
    bg.remove();
  });
}

});

// 构建 Hashtag 选择器 HTML（返回 HTML 字符串，existing=已选数组）
function buildHashtagPicker(existing){
  const sel=new Set((existing||[]).map(h=>h.toLowerCase()));
  // 最近使用（7天内）置顶区
  let recentHtml='';
  try{
    const KEY='gangstar_hashtag_history';
    const hist=JSON.parse(localStorage.getItem(KEY)||'[]');
    const cutoff=Date.now()-7*24*3600*1000;
    const recent=hist.filter(h=>h.ts>=cutoff).sort((a,b)=>b.ts-a.ts).map(h=>h.tag);
    if(recent.length){
      const rc=recent.map(h=>`<span class="ht-chip" data-tag="${esc(h)}">${esc(h)}</span>`).join('');
      recentHtml=`<label class="ht-recent-label">最近使用（7天内）</label><div class="ht-chips ht-recent" id="ht-recent">${rc}</div>`;
    }
  }catch(e){}
  const chips=HASHTAG_PRESETS.map(h=>`<span class="ht-chip" data-tag="${esc(h)}">${esc(h)}</span>`).join('');
  const selHtml=(existing||[]).map(h=>`<span class="ht-chip ht-active" data-tag="${esc(h)}">${esc(h)}<b class="ht-x" title="移除">×</b></span>`).join('');
  return `<div class="ht-row">${recentHtml}
    <label>已选 Hashtag（点下方标签或输入回车添加；点 × 或点已选标签移除）</label>
    <div class="ht-chips ht-sel" id="ht-selected">${selHtml}</div>
    <label>推荐 / 最近标签</label>
    <div class="ht-chips" id="ht-pool">${chips}</div>
    <input type="text" id="ht-custom" placeholder="自定义标签，回车添加">
  </div>`;
}
// 在「已选」行中加入/移出某个 hashtag（按标签去重）
function toggleHashtagSelected(bg, tag){
  if(!bg||!tag) return;
  const sel=bg.querySelector('#ht-selected'); if(!sel) return;
  const found=[...sel.querySelectorAll('.ht-chip')].find(c=>c.dataset.tag.toLowerCase()===tag.toLowerCase());
  if(found){ found.remove(); return; }
  const sp=document.createElement('span');
  sp.className='ht-chip ht-active'; sp.dataset.tag=tag;
  sp.innerHTML=esc(tag)+'<b class="ht-x" title="移除">×</b>';
  sel.appendChild(sp);
}

// 从弹窗 DOM 收集已选 Hashtags（返回数组）——「已选」行为唯一数据源
function collectHashtags(){
  const chips=[...document.querySelectorAll('#ht-selected .ht-chip')].map(el=>el.dataset.tag);
  const custom=document.getElementById('ht-custom').value.trim();
  if(custom) custom.split(/[,，]/).forEach(h=>{ h=h.trim(); if(h){ if(!h.startsWith('#'))h='#'+h; if(!chips.some(c=>c.toLowerCase()===h.toLowerCase())) chips.push(h); }});
  return chips;
}

// 记录使用过的 hashtag（写入 localStorage，自动经 Firebase 同步多端；保留 7 天）
function recordHashtagUsage(tags){
  try{
    const KEY='gangstar_hashtag_history';
    let hist=[];
    try{ hist=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ hist=[]; }
    const now=Date.now();
    (tags||[]).forEach(t=>{
      t=(t||'').trim(); if(!t) return;
      if(!t.startsWith('#')) t='#'+t;
      const i=hist.findIndex(h=>h.tag.toLowerCase()===t.toLowerCase());
      if(i>=0) hist[i].ts=now; else hist.push({tag:t,ts:now});
    });
    const cutoff=now-7*24*3600*1000;
    hist=hist.filter(h=>h.ts>=cutoff);
    localStorage.setItem(KEY,JSON.stringify(hist));
  }catch(e){}
}
