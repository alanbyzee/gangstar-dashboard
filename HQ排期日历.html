  const wk=document.createElement('div');
  wk.className='week';
  const band=`<div class="wband" style="background:${w.color}">
      <span class="wk">第${w._idx+1}周</span>
      <span class="rng">${w.range}</span>
      <span class="th">📌 本周主题：${w.theme}</span>
      ${isCur?`<span class="cur">🔸 本周</span>`:''}
      <button class="toggle" type="button" aria-label="展开/收起">${expanded?'收起 ▴':'展开 ▾'}</button>
    </div>`;
  let cells='';
  w.cells.forEach(c=>{
    const isLaunch=c.date===DATA.launch;
    let body;
    if(!c.posts.length){ body='<div class="empty-tip">—</div>'; }
    else{
      body=c.posts.map(p=>{
        const plat=p.plat?`<div class="p">📡 ${esc(p.plat)}</div>`:'';
        return `<div class="post"><span class="t">${esc(p.time||'--')}</span><div class="b">${esc(p.brief)}</div>${plat}</div>`;
      }).join('');
    }
    cells+=`<div class="cell${isLaunch?' launch':''}${c.posts.length?'':' empty'}">
        <div class="dhead"><span>${c.date.slice(5)}</span><span class="dow">周${c.dow}</span></div>${body}</div>`;
  });
  wk.innerHTML=band+`<div class="wbody${expanded?'':' collapsed'}"><div class="grid">${cells}</div></div>`;
  const btn=wk.querySelector('.toggle');
  btn.addEventListener('click',()=>{
    const body=wk.querySelector('.wbody');
    const col=body.classList.toggle('collapsed');
    btn.textContent=col?'展开 ▾':'收起 ▴';
  });
  return wk;
}

const root=document.getElementById('root');
function sep(txt,sub){const d=document.createElement('div');d.className='sep';d.innerHTML=`<span>${txt}</span>${sub?`<small>${sub}</small>`:''}`;return d;}

// 渲染顺序：当前周（展开）→ 未来周（展开）→ 历史周（折叠）
root.appendChild(renderWeek(current, true));
if(future.length){
  root.appendChild(sep('▸ 未来排期','即将到来'));
  future.forEach(w=>root.appendChild(renderWeek(w, true)));
}
if(past.length){
  root.appendChild(sep('▾ 历史排期','已发布 · 默认折叠，点「展开」查看'));
  past.forEach(w=>root.appendChild(renderWeek(w, false)));
}
</script>
</body>
</html>
