name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gangstar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use 分享版 as index.html
        run: |
          set -e
          export LC_ALL=C.UTF-8
          LANG=C.UTF-8
          # Find the share-version file (Chinese filename safe via glob)
          SRC=$(ls *分享版.html 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: 分享版 file not found"
            ls -la *.html
            exit 1
          fi
          echo "Found: $SRC"
          cp "$SRC" index.html
          echo "Copied $SRC -> index.html"
          ls -la index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
