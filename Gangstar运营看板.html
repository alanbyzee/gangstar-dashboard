<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gangstar 运营看板</title>
<style>
:root{
  --bg:#eef1f7;
  --card:#ffffff;
  --ink:#1e2433;
  --muted:#7c8499;
  --line:#e7eaf1;
  --brand:#6d28d9;
  --brand2:#2563eb;
  --brand-soft:#f2eeff;
  --ok:#10b981;
  --err:#ef4444;
  --warn:#f59e0b;
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 24px rgba(16,24,40,.09);
  --shadow-lg:0 16px 44px rgba(16,24,40,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 420px at 50% -140px, rgba(109,40,217,.07), transparent 62%),
    linear-gradient(180deg,#f7f8fc 0%, #eef1f7 100%);
  color:var(--ink);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* 自定义滚动条 */
.view.scroll::-webkit-scrollbar,.fan::-webkit-scrollbar,.regional::-webkit-scrollbar,.southasia::-webkit-scrollbar,.sa-modal::-webkit-scrollbar{width:10px;height:10px}
.view.scroll::-webkit-scrollbar-thumb,.fan::-webkit-scrollbar-thumb,.regional::-webkit-scrollbar-thumb,.southasia::-webkit-scrollbar-thumb{background:#d3d8e3;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.view.scroll::-webkit-scrollbar-thumb:hover,.fan::-webkit-scrollbar-thumb:hover,.regional::-webkit-scrollbar-thumb:hover,.southasia::-webkit-scrollbar-thumb:hover{background:#b9c0d0;background-clip:padding-box}

/* ===== 顶部导航 ===== */
.topbar{
  display:flex;align-items:center;gap:18px;padding:13px 24px;
  background:linear-gradient(180deg,#ffffff,#fbfbff);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 14px rgba(16,24,40,.05);
  z-index:5;flex:none;
}
.brand{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:.2px}
.brand .dot{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 0 4px rgba(109,40,217,.13)}
.tabs{display:flex;gap:6px;margin-left:8px;background:#f1f2f7;padding:5px;border-radius:14px}
.tab{padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid transparent;background:transparent;transition:.18s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 4px 12px rgba(109,40,217,.28)}
.spacer{flex:1}
.upd{font-size:12px;color:var(--muted);background:#f3f4f8;padding:6px 13px;border-radius:20px;border:1px solid var(--line)}
.undo-btn{margin-left:10px;padding:8px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.undo-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);box-shadow:0 3px 10px rgba(109,40,217,.12)}
.undo-btn:active{transform:translateY(1px)}

/* ===== 内容区 ===== */
.stage{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.active{display:block;animation:viewIn .26s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view.scroll{overflow:auto;padding-right:2px}

/* ===== 粉丝监控 ===== */
.fan{padding:28px 24px 44px;max-width:1180px;margin:0 auto}
.fan h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.fan .sub{font-size:13px;color:var(--muted);margin-bottom:22px}

/* 汇总卡片 */
.summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 19px;min-width:152px;box-shadow:var(--shadow-sm);transition:.2s}
.stat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:23px;font-weight:800;margin-top:3px}

/* 工具栏 + 刷新状态 */
.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.refresh{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;padding:11px 21px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(109,40,217,.28);display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;transition:.18s}
.refresh:hover{box-shadow:0 6px 18px rgba(109,40,217,.36)}
.refresh:active{transform:translateY(1px)}
.refresh[disabled]{opacity:.65;cursor:default}

/* 刷新按钮内 spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.refresh .spin{display:none;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.refresh.loading .spin{display:inline-block}
.refresh.loading .btn-text{opacity:.5}

/* 状态文字 */
.status{font-size:13px;font-weight:600;padding:6px 13px;border-radius:9px;display:none}
.status.show{display:inline-block}
.status.ok{color:var(--ok);background:#ecfdf5;border:1px solid #a7f3d0}
.status.err{color:var(--err);background:#fef2f2;border:1px solid #fecaca}
.status.warn{color:var(--warn);background:#fffbeb;border:1px solid #fde68a}
.status.info{color:var(--brand2);background:#eff6ff;border:1px solid #bfdbfe}

/* Toast 通知 */
.toast{position:fixed;top:80px;right:24px;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:999;transform:translateX(120%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-width:380px;line-height:1.5;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(0)}
.toast.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.toast.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}

/* 平台卡片网格 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:.2s;box-shadow:var(--shadow-sm)}
.pc:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pc .bar{position:absolute;top:0;left:0;width:5px;height:100%;border-radius:16px 0 0 16px}
.pc .ph{display:flex;align-items:center;gap:9px}
.pc .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.pc .nm{font-size:14px;font-weight:800}
.pc .hd{font-size:11px;color:var(--muted)}
.pc .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.pc .big small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.pc .delta{font-size:12px;font-weight:700}
.pc .delta.up{color:var(--ok)}.pc .delta.down{color:var(--err)}.pc .delta.flat{color:#9ca3af}
.pc .note{font-size:11px;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:4px 8px}
/* 折线图区域 */
.chart-area{margin-top:4px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px}
.chart-area svg{width:100%;height:auto}
.pc .lk{font-size:11px;color:var(--brand);text-decoration:none;word-break:break-all}
.pc .lk:hover{text-decoration:underline}

/* ===== 洞察区：作战进度 + 占比 ===== */
.insights{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:22px}
@media(max-width:760px){.insights{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:var(--shadow-sm);transition:.2s}
.panel:hover{box-shadow:var(--shadow-md)}
.panel h3{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.panel h3 .em{font-size:15px}

/* 目标进度 */
.countdown{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.countdown .big{font-size:34px;font-weight:800;color:var(--brand);line-height:1}
.countdown .lbl{font-size:13px;color:var(--muted)}
.prog{height:14px;background:#eef2f7;border-radius:9px;overflow:hidden;margin:12px 0 6px;box-shadow:inset 0 1px 2px rgba(16,24,40,.06)}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:9px;transition:width .6s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.meta b{color:var(--ink)}
.target-edit{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:12px}
.target-edit input{width:84px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:700;color:var(--ink)}
.target-edit button{font-size:12px;padding:5px 11px;border:none;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:7px;cursor:pointer;font-weight:700;transition:.15s}
.target-edit button:hover{box-shadow:0 3px 10px rgba(109,40,217,.25)}
.target-edit button:active{transform:translateY(1px)}

/* 占比环图 */
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{position:relative;flex:none;width:120px;height:120px}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .center .n{font-size:20px;font-weight:800}
.donut .center .t{font-size:10px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12px;flex:1}
.legend .row{display:flex;align-items:center;gap:7px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{font-weight:700;min-width:64px}
.legend .pc2{color:var(--muted)}
.legend .vl{margin-left:auto;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:6px 13px;border-radius:20px;font-size:13px;font-weight:800;box-shadow:0 3px 10px rgba(217,119,6,.3)}

/* 卡片动能行 */
.momentum{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.momentum .m{display:flex;flex-direction:column;gap:2px}
.momentum .m .k{font-size:10px;color:var(--muted)}
.momentum .m .v{font-size:13px;font-weight:800}
.m-up{color:var(--ok)}.m-down{color:var(--err)}.m-flat{color:#9ca3af}

/* ===== 区域素材周历 ===== */
.regional{padding:22px 24px 44px;max-width:1280px;margin:0 auto}
.regional h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.regional .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
/* 周历表头 */
.cal-head{display:grid;grid-template-columns:140px repeat(7,1fr);gap:0;border:1px solid var(--line);border-radius:14px 14px 0 0;overflow:hidden;box-shadow:var(--shadow-sm)}
.cal-head>div{text-align:center;padding:12px 6px;font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.cal-head>div:first-child{background:#fbfbfe;color:var(--ink);border-right:1px solid var(--line)}
.cal-head .date-num{font-size:15px;display:block;margin-top:2px}
.cal-head .dow{font-size:11px;opacity:.85}
.cal-head .today-ring{box-shadow:inset 0 0 0 2px #fbbf24,0 0 8px rgba(251,191,36,.4);border-radius:8px}
/* 周历行 */
.cal-body{display:grid;grid-template-columns:140px repeat(7,1fr);gap:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.cal-row{display:contents}
.type-label{padding:12px 14px;font-size:12px;font-weight:700;color:var(--ink);background:#fafbfc;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.type-label .dot{width:9px;height:9px;border-radius:3px;flex:none}
.cell{padding:8px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:56px;background:#fff;font-size:12px;position:relative;transition:background .12s}
.cell:hover{background:#fcfcff}
.cell:last-child{border-right:none}
/* 素材卡片 */
.item{background:#fafbfd;border:1px solid #eef0f4;border-radius:10px;padding:9px 56px 9px 11px;margin-bottom:7px;font-size:12px;line-height:1.5;transition:box-shadow .15s,transform .12s;position:relative}
.item .drag-handle{position:absolute;top:5px;right:5px;width:19px;height:19px;display:flex;align-items:center;justify-content:center;border:1px solid #e2e5ea;border-radius:5px;background:#eef0f4;color:#9aa1ac;font-size:11px;line-height:1;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:.12s}
.item .drag-handle:hover{background:#f59e0b;border-color:#f59e0b;color:#fff;transform:scale(1.08)}
.item .drag-handle:active{cursor:grabbing}
.item.dragging{opacity:.3}
.drag-ghost{position:fixed !important;margin:0 !important;pointer-events:none;z-index:9999;opacity:.96;box-shadow:0 12px 28px rgba(0,0,0,.2);transform:rotate(-1.5deg);background:#fff}
.cell.drop-over{background:#fff7ed;outline:2px dashed #f59e0b;outline-offset:-3px}
.item:hover{box-shadow:0 4px 14px rgba(16,24,40,.09);transform:translateY(-1px)}
.item .item-acts{position:absolute;top:3px;right:26px;display:flex;gap:1px;opacity:0;transition:.12s;z-index:3}
.item:hover .item-acts{opacity:1}
.item .iact{cursor:pointer;font-size:10px;line-height:1.4;color:#9aa1ac;padding:1px 3px;border-radius:3px;user-select:none;-webkit-user-select:none}
.item .iact:hover{background:#eef0f4;color:#64748b}
.item .iact.del:hover{color:#ef4444}
.item .iact.cancel.on{color:#e14b4b;background:#fbdddd}
.item.cancelled .title,.item.cancelled .tag,.item.cancelled .partner{text-decoration:line-through;opacity:.6}
.reg-add{cursor:pointer;margin-left:5px;font-weight:800;opacity:.4;color:#fff;transition:.15s}
.reg-add:hover{opacity:1}
.cal-head>div{position:relative}
.item .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;display:inline-block;margin-bottom:2px;margin-right:4px}
.item .title{font-weight:600;color:var(--ink);font-size:12.5px;line-height:1.45}
.item .partner{color:var(--muted);font-size:10.5px;margin-top:3px;line-height:1.4}
.item .partner u{color:var(--brand2);text-decoration:none;font-weight:600}
.item .req-row{margin-top:5px}
.req-box{display:inline-flex;align-items:center;gap:3px;margin-top:5px;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:9.5px;color:#c0c7d2;transition:.15s}
.req-box:hover{color:#959ba5}
.req-box .mk{width:12px;height:12px;border:1.2px solid #d0d5de;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;line-height:1;color:transparent;transition:.12s}
.req-box.on{color:#6aab54}
.req-box.on .mk{background:#58a83c;border-color:#58a83c;color:#fff}
/* 类型色 */
.t-copost{border-left:3px solid #2f80ed}.t-copost .tag{background:#dbeafe;color:#1d4ed8}
.t-meme{border-left:3px solid #f2994a}.t-meme .tag{background:#fdebd7;color:#b45309}
.t-kol{border-left:3px solid #e05299}.t-kol .tag{background:#fbdcee;color:#b0307a}
.t-koc{border-left:3px solid #12a594}.t-koc .tag{background:#d2f0eb;color:#0b7a6e}
.t-poster{border-left:3px solid #58a83c}.t-poster .tag{background:#e0f0d8;color:#3a7a24}
.t-gameplay{border-left:3px solid #e14b4b}.t-gameplay .tag{background:#fbdddd;color:#b02a2a}
/* 统计条 */
.regional-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rstat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 17px;min-width:122px;box-shadow:var(--shadow-sm);transition:.2s}
.rstat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.rstat .rk{font-size:11px;color:var(--muted)}.rstat .rv{font-size:18px;font-weight:800;margin-top:2px}
/* 周导航 */
.week-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.week-nav button{padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow-sm)}
.week-nav button:hover{border-color:var(--brand);color:var(--brand);box-shadow:var(--shadow-md)}
.week-nav .wlbl{font-size:15px;font-weight:800;color:var(--ink)}

/* ===== 南亚社群排期（HQ + 区域 合并）===== */
.southasia{padding:22px 24px 44px;max-width:1320px;margin:0 auto}
.southasia h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.southasia .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
/* 筛选开关 */
.sa-filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;align-items:center}
.sa-filters .f-label{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.chip{padding:7px 15px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#6b7280;transition:.15s;user-select:none;box-shadow:var(--shadow-sm)}
.chip:hover{border-color:#c5cad0;color:#4b5563;box-shadow:var(--shadow-md)}
.chip.on{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.chip.all.on{background:#64748b}
/* 莫兰迪色系：低饱和灰调，柔和耐看 */
.chip[data-f="hq"]{border-color:#e3dff0}
.chip[data-f="hq"].on{background:#7c5cd6}
.chip[data-f="copost"]{border-color:#dbeafe}
.chip[data-f="copost"].on{background:#2f80ed}
.chip[data-f="kol"]{border-color:#fbdcee}
.chip[data-f="kol"].on{background:#e05299}
.chip[data-f="koc"]{border-color:#d2f0eb}
.chip[data-f="koc"].on{background:#12a594}
.chip[data-f="meme"]{border-color:#fdebd7}
.chip[data-f="meme"].on{background:#f2994a}
.chip[data-f="poster"]{border-color:#e0f0d8}
.chip[data-f="poster"].on{background:#58a83c}
.chip[data-f="gameplay"]{border-color:#fbdddd}
.chip[data-f="gameplay"].on{background:#e14b4b}
/* 分区标题带 */
.sa-section{margin-bottom:30px}
.sa-banner{display:flex;align-items:center;gap:10px;padding:12px 19px;border-radius:13px 13px 0 0;font-size:15px;font-weight:800;color:#fff;box-shadow:var(--shadow-sm)}
.sa-banner.hq{background:linear-gradient(135deg,#8b6fe0,#7c5cd6)}
.sa-banner.region{background:linear-gradient(135deg,#f59e0b,#d97706)}
.sa-banner .cnt{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:9px}
.sa-restore{margin-left:8px;font-size:12px;font-weight:700;background:rgba(255,255,255,.28);padding:2px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.sa-restore:hover{background:rgba(255,255,255,.45)}
/* 团队产能条 — 原产能 vs 现产能 */
.sa-cap{display:flex;align-items:flex-start;gap:14px;padding:13px 17px;margin-bottom:16px;background:#faf9fc;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.sa-cap .ca-t{font-weight:800;color:var(--ink);white-space:nowrap;line-height:34px}
.sa-cap .cap-col{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.sa-cap .cap-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sa-cap .ca-lbl{font-size:12px;font-weight:800;padding:4px 11px;border-radius:8px;white-space:nowrap;margin-right:2px}
.sa-cap .ca-lbl.cur{color:#4338ca;background:#ebe9fe}
.sa-cap .ca-lbl.old{color:#9aa1ab;background:#f1f2f4}
.sa-cap .cap{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #ecedf2;border-left:3px solid var(--c);border-radius:10px;padding:5px 12px;font-weight:600;color:#3a3a44;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.sa-cap .cap b{font-size:14px;font-weight:800;color:var(--c)}

<script>
// ===== 标签切换 =====
const tabs=document.querySelectorAll('.tab');
const views={sa:document.getElementById('view-sa'),fan:document.getElementById('view-fan'),regional:document.getElementById('view-regional')};
tabs.forEach(t=>t.onclick=()=>{

// ===== 工具函数 =====
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return Number(n).toLocaleString('en-US');}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function daysToLaunch(){
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.max(0, Math.round((new Date('2026-08-20')-today)/86400000));
}
function todayStr(){
  const t=new Date();
  const y=t.getFullYear();
  const m=String(t.getMonth()+1).padStart(2,'0');
  const d=String(t.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

// ===== 折线图绘制（内联 SVG） =====
function drawChart(hist,color,events){
  if(!hist||hist.length<2){
    return `<div class="chart-area" style="text-align:center;padding:20px;color:var(--muted);font-size:12px">
      数据点不足（需至少 2 次记录），继续更新后将自动画出增长曲线
    </div>`;
  }
  const W=250,H=90,padL=36,padR=14,padT=8,padB=20;
  const vals=hist.map(p=>p.value);
  const minV=Math.min(...vals)*0.95,maxV=Math.max(...vals)*1.03;
  const span=(maxV-minV)||1;
  const n=vals.length;
  // 坐标映射
  function px(i,v){return{x:padL+(W-padL-padR)*Math.max(0,Math.min(1,(n<=1?0.5:i/(n-1)))),y:padT+(H-padT-padB)*(1-Math.max(0,Math.min(1,(v-minV)/span)))};}
  const pts=vals.map((v,i)=>px(i,v));
  // 路径
  let lineD='';pts.forEach((p,i)=>lineD+=(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)+' ');
  // 面积填充
  const areaD=lineD+`L${pts[pts.length-1].x.toFixed(1)},${(H-padB).toFixed(1)} L${pts[0].x.toFixed(1)},${(H-padB).toFixed(1)} Z`;
  // 数据点圆（关键事件点高亮为金色 + 标注）
  const evtMap={};(events||[]).forEach(e=>evtMap[e.date]=e.label);
  const dotsCircs=pts.map((p,i)=>{
    const ev=evtMap[hist[i].date];
    if(ev){
      const ty=Math.max(padT+10,p.y-9);
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.6" fill="#f59e0b" stroke="#fff" stroke-width="1.6"/>`+
        `<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#b45309" font-weight="800">${esc(ev)}</text>`;
    }
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.8" fill="${color}" opacity=".75"/>`;
  }).join('');
  // X轴标签（每隔几个显示一个）
  const xLabels=[];
  const step=Math.ceil(n/6);
  hist.forEach((p,i)=>{if(i%step===0||i===n-1)xLabels.push(`<text x="${pts[i].x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="9" fill="#9ca3af">${p.date.slice(5)}</text>`);});
  // Y轴标签
  const yTicks=[minV,minV+(maxV-minV)*0.5,maxV];
  const yLabels=yTicks.map(v=>`<text x="${padL-4}" y="${padT+(H-padT-padB)*(1-(v-minV)/span).toFixed(1)}" text-anchor="end" font-size="9" fill="#9ca3af">${Math.round(v)}</text>`).join('');
  // 最新值标注
  const last=pts[pts.length-1];
  const lastLabel=`<text x="${last.x.toFixed(1)}" y="${Math.max(padT+10,last.y-8)}" text-anchor="middle" font-size="10" fill="${color}" font-weight="700">${fmt(vals[vals.length-1])}</text>`;
  // 网格线
  const gridLines=[0,.5,1].map(f=>`<line x1="${padL}" y1="${padT+(H-padT-padB)*(1-f)}" x2="${W-padR}" y2="${padT+(H-padT-padB)*(1-f)}" stroke="#e5e7eb" stroke-dasharray="3,3"/>`).join('');

  return `<div class="chart-area">
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <!-- 网格 -->${gridLines}
      <!-- 面积 --><path d="${areaD}" fill="${color}" opacity=".08"/>
      <!-- 线条 --><path d="${lineD}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 点 -->${dotsCircs}${lastLabel}
      <!-- X轴 -->${xLabels.join('')}
      <!-- Y轴 -->${yLabels}
    </svg>
  </div>`;
}

// ===== 周增长计算（基于历史，找 ~7 天前锚点）=====
function weeklyGrowth(pl){
  const hist=pl.history||[];
  if(hist.length<2) return null;
  const last=hist[hist.length-1];
  const lastDate=new Date(last.date+'T00:00:00');
  const target=new Date(lastDate); target.setDate(target.getDate()-7);
  let base=null;
  for(const h of hist){
    const d=new Date(h.date+'T00:00:00');
    if(d<=target) base=h.value; else break;
  }
  if(base===null) base=hist[0].value;
  const diff=last.value-base;
  const pct=base? (diff/base*100):0;
  return {diff, pct, daily:diff/7};
}

  facebook:'<svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>',

  x:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
};

// ===== 渲染粉丝卡片 =====
function renderFans(data){
  document.getElementById('upd').textContent='数据更新于 '+data.updated_at;
  const p=data.platforms;
  const totalAll=(p.instagram?.value||0)+(p.facebook?.value||0)+(p.youtube?.value||0)+(p.x?.value||0);
  const d=daysToLaunch();

  const igHist=p.instagram?.history||[];
  const igBase=igHist.length?igHist[0].value:0;
  const igGain=(p.instagram?.value||0)-igBase;
  document.getElementById('summary').innerHTML=`
    <div class="stat"><div class="k">距上线 8/20</div><div class="v">D-${d}</div></div>
    <div class="stat"><div class="k">社区总粉丝（4 平台）</div><div class="v">${fmt(totalAll)}</div></div>
    <div class="stat"><div class="k">Instagram</div><div class="v">${fmt(p.instagram?.value||0)}<small style="font-size:11px;color:var(--ok)">▲ +${fmt(igGain)}</small></div></div>
    <div class="stat"><div class="k">YouTube 订阅</div><div class="v">${fmt(p.youtube?.value||0)}</div></div>`;

  // 洞察区（作战进度 + 占比 + 本周最佳）
  renderInsights(data);

  const order=['instagram','facebook','youtube','x'].sort((a,b)=>(p[b]?.value||0)-(p[a]?.value||0));
  document.getElementById('cards').innerHTML=order.map(k=>{
    const pl=p[k]; if(!pl) return '';
    const hist=pl.history||[];
    const prev=hist.length>1?hist[hist.length-2].value:pl.value;
    const diff=pl.value-prev;
    const dcls=diff>0?'up':(diff<0?'down':'flat');
    const dtxt=diff>0?`▲ +${fmt(diff)}`:(diff<0?`▼ ${fmt(diff)}`:'—');
    const initial=pl.name.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()||'??';
    const wg=weeklyGrowth(pl);
    const momentum=wg?`<div class="momentum">
      <div class="m"><span class="k">近 7 天</span><span class="v ${wg.diff>0?'m-up':wg.diff<0?'m-down':'m-flat'}">${wg.diff>0?'+':''}${fmt(wg.diff)}</span></div>
      <div class="m"><span class="k">周环比</span><span class="v ${wg.pct>=0?'m-up':'m-down'}">${wg.pct>=0?'+':''}${wg.pct.toFixed(1)}%</span></div>
      <div class="m"><span class="k">日均增</span><span class="v ${wg.daily>=0?'m-up':'m-down'}">${wg.daily>=0?'+':''}${wg.daily.toFixed(1)}</span></div>
    </div>`:'';
    return `<div class="pc">
      <div class="bar" style="background:${pl.color}"></div>
      <div class="ph">
        <div class="ic" style="background:${pl.color}">${PLATFORM_ICONS[k]||initial}</div>
        <div><div class="nm">${esc(pl.name)}</div><div class="hd">${esc(pl.handle)}</div></div>
      </div>
      <div class="big">${fmt(pl.value)}<small>${esc(pl.label)}</small></div>
      <div class="delta ${dcls}">${dtxt}</div>
      ${momentum}
      ${drawChart(hist,pl.color,PLATFORM_EVENTS[k])}
      <a class="lk" href="${esc(pl.url)}" target="_blank" rel="noopener">${esc(pl.url)}</a>
    </div>`;
  }).join('');
}

// ===== 洞察区渲染：作战进度 + 平台占比 + 本周最佳 =====
function renderInsights(data){
  const p=data.platforms;
  const order=['instagram','facebook','youtube','x'];
  const vals=order.map(k=>p[k]?.value||0);
  const names=order.map(k=>p[k]?.name||k);
  const colors=order.map(k=>p[k]?.color||'#999');
  const total=vals.reduce((a,b)=>a+b,0);

  // 占比环图（SVG 描边分段）
  const R=52,C=2*Math.PI*R;
  let off=0;
  const segs=order.map((k,i)=>{
    const frac=total?vals[i]/total:0;
    const dash=frac*C;
    const seg=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${colors[i]}" stroke-width="18" stroke-dasharray="${dash.toFixed(1)} ${(C-dash).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)"/>`;
    off+=dash;
    return seg;
  }).join('');
  const donut=`<svg width="120" height="120" viewBox="0 0 120 120">${segs}</svg>`;
  const legendRows=order.map((k,i)=>`
    <div class="row"><span class="dot" style="background:${colors[i]}"></span>
      <span class="nm">${esc(names[i])}</span>
      <span class="pc2">${(total?vals[i]/total*100:0).toFixed(1)}%</span>
      <span class="vl">${fmt(vals[i])}</span></div>`).join('');

  // 本周最佳渠道（按周绝对增量，避免小基数百分比误导）
  const grows=order.map(k=>({name:p[k]?.name||k,wg:weeklyGrowth(p[k])}));
  const valid=grows.filter(g=>g.wg).sort((a,b)=>b.wg.diff-a.wg.diff);
  const best=valid[0];

  // 上线目标进度（目标值存 localStorage，可改）
  const target=Number(lsGet('gangstar_fan_target')||10000);
  const prog=Math.min(100,total/target*100);
  const remain=Math.max(0,target-total);
  const dl=daysToLaunch();
  const needDaily=dl>0?remain/dl:0;

  const el=document.getElementById('insights');
  if(!el) return;
  el.innerHTML=`
    <div class="panel">
      <h3><span class="em">🎯</span> 上线作战进度</h3>
      <div class="countdown"><span class="big">D-${dl}</span><span class="lbl">距 2026-08-20 正式上线</span></div>
      <div class="prog"><i style="width:${prog.toFixed(1)}%"></i></div>
      <div class="meta"><span>社区总粉丝 <b>${fmt(total)}</b></span><span>目标 <b>${fmt(target)}</b></span></div>
      <div class="meta"><span>完成度 <b>${prog.toFixed(1)}%</b></span><span>日均需 +<b>${needDaily.toFixed(0)}</b> 连 ${dl} 天</span></div>
      <div class="target-edit">目标值 <input id="targetInput" type="number" value="${target}" min="1"> <button id="targetSave">设为目标</button></div>
    </div>
    <div class="panel">
      <h3><span class="em">🥧</span> 平台粉丝占比</h3>
      <div class="donut-wrap">
        <div class="donut">${donut}<div class="center"><div class="n">${fmt(total)}</div><div class="t">总粉丝</div></div></div>
        <div class="legend">${legendRows}</div>
      </div>
      ${best?`<div style="margin-top:14px;text-align:center"><span class="badge">🏆 本周最佳 · ${esc(best.name)}（周 +${fmt(best.wg.diff)}）</span></div>`:''}
    </div>`;

  const saveBtn=document.getElementById('targetSave');
  if(saveBtn) saveBtn.onclick=()=>{
    const v=Number(document.getElementById('targetInput').value);
    if(v>0){pushUndo();lsSet('gangstar_fan_target',v);renderInsights(lastData);}
  };
}

btn.onclick=async()=>{
  // 1. 进入加载态
  btn.disabled=true;btn.classList.add('loading');
  setStatus('⏳ 正在连接刷新服务…','info');

  try{
    // 2. POST 刷新请求
    const r=await fetch('/api/fan-refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ts:Date.now()})});

    if(r.ok){
      setStatus('✅ 请求已提交！后台正在读取 IG / FB / YTB / X…','ok');

      // 3. 轮询等待结果（最多 90 秒）
      let pollCount=0;
      const prevUpdate=lastData?lastData.updated_at:'';
      const pollTimer=setInterval(async()=>{
        pollCount++;
        try{
          const cr=await fetch('/fan_data.json?t='+Date.now(),{cache:'no-store'});
          if(cr.ok){
            const newData=await cr.json();
            if(newData.updated_at!==prevUpdate){
              // 数据已更新！
              clearInterval(pollTimer);
              lastData=newData;renderFans(newData);
              btn.disabled=false;btn.classList.remove('loading');
              setStatus('✅ 刷新成功！已更新至 '+newData.updated_at,'ok');

                ' | FB: '+fmt(newData.platforms.facebook.value)+
                ' | YTB: '+fmt(newData.platforms.youtube.value),'ok');
            }
          }
        }catch(e){/* ignore */}
        // 超时（已等待约 3.5 分钟）
        if(pollCount>70){
          clearInterval(pollTimer);
          btn.disabled=false;btn.classList.remove('loading');
          setStatus('⏱ 后台仍在读取中（通常几分钟内完成）。稍后切回本页即可看到更新；或直接在对话里让我「刷新粉丝数」立即更新','warn');
          showToast('⏱ 刷新请求已提交，后台读取中\n通常几分钟内完成，可稍后查看','err');
        }
      },3000);

    }else{
      throw new Error('HTTP '+r.status);
    }

  }catch(e){
    // 服务未连接 / file:// 直接打开：不跳走，仅提示正确打开方式
    btn.disabled=false;btn.classList.remove('loading');
    if(isFile){
      setStatus('请双击「Gangstar看板.app」打开看板，刷新按钮才能连接后台','warn');
    }else{
      setStatus('刷新服务未连接 — 请双击「Gangstar看板.app」重新打开','warn');
    }
  }
};

(function bindSaDrag(){
  const root=document.getElementById('southAsiaView');
  if(!root) return;
  let drag=null;

  function cellAt(x,y){
    const els=document.elementsFromPoint(x,y)||[];
    for(const el of els){ if(el&&el.closest){const c=el.closest('.sa-cell'); if(c) return c;} }
    return null;
  }
  function moveGhost(x,y){
    if(!drag) return;
    drag.ghost.style.left=(x-drag.dx)+'px';
    drag.ghost.style.top=(y-drag.dy)+'px';
  }
  function cleanup(){
    if(!drag) return;
    const d=drag; drag=null;
    if(d.ghost&&d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    d.item.classList.remove('dragging');
    if(d.cell) d.cell.classList.remove('drop-over');
    document.body.style.userSelect='';
    return d;
  }

  root.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0) return;
    const h=e.target.closest&&e.target.closest('.sa-drag');
    if(!h) return;
    const item=h.closest('.sa-post');
    if(!item||!item.getAttribute('data-pid')) return;
    e.preventDefault(); e.stopPropagation();
    const cell0=item.closest('.sa-cell')?item.closest('.sa-cell'):null;
    const originDate=cell0?cell0.getAttribute('data-date'):'';
    const rect=item.getBoundingClientRect();
    const ghost=item.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width=rect.width+'px';
    document.body.appendChild(ghost);
    drag={pid:item.getAttribute('data-pid'),ruid:item.getAttribute('data-ruid')||'',date:originDate,item:item,ghost:ghost,dx:e.clientX-rect.left,dy:e.clientY-rect.top,cell:null,moved:false};
    item.classList.add('dragging');
    document.body.style.userSelect='none';
    moveGhost(e.clientX,e.clientY);
  });

  document.addEventListener('pointermove',e=>{
    if(!drag) return;
    e.preventDefault();
    drag.moved=true;
    moveGhost(e.clientX,e.clientY);
    drag.ghost.style.visibility='hidden';
    const cell=cellAt(e.clientX,e.clientY);
    drag.ghost.style.visibility='';
    if(drag.cell&&drag.cell!==cell) drag.cell.classList.remove('drop-over');
    if(cell) cell.classList.add('drop-over');
    drag.cell=cell;
    if(cell && cell.getAttribute('data-date')===drag.date){
      cell.querySelectorAll('.sa-post.rb,.sa-post.ra').forEach(x=>x.classList.remove('rb','ra'));
      const sp=[...cell.querySelectorAll('.sa-post')].filter(x=>x!==drag.item);
      let tgt=null;
      for(const p of sp){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){tgt=p;break;}}
      if(tgt) tgt.classList.add('rb'); else if(sp.length){sp[sp.length-1].classList.add('ra');}
    }else{
      root.querySelectorAll('.sa-post.rb,.sa-post.ra').forEach(x=>x.classList.remove('rb','ra'));
    }
  },{passive:false});

  document.addEventListener('pointerup',e=>{
    if(!drag) return;
    const cell=drag.cell, pid=drag.pid, ruid=drag.ruid, moved=drag.moved, od=drag.date, di=drag.item;
    cleanup();
    if(!cell||!moved) return;
    const target=cell.getAttribute('data-date');
    if(target===od){
      pushUndo();
      const c=root.querySelector('.sa-cell[data-date="'+target+'"]');
      const sp=[...c.querySelectorAll('.sa-post')].filter(x=>x!==di);
      let beforePid=null;
      for(const p of sp){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){beforePid=p.getAttribute('data-pid');break;}}
      let seq=sp.map(x=>x.getAttribute('data-pid'));
      if(beforePid===null) seq.push(pid); else{const i=seq.indexOf(beforePid);if(i<0)seq.push(pid);else seq.splice(i,0,pid);}
      setSaOrder(target,seq);
      renderSouthAsia();
      return;
    }
    if(!target) return;
    pushUndo();
    if(ruid){
      // 区域素材：与「区域素材周历」共用同一份移动记录，两个视图保持一致
      const orig=(ruid.split('|')[1])||'';
      const rm=getRegionMoves();
      if(target===orig) delete rm[ruid]; else rm[ruid]=target;
      localStorage.setItem('gangstar_regional_moves',JSON.stringify(rm));
    }else if(pid.indexOf('cus|')===0){
      // 自定义素材：与区域周历共用 gangstar_regional_moves（cus|<id> -> 目标日期），两表同步
      const cid=pid.slice(4);
      let orig='';
      try{const custom=JSON.parse(localStorage.getItem('gangstar_custom')||'{}');for(const d in custom){if((custom[d]||[]).some(x=>String(x._id)===cid)){orig=d;break;}}}catch(e){}
      const rm=getRegionMoves();
      if(target===orig) delete rm[pid]; else rm[pid]=target;
      localStorage.setItem('gangstar_regional_moves',JSON.stringify(rm));
    }else{
      const orig=(pid.split('|')[1])||'';
      const moves=getSaMoves();
      if(target===orig) delete moves[pid]; else moves[pid]=target;
      localStorage.setItem('gangstar_sa_moves',JSON.stringify(moves));
    }
    renderSouthAsia();
  });

  document.addEventListener('pointercancel',()=>{cleanup();});
  window.addEventListener('blur',()=>{cleanup();});
})();

function renderSouthAsia(){
  const el=document.getElementById('southAsiaView');
  if(!el) return;
  if(typeof HQ_DATA==='undefined'){
    el.innerHTML='<p style="color:var(--muted);padding:40px;text-align:center">HQ 数据未加载（hq_data.js）</p>';
    return;
  }
  saDetailMap={};saEditMap={}; // 每次渲染重置

  // 类型显示信息
  const TYPE_INFO={};
  (CONTENT_TYPES||[]).forEach(t=>TYPE_INFO[t.key]=t);
  TYPE_INFO['hq']={key:'hq',name:'HQ公线',color:'#7c5cd6'};
  const HQ_BADGE={name:'HQ公线',color:'#7c5cd6'};

  // 区域素材按日期索引（含 localStorage 自定义）
  const saMoves=getSaMoves();
  const regMoves=(typeof getRegionMoves==='function')?getRegionMoves():{};
  const regByDate={};
  const pushReg=(date,it,pid,ruid)=>{
    const eff=(ruid&&regMoves[ruid])||saMoves[pid]||date;
    (regByDate[eff]=regByDate[eff]||[]).push({...it,_pid:pid,_ruid:ruid||''});
  };
  ((REGIONAL_DATA&&REGIONAL_DATA.weeks)||[]).forEach(w=>{
    Object.entries(w.items||{}).forEach(([date,arr])=>{
      (arr||[]).forEach((it,ii)=>pushReg(date,it,'reg|'+date+'|'+it.type+'|'+it.title+'|'+ii,w.range+'|'+date+'|'+it.type+'|'+it.title+'|'+ii));
    });
  });
  // 合并 localStorage 自定义素材
  try{
    const custom=JSON.parse(localStorage.getItem('gangstar_custom')||'{}');
    Object.entries(custom).forEach(([date,arr])=>{
      (arr||[]).forEach(it=>pushReg(date,{...it,custom:true},it._id?('cus|'+it._id):('reg|'+date+'|'+it.type+'|'+it.title),it._id?('cus|'+it._id):''));
    });
  }catch(e){}
  // 加载隐藏/取消状态
  const hidden=new Set();
  const cancelledSet=new Set();
  try{
    JSON.parse(localStorage.getItem('gangstar_hidden')||'[]').forEach(id=>hidden.add(id));
    JSON.parse(localStorage.getItem('gangstar_cancelled')||'[]').forEach(id=>cancelledSet.add(id));
  }catch(e){}
  const reqs=getReqSubmitted();
  // 加载编辑覆盖
  const edits={};
  try{Object.assign(edits,JSON.parse(localStorage.getItem('gangstar_edits')||'{}'));}catch(e){}

  // 统计
  let hqCnt=0, regCnt=0;

  // 筛选开关
  const chipsHtml=`<div class="sa-filters">
    <span class="f-label">筛选：</span>
    <span class="chip all ${saActive.size===SA_FILTERS.length?'on':''}" data-f="all">全部</span>
    ${SA_FILTERS.map(f=>`<span class="chip ${saActive.has(f.key)?'on':''}" data-f="${f.key}">${f.label}</span>`).join('')}
  </div>`;

  // 图例
  const legendHtml=`<div class="sa-legend">
    <span class="lg"><span class="lgd" style="background:${HQ_BADGE.color}"></span>HQ公线</span>
    ${(CONTENT_TYPES||[]).map(t=>`<span class="lg"><span class="lgd" style="background:${t.color}"></span>${t.name}</span>`).join('')}
  </div>`;

  const today=todayStr();
  const hq=HQ_DATA;
  const allWeeks=hq.july.concat(hq.august);
  // HQ 素材按日期索引（应用拖拽移动记录）
  const hqByDate={};
  allWeeks.forEach(w=>(w.cells||[]).forEach(c=>{
    (c.posts||[]).forEach(p=>{
      const pid='hq|'+c.date+'|'+p.brief;
      const eff=saMoves[pid]||c.date;
      (hqByDate[eff]=hqByDate[eff]||[]).push({p:p,pid:pid});
    });
  }));
  allWeeks.forEach((w,i)=>w._idx=i);
  const current=allWeeks.find(w=>w.monday<=today&&today<=w.sunday)||(today<allWeeks[0].monday?allWeeks[0]:allWeeks[allWeeks.length-1]);
  const future=allWeeks.filter(w=>w!==current&&w.monday>today).sort((a,b)=>a._idx-b._idx);
  const past=allWeeks.filter(w=>w!==current&&w.sunday<today).sort((a,b)=>a._idx-b._idx);
  const order=[current,...future,...past];

  const weeksHtml=order.map((w)=>{
    const isCur=(w===current);
    const expanded=!(w.sunday<today); // 当前周+未来周展开，历史周折叠
    const band=`<div class="sa-wband" style="background:${w.color}">
      <span class="wk">第${w._idx+1}周</span>
      <span class="rng">${w.range}</span>
      <span class="th">📌 ${esc(w.theme)}</span>
      ${isCur?'<span class="cur">🔸 本周</span>':''}
      <button class="toggle" type="button">${expanded?'收起 ▴':'展开 ▾'}</button>
    </div>`;
    const cells=w.cells.map(c=>{
      const isLaunch=c.date===hq.launch;
      const isToday=(c.date===today);
      let posts=[];
      // HQ 公线素材
      if(saActive.has('hq')){
        (hqByDate[c.date]||[]).forEach(hp=>{
          const p=hp.p, pid=hp.pid;
          if(hidden.has(pid)) return;
          let brief=p.brief, plat=p.plat||'';
          const ov=edits[pid];
          if(ov){ if(ov.title) brief=ov.title; if(ov.partner!==undefined) plat=ov.partner; }
          saDetailMap[pid]={fullBrief:(ov&&ov.title)||p.fullBrief||p.brief,fullTime:p.fullTime||p.time,plat:plat};
          saEditMap[pid]={isHQ:true,title:brief,partner:plat};
          posts.push({pid,badge:HQ_BADGE,time:p.time,brief,plat,sub:'',cancelled:cancelledSet.has(pid),hasDetail:true});
          hqCnt++;
        });
      }
      // 区域自产素材（按日期匹配，含自定义）
      (regByDate[c.date]||[]).forEach(it=>{
        const pid=it._pid||(it._id?('cus|'+it._id):('reg|'+c.date+'|'+it.type+'|'+it.title));
        const opId=it._ruid||pid;
        if(hidden.has(opId)) return;
        const ov=edits[opId];
        let title=it.title, type=it.type, partner=it.partner||'', desc=it.desc||'';
        if(ov){ if(ov.title) title=ov.title; if(ov.type) type=ov.type; if(ov.partner!==undefined) partner=ov.partner; if(ov.desc!==undefined) desc=ov.desc; }
        const tag=(REGION_TAGS[type]||[])[0];
        if(saActive.has(tag)){
          const ti=TYPE_INFO[type]||{name:type,color:'#888'};
          saEditMap[opId]={isHQ:false,title,type,partner,desc};
          posts.push({pid:opId,ruid:it._ruid||'',badge:ti,time:'',brief:title,plat:partner,sub:desc,custom:!!it.custom,cid:it._id||'',cdate:c.date,cancelled:cancelledSet.has(opId),isRegion:true});
          regCnt++;
        }
      });
      posts=sortSaPosts(posts,c.date);
      const body=posts.length?posts.map(p=>{
        const badge=`<span class="t" style="background:${p.badge.color}">${esc(p.badge.name)}</span>`;
        const timeHtml=p.time?`<span class="sa-mtime">${esc(p.time)}</span>`:'';
        const platHtml=p.plat?`<div class="p">${esc(p.plat)}</div>`:'';
        const subHtml=p.sub?`<div class="p" style="color:var(--ink)">${esc(p.sub)}</div>`:'';
        const cls=p.cancelled?' cancelled':'';
        const cancelCls=p.cancelled?'act cancel on':'act cancel';
        const detailAttr=p.hasDetail?` data-detail="${p.pid}" style="cursor:pointer"`:'';
        const reqOn=p.isRegion?!!p.pid&&!!reqs[p.pid]:false;
        const reqHtml=p.isRegion?`<span class="req-box ${reqOn?'on':''}" data-uid="${esc(p.pid)}" title="点此确认：已提交制作需求"><span class="mk">${reqOn?'✓':''}</span>${reqOn?'已提需求':'提需求'}</span>`:'';
        return `<div class="sa-post${cls}" data-pid="${p.pid}"${p.ruid?` data-ruid="${p.ruid}"`:''}${detailAttr}><span class="act sa-drag" title="按住拖拽改日期">⠿</span><span class="act edit" data-pid="${p.pid}" title="编辑">✎</span><span class="${cancelCls}" data-pid="${p.pid}" title="划线/恢复">划</span><span class="act del" data-pid="${p.pid}" title="删除">×</span>${badge}${timeHtml}<div class="b">${esc(p.brief)}</div>${platHtml}${subHtml}${reqHtml}</div>`;
      }).join(''):'<div class="sa-empty-tip">—</div>';
      return `<div class="sa-cell${isLaunch?' launch':''}${isToday?' is-today':''}${posts.length?'':' empty'}" data-date="${c.date}">
        <div class="sa-dhead"><span>${c.date.slice(5)}</span><span class="dow">${isToday?'今天':('周'+c.dow)}</span></div>${body}<span class="sa-add-btn" data-date="${c.date}" title="添加素材">+</span></div>`;
    }).join('');
    return `<div class="sa-week"><div class="sa-wband-wrap">${band}</div><div class="sa-wbody${expanded?'':' collapsed'}"><div class="sa-cells">${cells}</div></div></div>`;
  }).join('');

  const gridHtml=`<div class="sa-section">
    <div class="sa-banner hq">📋 南亚社群排期 <span class="cnt">HQ ${hqCnt} 条 · 区域 ${regCnt} 条</span>${hidden.size?`<span class="sa-restore" id="restoreBtn">↩ 恢复已删除(${hidden.size})</span>`:''}</div>
    <div class="sa-grid">${weeksHtml}</div>
  </div>`;

  const capHtml=`<div class="sa-cap">
    <span class="ca-t">🔧 团队产能 / 天</span>
    <div class="cap-col">
      <div class="cap-row">
        <span class="ca-lbl old">原产能</span>
        <span class="cap old" style="--c:#9aa1ab">🖼️ 复用海报 <b>3</b></span>
        <span class="cap old" style="--c:#9aa1ab">🎬 复用视频 <b>1</b></span>
      </div>
      <div class="cap-row">
        <span class="ca-lbl cur">现产能</span>
        <span class="cap" style="--c:#58a83c">🖼️ 复用海报 <b>3</b></span>
        <span class="cap" style="--c:#2f80ed">🎬 复用视频 <b>1</b></span>
        <span class="cap" style="--c:#7c5cd6">🎨 原创KV <b>1</b><i>新增</i></span>
        <span class="cap" style="--c:#e05299">🎥 原创视频 <b>1</b><i>新增</i></span>
        <span class="cap" style="--c:#0f766e">👤 AM跟进 <b>1</b><i>新增</i></span>
        <span class="cap-budget">追加 $750/月</span>
      </div>
    </div>
  </div>`;

  el.innerHTML=`${capHtml}
    <h2>📋 南亚社群排期</h2>
    <div class="sub">HQ 公线素材 + 区域自产素材 · 同表展示 · 筛选开关可单独查看某类</div>
    ${chipsHtml}
    ${legendHtml}
    ${gridHtml}`;

  // 绑定筛选开关
  el.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=()=>{
      const f=ch.dataset.f;
      if(f==='all'){
        if(saActive.size===SA_FILTERS.length) saActive.clear();
        else saActive=new Set(SA_FILTERS.map(x=>x.key));
      }else{
        if(saActive.has(f)) saActive.delete(f); else saActive.add(f);
      }
      renderSouthAsia();
    };
  });
  // 绑定周折叠
  el.querySelectorAll('.sa-wband .toggle').forEach(btn=>{
    btn.onclick=()=>{
      const body=btn.closest('.sa-week').querySelector('.sa-wbody');
      const col=body.classList.toggle('collapsed');
      btn.textContent=col?'展开 ▾':'收起 ▴';
    };
  });
  // 绑定添加按钮
  el.querySelectorAll('.sa-add-btn').forEach(btn=>{
    btn.onclick=()=>openAddModal(btn.dataset.date);
  });
  // 绑定 HQ 详情点击
  el.querySelectorAll('.sa-post[data-detail]').forEach(post=>{
    post.onclick=e=>{
      if(e.target.classList.contains('act')) return; // 点按钮不触发
      openDetailModal(post.dataset.detail, post);
    };
  });
  // 恢复已删除
  const restoreBtn=el.querySelector('#restoreBtn');
  if(restoreBtn){
    restoreBtn.onclick=()=>{
      pushUndo();
      localStorage.removeItem('gangstar_hidden');
      renderSouthAsia(); renderRegional();
      saToast('已恢复全部删除项');
    };
  }
  // 绑定删除按钮（所有帖子）
  el.querySelectorAll('.sa-post .act.del').forEach(btn=>{
    btn.onclick=()=>{
      const pid=btn.dataset.pid;
      pushUndo();
      const arr=JSON.parse(localStorage.getItem('gangstar_hidden')||'[]');
      if(!arr.includes(pid)){ arr.push(pid); localStorage.setItem('gangstar_hidden',JSON.stringify(arr)); }
      renderSouthAsia(); renderRegional();
    };
  });
  // 绑定划线按钮（取消/恢复）
  el.querySelectorAll('.sa-post .act.cancel').forEach(btn=>{
    btn.onclick=()=>{
      const pid=btn.dataset.pid;
      pushUndo();
      try{
        let arr=JSON.parse(localStorage.getItem('gangstar_cancelled')||'[]');
        if(arr.includes(pid)){arr=arr.filter(x=>x!==pid);}
        else{arr.push(pid);}
        localStorage.setItem('gangstar_cancelled',JSON.stringify(arr));
      }catch(e){}
      renderSouthAsia(); renderRegional();
    };
  });
  // 绑定编辑按钮（所有帖子）
  el.querySelectorAll('.sa-post .act.edit').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();openEditModal(btn.dataset.pid);};
  });
  el.querySelectorAll('.sa-post .req-box').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleReq(b.dataset.uid);});
}

// 全局撤销见 doUndo()（快照整个本地状态，覆盖所有表的所有操作）
function saToast(msg){
  const old=document.querySelector('.sa-toast');
  if(old) old.remove();
  const t=document.createElement('div');
  t.className='sa-toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1500);
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();doUndo();}
});

// 添加素材模态框
function openAddModal(date){
  const old=document.querySelector('.sa-modal-bg');
  if(old) old.remove();
  const opts=`<option value="hq">HQ公线素材</option>`+(CONTENT_TYPES||[]).map(t=>`<option value="${t.key}">${t.name}</option>`).join('');
  const bg=document.createElement('div');
  bg.className='sa-modal-bg';
  bg.innerHTML=`<div class="sa-modal">
    <h3>添加素材 · ${date}</h3>
    <label>标题</label>
    <input type="text" id="m-title" placeholder="素材标题" autofocus>
    <label>类别</label>
    <select id="m-type">${opts}</select>
    <label>合作方（选填）</label>
    <input type="text" id="m-partner" placeholder="合作方">
    <label>描述（选填）</label>
    <input type="text" id="m-desc" placeholder="补充描述">
    <div class="sa-modal-btns">
      <button class="btn-cancel" type="button">取消</button>
      <button class="btn-save" type="button">保存</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('.btn-cancel').onclick=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg) bg.remove();};
  const saveFn=()=>{
    const title=document.getElementById('m-title').value.trim();
    if(!title) return;
    const type=document.getElementById('m-type').value;
    const partner=document.getElementById('m-partner').value.trim();
    const desc=document.getElementById('m-desc').value.trim();
    pushUndo();
    try{
      const custom=JSON.parse(localStorage.getItem('gangstar_custom')||'{}');
      if(!custom[date]) custom[date]=[];
      custom[date].push({_id:Date.now()+''+Math.random().toString(36).slice(2,6),type,title,partner,desc});
      localStorage.setItem('gangstar_custom',JSON.stringify(custom));
    }catch(e){}
    bg.remove();
    renderSouthAsia(); renderRegional();
  };
  bg.querySelector('.btn-save').onclick=saveFn;
  document.getElementById('m-title').onkeydown=e=>{if(e.key==='Enter') saveFn();};
}

// 编辑已有素材（覆盖层写入 localStorage gangstar_edits，不破坏源数据）

    <label>标题</label>

  bg.querySelector('.btn-cancel').onclick=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg) bg.remove();};
  const saveFn=()=>{
    const title=document.getElementById('m-title').value.trim();
    if(!title) return;
    const type=document.getElementById('m-type').value;
    const partner=document.getElementById('m-partner').value.trim();
    const desc=document.getElementById('m-desc').value.trim();
    try{
      const all=JSON.parse(localStorage.getItem('gangstar_edits')||'{}');
      pushUndo();

      localStorage.setItem('gangstar_edits',JSON.stringify(all));
    }catch(e){}
    bg.remove();
    renderSouthAsia();
  };
  bg.querySelector('.btn-save').onclick=saveFn;
  document.getElementById('m-title').onkeydown=e=>{if(e.key==='Enter') saveFn();};
}

// HQ 详情查看（帖子旁浮窗）
function openDetailModal(pid, anchorEl){
  const d=saDetailMap[pid];
  if(!d||!anchorEl) return;
  const old=document.querySelector('.sa-popover');
  if(old) old.remove();
  const pop=document.createElement('div');
  pop.className='sa-popover';
  pop.innerHTML=`<span class="pop-close">×</span><div class="pop-meta">📅 ${esc(d.fullTime||'--')}${d.plat?' · 📡 '+esc(d.plat):''}</div><div class="pop-body">${esc(d.fullBrief)}</div>`;
  document.body.appendChild(pop);
  const rect=anchorEl.getBoundingClientRect();
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=rect.left;
  let top=rect.bottom+6;
  if(left+pw>window.innerWidth-10) left=window.innerWidth-pw-10;
  if(left<10) left=10;
  if(top+ph>window.innerHeight-10) top=rect.top-ph-6;
  if(top<10) top=10;
  pop.style.left=left+'px';
  pop.style.top=top+'px';
  pop.querySelector('.pop-close').onclick=()=>pop.remove();
  setTimeout(()=>{
    document.addEventListener('click',function close(e){
      if(!pop.contains(e.target)&&!anchorEl.contains(e.target)){pop.remove();document.removeEventListener('click',close);}
    });
  },10);
}

// 区域素材类型定义（与筛选开关一一对应）

// ===== 区域素材独立看板（周历格式，保留独立入口）=====
// 拖拽移动记录：localStorage 增量（uid -> 目标日期），不改动源数据
function getRegionMoves(){
  try{return JSON.parse(localStorage.getItem('gangstar_regional_moves')||'{}');}catch(e){return {};}
}
function regionUid(range,date,it,i){return range+'|'+date+'|'+it.type+'|'+it.title+'|'+(i||0);}
// 单日排序：区域周历按「日期 -> [uid 序列]」记忆（跨类型行完整序列）
function getRegOrder(){try{return JSON.parse(localStorage.getItem('gangstar_regional_order')||'{}');}catch(e){return {};}}
function setRegOrder(date,pids){const o=getRegOrder();if(!pids||!pids.length)delete o[date];else o[date]=pids;localStorage.setItem('gangstar_regional_order',JSON.stringify(o));}
function sortRegItems(arr,date){const ord=getRegOrder()[date];if(!ord||!ord.length)return arr;const idx={};ord.forEach((u,i)=>idx[u]=i);return arr.slice().sort((a,b)=>{const ia=(a.uid in idx)?idx[a.uid]:1e9;const ib=(b.uid in idx)?idx[b.uid]:1e9;return ia-ib;});}

// ===== 区域素材统一状态（两表共享）=====
function getRegionHidden(){try{return new Set(JSON.parse(localStorage.getItem('gangstar_hidden')||'[]'));}catch(e){return new Set();}}
function getRegionCancelled(){try{return new Set(JSON.parse(localStorage.getItem('gangstar_cancelled')||'[]'));}catch(e){return new Set();}}
function getRegionEdits(){try{return JSON.parse(localStorage.getItem('gangstar_edits')||'{}');}catch(e){return {};}}
function getRegionCustom(){try{return JSON.parse(localStorage.getItem('gangstar_custom')||'{}');}catch(e){return {};}}
function getReqSubmitted(){try{return JSON.parse(localStorage.getItem('gangstar_req_submitted')||'{}');}catch(e){return {};}}
function toggleReq(uid){pushUndo();const m=getReqSubmitted();if(m[uid])delete m[uid];else m[uid]=true;localStorage.setItem('gangstar_req_submitted',JSON.stringify(m));renderSouthAsia();renderRegional();}

// ===== 全局撤销：快照整个本地状态，覆盖所有表的所有操作 =====
const UNDO_KEYS=['gangstar_sa_moves','gangstar_regional_moves','gangstar_hidden','gangstar_cancelled','gangstar_edits','gangstar_custom','gangstar_fan_target','gangstar_req_submitted','gangstar_sa_order','gangstar_regional_order'];
function snapshotApp(){const o={};UNDO_KEYS.forEach(k=>{try{o[k]=localStorage.getItem(k);}catch(e){o[k]=null;}});return o;}
function pushUndo(){let s=[];try{s=JSON.parse(localStorage.getItem('gangstar_undo')||'[]');}catch(e){}s.push(snapshotApp());if(s.length>50)s=s.slice(-50);localStorage.setItem('gangstar_undo',JSON.stringify(s));}
function doUndo(){let s=[];try{s=JSON.parse(localStorage.getItem('gangstar_undo')||'[]');}catch(e){}if(!s.length){saToast('没有可撤销的操作');return;}const snap=s.pop();localStorage.setItem('gangstar_undo',JSON.stringify(s));UNDO_KEYS.forEach(k=>{if(snap[k]===null||snap[k]===undefined)localStorage.removeItem(k);else try{localStorage.setItem(k,snap[k]);}catch(e){}});renderSouthAsia();renderRegional();saToast('已撤销 ⌘Z');}

// 区域素材编辑弹窗（写入 gangstar_edits[uid]，与南亚社群排期同一份）
function openRegionEditModal(uid){
  const old=document.querySelector('.sa-modal-bg');if(old)old.remove();
  const cur=regEditMap[uid]||{};
  const opts=(CONTENT_TYPES||[]).map(t=>`<option value="${t.key}">${t.name}</option>`).join('');
  const bg=document.createElement('div');bg.className='sa-modal-bg';
  bg.innerHTML=`<div class="sa-modal"><h3>编辑区域素材</h3>
    <label>标题</label><input type="text" id="m-title" value="${esc(cur.title||'')}" autofocus>
    <label>类别</label><select id="m-type">${opts}</select>
    <label>合作方（选填）</label><input type="text" id="m-partner" value="${esc(cur.partner||'')}">
    <label>描述（选填）</label><input type="text" id="m-desc" value="${esc(cur.desc||'')}">
    <div class="sa-modal-btns"><button class="btn-cancel" type="button">取消</button><button class="btn-save" type="button">保存</button></div></div>`;
  document.body.appendChild(bg);
  const typeSel=bg.querySelector('#m-type');if(cur.type)typeSel.value=cur.type;
  bg.querySelector('.btn-cancel').onclick=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg)bg.remove();};
  const saveFn=()=>{
    const title=document.getElementById('m-title').value.trim();if(!title)return;
    const type=document.getElementById('m-type').value;
    const partner=document.getElementById('m-partner').value.trim();
    const desc=document.getElementById('m-desc').value.trim();
    pushUndo();
    try{const all=JSON.parse(localStorage.getItem('gangstar_edits')||'{}');all[uid]={title,type,partner,desc};localStorage.setItem('gangstar_edits',JSON.stringify(all));}catch(e){}
    bg.remove();renderRegional();
  };
  bg.querySelector('.btn-save').onclick=saveFn;
  document.getElementById('m-title').onkeydown=e=>{if(e.key==='Enter')saveFn();};
}

function renderRegional(){
  const el=document.getElementById('regionalView');
  const today=new Date().toISOString().slice(0,10);
  const weeks=(REGIONAL_DATA&&REGIONAL_DATA.weeks)||[];
  if(!weeks.length){el.innerHTML='<p style="color:var(--muted);padding:40px;text-align:center">暂无素材数据</p>';return;}

  // 统一状态（与南亚社群排期共享：移动/隐藏/划线/编辑/自定义）
  const moves=getRegionMoves();
  const hidden=getRegionHidden();
  const cancelled=getRegionCancelled();
  const edits=getRegionEdits();
  const custom=getRegionCustom();
  const reqs=getReqSubmitted();
  regEditMap={};
  const dateWeek={};
  weeks.forEach((w,wi)=>w.days.forEach(d=>dateWeek[d.date]=wi));
  const dispItems=weeks.map(()=>({}));
  const addItem=(effDate,obj)=>{
    const ti=dateWeek[effDate];
    if(ti===undefined) return;
    (dispItems[ti][effDate]=dispItems[ti][effDate]||[]).push(obj);
  };
  // 源素材
  weeks.forEach((w,wi)=>{
    Object.entries(w.items||{}).forEach(([od,arr])=>{
      (arr||[]).forEach((it,ii)=>{
        const uid=regionUid(w.range,od,it,ii);
        if(hidden.has(uid)) return;
        const eff=moves[uid]||od;
        const ov=edits[uid]||null;
        regEditMap[uid]={type:ov?ov.type||it.type:it.type,title:ov?ov.title||it.title:it.title,partner:ov?ov.partner!==undefined?ov.partner:it.partner:it.partner,desc:ov?ov.desc!==undefined?ov.desc:it.desc:it.desc,isCustom:false};
        addItem(eff,{it,uid,isCustom:false,can:cancelled.has(uid),ov});
      });
    });
  });
  // 自定义素材（与南亚社群排期同一份 gangstar_custom，移动用 gangstar_regional_moves）
  Object.entries(custom).forEach(([od,arr])=>{
    (arr||[]).forEach(it=>{
      const uid='cus|'+it._id;
      if(hidden.has(uid)) return;
      const eff=moves[uid]||od;
      const ov=edits[uid]||null;
      regEditMap[uid]={type:ov?ov.type||it.type:it.type,title:ov?ov.title||it.title:it.title,partner:ov?ov.partner!==undefined?ov.partner:it.partner:it.partner,desc:ov?ov.desc!==undefined?ov.desc:it.desc:it.desc,isCustom:true};
      addItem(eff,{it,uid,isCustom:true,can:cancelled.has(uid),ov});
    });
  });

  const weeksHtml=weeks.map((week,wi)=>{
    const items=dispItems[wi];
    let totalItems=0;
    const typeCount={};
    CONTENT_TYPES.forEach(t=>typeCount[t.key]=0);
    Object.values(items||{}).forEach(dayItems=>{
      (dayItems||[]).forEach(x=>{const tp=(x.ov&&x.ov.type)?x.ov.type:x.it.type;totalItems++;if(typeCount[tp]!==undefined)typeCount[tp]++;});
    });

    const headHtml=`<div class="cal-head">
      <div>类型 \\ 日期</div>
      ${week.days.map(d=>{
        const isToday=d.date===today;
        return `<div class="${isToday?'today-ring':''}"><span class="date-num">${d.num}</span><span class="dow">${d.dow}</span><span class="reg-add" data-date="${d.date}" title="添加素材到此日">+</span></div>`;
      }).join('')}
    </div>`;

    const usedTypes=CONTENT_TYPES.filter(t=>typeCount[t.key]>0);
    const rowsHtml=usedTypes.map(t=>{
      const cells=week.days.map(d=>{
        let dayItems=(items[d.date]||[]).filter(x=>{const tp=(x.ov&&x.ov.type)?x.ov.type:x.it.type;return tp===t.key;});
        dayItems=sortRegItems(dayItems,d.date);
        const cellContent=dayItems.map(x=>{
          const o=x.it, ov=x.ov, uid=x.uid, can=x.can, isCustom=x.isCustom;
          const tp=(ov&&ov.type)?ov.type:o.type;
          const title=(ov&&ov.title)?ov.title:o.title;
          const partner=(ov&&ov.partner!==undefined)?ov.partner:(o.partner||'');
          const desc=(ov&&ov.desc!==undefined)?ov.desc:(o.desc||'');
          const typeCls='t-'+tp;
          const ti=(CONTENT_TYPES.find(c=>c.key===tp))||{name:tp};
          const partnerHtml=partner?`<div class="partner">合作方：<u>${esc(partner)}</u></div>`:'';
          const descHtml=desc?`<div class="partner" style="color:var(--ink);font-size:11px;margin-top:2px">${esc(desc)}</div>`:'';
          const cancelCls=can?'iact cancel on':'iact cancel';
          const reqOn=reqs[uid];
          const reqBox=`<div class="req-row"><span class="req-box ${reqOn?'on':''}" data-uid="${esc(uid)}" title="点此确认：已提交制作需求"><span class="mk">${reqOn?'✓':''}</span>${reqOn?'已提需求':'提需求'}</span></div>`;
          return `<div class="item ${typeCls}${can?' cancelled':''}" data-uid="${esc(uid)}" data-custom="${isCustom?1:0}"><span class="item-acts"><span class="iact edit" data-uid="${esc(uid)}" title="编辑">✎</span><span class="${cancelCls}" data-uid="${esc(uid)}" title="划线/恢复">划</span><span class="iact del" data-uid="${esc(uid)}" title="删除">×</span></span><span class="drag-handle" title="按住拖拽到其他日期">⠿</span><span class="tag">${esc(ti.name)}</span><div class="title">${esc(title)}</div>${partnerHtml}${descHtml}${reqBox}</div>`;
        }).join('');
        return `<div class="cell" data-date="${d.date}">${cellContent}</div>`;
      }).join('');
      return `<div class="cal-row">
        <div class="type-label"><span class="dot" style="background:${t.color}"></span>${t.icon} ${t.name}<span style="margin-left:auto;color:var(--muted);font-size:11px;font-weight:700">${typeCount[t.key]}</span></div>
        ${cells}
      </div>`;
    }).join('');

    const statsHtml=`<div class="regional-stats">
      <div class="rstat"><div class="rk">周期</div><div class="rv">${week.range}</div></div>
      <div class="rstat"><div class="rk">素材</div><div class="rv">${totalItems} 条</div></div>
      ${usedTypes.map(t=>`<div class="rstat"><div class="rk" style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:24%;background:${t.color};flex:none"></span>${t.name}</div><div class="rv">${typeCount[t.key]}</div></div>`).join('')}
    </div>`;

    return `<div class="regional-week"><h3>${week.label} · ${week.range}</h3>${statsHtml}${headHtml}<div class="cal-body">${rowsHtml}</div></div>`;
  }).join('');

  el.innerHTML=`
    <h2>📝 区域素材周历</h2>
    <div class="sub">区域社媒素材排期追踪 · 电竞 / meme / KOC / 社群等 7 类素材 · 卡片可拖拽改日期 · 同日内可拖拽重排 · 增删 / 移动 / 划线 / 编辑 与「南亚社群排期」实时同步</div>
    ${weeksHtml}
  `;
  // 绑定区域素材操作（编辑 / 划线 / 删除 / 添加）—— 与南亚社群排期共用同一份本地状态
  el.querySelectorAll('.item .iact.edit').forEach(b=>b.onclick=()=>openRegionEditModal(b.dataset.uid));
  el.querySelectorAll('.item .iact.del').forEach(b=>b.onclick=()=>{
    pushUndo();
    const arr=JSON.parse(localStorage.getItem('gangstar_hidden')||'[]');
    if(!arr.includes(b.dataset.uid)){arr.push(b.dataset.uid);localStorage.setItem('gangstar_hidden',JSON.stringify(arr));}
    renderRegional();
  });
  el.querySelectorAll('.item .iact.cancel').forEach(b=>b.onclick=()=>{
    pushUndo();
    let arr=JSON.parse(localStorage.getItem('gangstar_cancelled')||'[]');
    if(arr.includes(b.dataset.uid)) arr=arr.filter(x=>x!==b.dataset.uid); else arr.push(b.dataset.uid);
    localStorage.setItem('gangstar_cancelled',JSON.stringify(arr));
    renderRegional();
  });
  el.querySelectorAll('.item .req-box').forEach(b=>b.onclick=()=>toggleReq(b.dataset.uid));
  el.querySelectorAll('.reg-add').forEach(b=>b.onclick=()=>openAddModal(b.dataset.date));
}

// 区域素材拖拽改日期（按住卡片右上角手柄 · Pointer Events 实现，兼容性更好）
(function bindRegionDrag(){
  const rv=document.getElementById('regionalView');
  if(!rv) return;
  let drag=null;

  function cellFromPoint(x,y){
    const els=document.elementsFromPoint(x,y)||[];
    for(const el of els){
      if(el && el.closest){ const c=el.closest('.cell'); if(c) return c; }
    }
    return null;
  }
  function moveGhost(x,y){
    if(!drag) return;
    drag.ghost.style.left=(x-drag.dx)+'px';
    drag.ghost.style.top=(y-drag.dy)+'px';
  }
  function cleanup(){
    if(!drag) return;
    const d=drag; drag=null;
    if(d.ghost&&d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    d.item.classList.remove('dragging');
    if(d.cell) d.cell.classList.remove('drop-over');
    document.body.style.userSelect='';
    return d;
  }

  rv.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0) return;
    const h=e.target.closest&&e.target.closest('.drag-handle');
    if(!h) return;
    const item=h.closest('.item');
    if(!item||!item.getAttribute('data-uid')) return;
    e.preventDefault();
    const cell0=item.closest('.cell');
    const originDate=cell0?cell0.getAttribute('data-date'):'';
    const rect=item.getBoundingClientRect();
    const ghost=item.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width=rect.width+'px';
    document.body.appendChild(ghost);
    drag={uid:item.getAttribute('data-uid'),date:originDate,item:item,ghost:ghost,dx:e.clientX-rect.left,dy:e.clientY-rect.top,cell:null,moved:false};
    item.classList.add('dragging');
    document.body.style.userSelect='none';
    moveGhost(e.clientX,e.clientY);
  });

  document.addEventListener('pointermove',e=>{
    if(!drag) return;
    e.preventDefault();
    drag.moved=true;
    moveGhost(e.clientX,e.clientY);
    drag.ghost.style.visibility='hidden';
    const cell=cellFromPoint(e.clientX,e.clientY);
    drag.ghost.style.visibility='';
    if(drag.cell&&drag.cell!==cell) drag.cell.classList.remove('drop-over');
    if(cell) cell.classList.add('drop-over');
    drag.cell=cell;
    if(cell && cell.getAttribute('data-date')===drag.date){
      cell.querySelectorAll('.item.rb,.item.ra').forEach(x=>x.classList.remove('rb','ra'));
      const sp=[...cell.querySelectorAll('.item')].filter(x=>x!==drag.item);
      let tgt=null;
      for(const p of sp){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){tgt=p;break;}}
      if(tgt) tgt.classList.add('rb'); else if(sp.length){sp[sp.length-1].classList.add('ra');}
    }else{
      rv.querySelectorAll('.item.rb,.item.ra').forEach(x=>x.classList.remove('rb','ra'));
    }
  },{passive:false});

  document.addEventListener('pointerup',e=>{
    if(!drag) return;
    const cell=drag.cell, uid=drag.uid, moved=drag.moved, od=drag.date, di=drag.item;
    cleanup();
    if(!cell||!moved) return;
    const target=cell.getAttribute('data-date');
    if(target===od){
      pushUndo();
      const c=rv.querySelector('.cell[data-date="'+target+'"]');
      const it=[...c.querySelectorAll('.item')].filter(x=>x.getAttribute('data-uid')!==uid);
      let beforeUid=null;
      for(const p of it){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){beforeUid=p.getAttribute('data-uid');break;}}
      let seq=[];
      rv.querySelectorAll('.cal-row').forEach(row=>{
        const cc=row.querySelector('.cell[data-date="'+target+'"]');
        if(!cc) return;
        cc.querySelectorAll('.item').forEach(x=>{const u=x.getAttribute('data-uid');if(u!==uid) seq.push(u);});
      });
      if(beforeUid===null) seq.push(uid); else{const i=seq.indexOf(beforeUid);if(i<0)seq.push(uid);else seq.splice(i,0,uid);}
      setRegOrder(target,seq);
      renderRegional();
      return;
    }
    if(!target) return;
    pushUndo();
    const orig=(uid.split('|')[1])||'';
    const moves=getRegionMoves();
    if(target===orig) delete moves[uid]; else moves[uid]=target;
    localStorage.setItem('gangstar_regional_moves',JSON.stringify(moves));
    renderRegional();
  });

  document.addEventListener('pointercancel',()=>{cleanup();});
  window.addEventListener('blur',()=>{cleanup();});
})();

// 页面加载后如果当前是 regional 视图则渲染
if(views.regional.classList.contains('active')) renderRegional();
// 南亚社群排期（默认激活）初始渲染
if(views.sa.classList.contains('active')) renderSouthAsia();
</script>
