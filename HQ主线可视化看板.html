<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>Gangstar HQ 内容主线 · 可视化看板</title>
<style>
:root{
  --bg:#f5f6fb; --panel:#fff; --line:#e7e9f2; --text:#1f2430; --muted:#667085;
  --cog:#2f80ed; --cog-bg:#eaf3ff; --proof:#16a34a; --proof-bg:#ebfaef; --conv:#f59e0b; --conv-bg:#fff5df;
  --gap:#ef4444; --gap-bg:#feeaea;
  --s1:#6d28d9; --s2:#2563eb; --s3:#d97706; --s4:#0d9488; --s5:#0891b2; --s6:#64748b;
  --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif}
.wrap{max-width:1480px;margin:0 auto;padding:22px}
.hero{background:linear-gradient(135deg,#fff 0%,#f1edff 100%);border:1px solid var(--line);border-radius:24px;padding:22px;position:relative;overflow:hidden}
.hero .eyebrow{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
h1{margin:12px 0 8px;font-size:28px;line-height:1.2}
.sub{color:var(--muted);font-size:14px;line-height:1.7;max-width:920px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.mc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.mc .k{font-size:24px;font-weight:800}
.mc .l{font-size:12px;color:var(--muted);margin-top:4px}
.cd{display:flex;align-items:baseline;gap:8px}
.cd .big{font-size:30px;font-weight:900;color:var(--s1)}
.rolebar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:8px}
.rolebar span{display:block;height:100%}

/* 阶段时间轴 */
.timeline{display:flex;gap:0;margin:18px 0 6px;overflow-x:auto;padding-bottom:6px}
.tnode{flex:1;min-width:150px;border-top:4px solid var(--c);background:#fff;border-radius:0 0 14px 14px;padding:12px;cursor:pointer;position:relative;transition:.15s}
.tnode:hover{transform:translateY(-2px)}
.tnode.active{box-shadow:0 8px 22px rgba(40,30,90,.12);outline:2px solid var(--c)}
.tnode .tn{font-size:13px;font-weight:800}
.tnode .tr{font-size:11px;color:var(--muted);margin-top:4px}
.tnode .tc{font-size:11px;color:var(--c);font-weight:700;margin-top:6px}

.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted)}
.btn.active{background:var(--s1);border-color:var(--s1);color:#fff}
.fbtn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;font-size:12px;cursor:pointer;color:var(--muted)}
.fbtn.active{background:#efeaff;border-color:#cabfff;color:#4c3ed9}
.hint{font-size:12px;color:var(--muted)}

/* 时间线周区块 */
.weeks{display:flex;flex-direction:column;gap:16px}
.week{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;color:#fff}
.banner .bk{font-size:15px;font-weight:900}
.banner .br{font-size:12px;opacity:.92}
.banner .bt{font-size:13px;font-weight:700;margin-left:auto;max-width:60%;text-align:right}
.banner.gap{background:var(--gap)}
.gapnote{padding:12px 18px;font-size:13px;color:var(--gap);background:var(--gap-bg);font-weight:600}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:14px 18px 18px}
.it{border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:12px;padding:11px 13px;cursor:pointer;background:#fcfcff;transition:.12s}
.it:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,40,90,.07)}
.it .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:6px}
.it .tt{font-size:13.5px;font-weight:700;line-height:1.5}
.it .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.chip.form{background:#f1f2f7;color:#55607a}
.chip.role-cog{background:var(--cog-bg);color:#1c5db6}
.chip.role-proof{background:var(--proof-bg);color:#15753e}
.chip.role-conv{background:var(--conv-bg);color:#9a6200}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:14px}

/* 抽屉 */
.overlay{position:fixed;inset:0;background:rgba(20,22,40,.4);display:none;z-index:50}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:92vw;background:#fff;box-shadow:-12px 0 40px rgba(20,22,40,.18);transform:translateX(100%);transition:.25s;z-index:51;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dhead .dt{font-size:18px;font-weight:900;line-height:1.35}
.dhead .dm{font-size:12px;color:var(--muted);margin-top:6px}
.x{border:none;background:#f1f2f7;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;color:#55607a;flex:none}
.dbody{padding:18px 20px;overflow:auto}
.dsec{margin-bottom:18px}
.dsec h4{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.metab{background:#f5f6fb;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.metab b{display:block;font-size:13px;margin-top:2px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fcfcff}
.slot.hit{border-color:#cdc6ff;background:#f7f5ff}
.slot .sn{font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px}
.slot .st{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.slot .snone{font-size:11px;color:#aab;font-style:italic}

@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.drawer{width:100%}}
@media(max-width:760px){.tnode{min-width:130px}.items{grid-template-columns:1fr}.slots{grid-template-columns:1fr}}
</style>
</head>

const STAGE_COLOR = {
  "① 预注册启动期":"var(--s1)","② 世界观/玩法蓄热期":"var(--s2)","③ 倒计时冲刺期":"var(--s3)",
  "④ 开服爆点期":"var(--s4)","⑤ 栏目化运营期":"var(--s5)","⑥ 活动延续期":"var(--s6)","⚠️ HQ 空窗期":"var(--gap)"
};
const ROLE_CLASS = {"认知":"role-cog","证明":"role-proof","转化":"role-conv"};
const ROLE_COLOR = {"认知":"var(--cog)","证明":"var(--proof)","转化":"var(--conv)"};
const SLOT_EMOJI = {"游戏内录":"🎮","网红":"🌟","市场活动":"📣","KOC":"👥","India meme":"😂","区域端内活动":"🏙️","社群活动":"💬"};

const state = { top:'all', stage:null, role:'全部' };

function allWeeks(){ return DATA.pre.concat(DATA.post); }
function roleCount(phase){
  const s = DATA.overview.stats[phase];
  const total = s['认知']+s['证明']+s['转化'];
  return {s, total};
}

/* 倒计时 */
function renderMetrics(){
  const launch = new Date(DATA.launch + 'T00:00:00');
  const today = new Date();
  const days = Math.round((launch - today)/86400000);
  const preT = DATA.pre.reduce((a,w)=>a+w.items.length,0);
  const postT = DATA.post.reduce((a,w)=>a+w.items.length,0);
  const total = preT+postT;
  const rp = roleCount('pre'), ro = roleCount('post');
  const prePct = Math.round(rp.s['认知']/rp.total*100), preProof=Math.round(rp.s['证明']/rp.total*100), preConv=100-prePct-preProof;
  document.getElementById('metrics').innerHTML = `
    <div class="mc"><div class="cd"><span class="big">${days}</span><span style="color:var(--muted);font-size:13px">天</span></div><div class="l">距上线 ${DATA.launch}</div></div>
    <div class="mc"><div class="k">${total}</div><div class="l">HQ 有效素材总数</div></div>
    <div class="mc"><div class="k">${preT}</div><div class="l">上线前（7/2–8/19）</div></div>
    <div class="mc"><div class="k">${postT}</div><div class="l">上线后（8/20–9/8）</div></div>
    <div class="mc"><div class="k" style="font-size:14px;line-height:1.5">上线前<br><span style="color:var(--cog)">认知${rp.s['认知']}</span> · <span style="color:var(--proof)">证明${rp.s['证明']}</span> · <span style="color:var(--conv)">转化${rp.s['转化']}</span></div><div class="l">内容角色分布</div>
      <div class="rolebar"><span style="width:${prePct}%;background:var(--cog)"></span><span style="width:${preProof}%;background:var(--proof)"></span><span style="width:${preConv}%;background:var(--conv)"></span></div>
    </div>`;
}

/* 阶段时间轴 */
function renderTimeline(){
  const tl = document.getElementById('timeline');
  tl.innerHTML = DATA.overview.stages.map(st=>{
    const c = STAGE_COLOR[st.name]||'var(--s1)';
    const cnt = allWeeks().filter(w=>w.stage===st.name).reduce((a,w)=>a+w.items.length,0);
    const active = state.stage===st.name ? 'active':'';
    return `<div class="tnode ${active}" style="--c:${c}" data-stage="${st.name}">
      <div class="tn">${st.name}</div>
      <div class="tr">${st.range}</div>
      <div class="tc">${cnt} 条 · ${st.narrative.slice(0,18)}…</div>
    </div>`;
  }).join('');
  tl.querySelectorAll('.tnode').forEach(n=>n.onclick=()=>{
    state.stage = (state.stage===n.dataset.stage)?null:n.dataset.stage;
    renderTimeline(); renderWeeks();
  });
}

function renderTabs(){
  const tabs=[['all','全部'],['pre','上线前'],['post','上线后']];
  document.getElementById('phaseTabs').innerHTML = tabs.map(([k,l])=>
    `<button class="btn ${state.top===k?'active':''}" data-top="${k}">${l}</button>`).join('');
  document.querySelectorAll('#phaseTabs .btn').forEach(b=>b.onclick=()=>{state.top=b.dataset.top;renderTabs();renderWeeks();});
  const roles=['全部','认知','证明','转化'];
  document.getElementById('roleFilters').innerHTML = roles.map(r=>
    `<button class="fbtn ${state.role===r?'active':''}" data-role="${r}">${r}</button>`).join('');
  document.querySelectorAll('#roleFilters .fbtn').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;renderTabs();renderWeeks();});
}

function filteredWeeks(){
  return allWeeks().filter(w=>{
    if(state.top!=='all' && w.phase!==state.top) return false;
    if(state.stage && w.stage!==state.stage) return false;
    return true;
  });
}

function renderWeeks(){
  const wrap=document.getElementById('weeks');
  const weeks=filteredWeeks();
  if(!weeks.length){ wrap.innerHTML=`<div class="empty">当前筛选下没有内容</div>`; return; }
  wrap.innerHTML = weeks.map(w=>{
    const isGap = w.stage.includes('空窗');
    const color = STAGE_COLOR[w.stage]||'var(--s1)';
    const items = state.role==='全部' ? w.items : w.items.filter(it=>it.role===state.role);
    const itemsHtml = items.length ? items.map((it,i)=>{
      const rc = ROLE_COLOR[it.role]||'var(--line)';
      const rc2 = ROLE_CLASS[it.role]||'';
      return `<div class="it" style="--rc:${rc}" data-w="${w.stage}" data-i="${i}">
        <div class="top"><span>${it.date.slice(5)} · ${it.weekday}</span><span>${it.dlabel}</span></div>
        <div class="tt">${it.content}</div>
        <div class="chips">
          <span class="chip form">${it.form||'—'}</span>
          <span class="chip ${rc2}">${it.role}</span>
        </div>
      </div>`;
    }).join('') : `<div class="empty">本周无「${state.role}」类素材</div>`;
    const bannerHtml = `<div class="banner ${isGap?'gap':''}" style="background:${isGap?'':color}">
        <div><div class="bk">${w.stage}</div><div class="br">${w.range}</div></div>
        <div class="bt">📌 周主题：${w.theme||'—'}</div>
      </div>`;
    const noteHtml = w.note ? `<div class="gapnote">⚠️ ${w.note}</div>` : '';
    return `<div class="week">${bannerHtml}${noteHtml}<div class="items">${itemsHtml}</div></div>`;
  }).join('');
  // 事件委托在 render() 后统一绑定，兼容自动化测试 click
}

function openDrawer(it){
  document.getElementById('dTitle').textContent = it.content;
  document.getElementById('dMeta').textContent = `${it.date.slice(5)} ${it.weekday} · ${it.dlabel} · ${it.form}`;
  const slotsHtml = Object.keys(it.slots).map(k=>{
    const v = it.slots[k];
    const hit = v ? 'hit':'';
    const body = v ? `<div class="st">${v}</div>` : `<div class="snone">本素材未指定</div>`;
    return `<div class="slot ${hit}"><div class="sn">${SLOT_EMOJI[k]} ${k}</div>${body}</div>`;
  }).join('');
  document.getElementById('dBody').innerHTML = `
    <div class="dsec">
      <h4>基本信息</h4>
      <div class="meta-row">
        <div class="metab">内容角色<b>${it.role}</b></div>
        <div class="metab">形态<b>${it.form||'—'}</b></div>
        <div class="metab">距上线<b>${it.dlabel}</b></div>
      </div>
      <div class="metab" style="width:100%">平台 / 时间<b style="font-weight:600;color:var(--text)">${it.platform||'未标注'}</b></div>
    </div>
    <div class="dsec">
      <h4>7 类区域素材承接方案</h4>
      <div class="slots">${slotsHtml}</div>
    </div>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}
document.getElementById('overlay').onclick=closeDrawer;
document.getElementById('dClose').onclick=closeDrawer;

renderMetrics();
renderTimeline();
renderTabs();
renderWeeks();

// 事件委托：点击素材卡片打开抽屉（兼容 agent-browser / Playwright click）
document.getElementById('weeks').addEventListener('click', e => {
  const it = e.target.closest('.it');
  if (!it) return;
  const w = allWeeks().find(x => x.stage === it.dataset.w);
  const item = w?.items[+it.dataset.i];
  if (item) openDrawer(item);
});
</script>
</body>
