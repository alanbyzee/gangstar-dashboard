<style>
:root{
  --page-max:1480px;
  --bg:#eef1f7;
  --card:#ffffff;
  --ink:#1e2433;
  --muted:#7c8499;
  --line:#e7eaf1;
  --brand:#6d28d9;
  --brand2:#2563eb;
  --brand-soft:#f2eeff;
  --ok:#10b981;
  --err:#ef4444;
  --warn:#f59e0b;
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 24px rgba(16,24,40,.09);
  --shadow-lg:0 16px 44px rgba(16,24,40,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 420px at 50% -140px, rgba(109,40,217,.07), transparent 62%),
    linear-gradient(180deg,#f7f8fc 0%, #eef1f7 100%);
  color:var(--ink);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* 自定义滚动条 */
.view.scroll::-webkit-scrollbar,.fan::-webkit-scrollbar,.regional::-webkit-scrollbar,.southasia::-webkit-scrollbar,.sa-modal::-webkit-scrollbar{width:10px;height:10px}
.view.scroll::-webkit-scrollbar-thumb,.fan::-webkit-scrollbar-thumb,.regional::-webkit-scrollbar-thumb,.southasia::-webkit-scrollbar-thumb{background:#d3d8e3;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.view.scroll::-webkit-scrollbar-thumb:hover,.fan::-webkit-scrollbar-thumb:hover,.regional::-webkit-scrollbar-thumb:hover,.southasia::-webkit-scrollbar-thumb:hover{background:#b9c0d0;background-clip:padding-box}

/* ===== 顶部导航 ===== */
.topbar{
  position:relative;
  display:flex;flex-wrap:wrap;align-items:center;gap:18px 18px;padding:13px 48px;
  max-width:var(--page-max);width:100%;margin:0 auto;align-self:center;
  z-index:5;flex:none;
}
.topbar::before{
  content:"";position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:100vw;z-index:-1;
  background:linear-gradient(180deg,#ffffff,#fbfbff);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 14px rgba(16,24,40,.05);
}
.brand{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:.2px;flex-shrink:0}
.brand .dot{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 0 4px rgba(109,40,217,.13)}
.tabs{display:flex;gap:6px;margin-left:8px;background:#f1f2f7;padding:5px;border-radius:14px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#c4c9d6 transparent;-webkit-overflow-scrolling:touch}
.tab{padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid transparent;background:transparent;transition:.18s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 4px 12px rgba(109,40,217,.28)}
.tab-toggle{padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px dashed #c4b5fd;background:#faf5ff;color:#7c3aed;transition:.18s;white-space:nowrap;font-family:inherit}
.tab-toggle:hover{background:#f3e8ff;border-color:#7c3aed}
.tab-toggle.on{border-style:solid;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(109,40,217,.28)}
.spacer{flex:1}
.upd{font-size:12px;color:var(--muted);white-space:nowrap;flex:1 1 100%}
.undo-btn{margin-left:10px;padding:8px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.undo-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);box-shadow:0 3px 10px rgba(109,40,217,.12)}
.undo-btn:active{transform:translateY(1px)}
@media(max-width:680px){
  .topbar{flex-wrap:wrap;gap:6px 8px;padding:10px 14px}
  .brand{font-size:15px;flex:1 1 100%}
  .tabs{order:3;flex:1 1 100%;margin-left:0;margin-top:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .upd{order:4;font-size:11.5px;color:#94a3b8}
  .undo-btn{display:none}
  .spacer{display:none}
}

/* ===== 内容区 ===== */
.stage{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.active{display:block;animation:viewIn .26s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view.scroll{overflow:auto;padding-right:2px}

/* ===== 粉丝监控 ===== */
.fan{padding:24px 32px 32px;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.35fr .65fr;gap:16px;align-items:start}
.fan>.fan-head{grid-column:1/-1}
.fan>.cc-overview{grid-column:1/-1;display:flex;flex-direction:column;gap:16px}
.fan>.plat-grid{grid-column:1/-1}
@media(max-width:860px){.fan{grid-template-columns:1fr}}
.fan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.fan h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.fan .sub{font-size:13px;color:var(--muted);margin-bottom:10px}

/* 工具栏 + 刷新状态 */
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.refresh{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;padding:11px 21px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(109,40,217,.28);display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;transition:.18s}
.refresh:hover{box-shadow:0 6px 18px rgba(109,40,217,.36)}
.refresh:active{transform:translateY(1px)}
.refresh[disabled]{opacity:.65;cursor:default}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh .spin{display:none;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.refresh.loading .spin{display:inline-block}
.refresh.loading .btn-text{opacity:.5}
.status{font-size:13px;font-weight:600;padding:6px 13px;border-radius:9px;display:none}
.status.show{display:inline-block}
.status.ok{color:var(--ok);background:#ecfdf5;border:1px solid #a7f3d0}
.status.err{color:var(--err);background:#fef2f2;border:1px solid #fecaca}
.status.warn{color:var(--warn);background:#fffbeb;border:1px solid #fde68a}
.status.info{color:var(--brand2);background:#eff6ff;border:1px solid #bfdbfe}

/* Toast 通知 */
.toast{position:fixed;top:80px;right:24px;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:999;transform:translateX(120%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-width:380px;line-height:1.5;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(0)}
.toast.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.toast.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}

/* 概览区：平台统一表格（与目标面板 .fan grid 并排） */
.overview{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
/* ===== 粉丝监控顶部：单行紧凑仪表盘（健康分 | 总粉丝 | 平台快览 | KPI pills） ===== */
.fan-header{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
/* 健康分徽章（左侧） */
.fh-health{display:flex;align-items:center;gap:10px;flex:none;padding-right:16px;border-right:2px solid #eef2f7}
.fh-score{font-size:32px;font-weight:900;line-height:1;letter-spacing:-1px}
.fh-score-lbl{font-size:11px;color:var(--muted);font-weight:700;line-height:1.2;text-align:center}
.fh-meta{font-size:10px;color:#94a3b8;font-weight:600}
/* 总粉丝（中间） */
.fh-total-block{flex:none;min-width:160px}
.fh-total-num{font-size:26px;font-weight:900;color:var(--ink);letter-spacing:-.5px;line-height:1.1}
.fh-total-delta{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:3px;margin-top:2px}
.fh-d-up{color:#065f46;background:#ecfdf5}.fh-d-down{color:#991b1b;background:#fef2f2}.fh-d-flat{color:#64748b;background:#f8fafc}
/* 平台快速数字（弹性区） */
.fh-platforms{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
.fh-plat{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px;border-radius:10px;background:#f8fafc;border:1px solid #f0f2f7;flex:none;min-width:72px;transition:background .15s}
.fh-plat:hover{background:#f1f5f9}
.fh-plat-ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10px;letter-spacing:.3px}
.fh-plat-nm{font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px;text-align:center}
.fh-plat-val{font-size:14px;font-weight:900;color:var(--ink);letter-spacing:-.3px;font-variant-numeric:tabular-nums;line-height:1.15}
.fh-plat-wk{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;line-height:1.3}
/* KPI pills（右侧） */
.fh-kpis{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.fh-kpi{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 12px;border-radius:10px;border:1px solid #eef2f7;background:#fafbfc;min-width:64px}
.fh-kpi-v{font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.3px}
.fh-kpi-l{font-size:9px;color:var(--muted);font-weight:700;white-space:nowrap}
/* ===== 统一折线图区（从平台卡片中提取） ===== */
.charts-section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.charts-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.charts-head h3{margin:0;font-size:14px;font-weight:800;color:var(--ink)}
.charts-head span{font-size:11px;color:var(--muted);font-weight:600}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.chart-card{background:#fafbfc;border:1px solid #f0f2f7;border-radius:12px;padding:12px 14px}
.chart-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-card-ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;flex:none}
.chart-card-name{font-size:13px;font-weight:800;color:var(--ink)}
.chart-card .chart-area{background:#fff;border:1px solid #eef2f7;border-radius:8px;overflow:hidden}
/* ===== 粉丝监控：六大板块竖向重构 ===== */
.fan-block{margin-bottom:18px}
.fan-block:last-child{margin-bottom:0}
/* 1. 粉丝目标进度（Hero） */
.goal-card{background:linear-gradient(135deg,#ffffff,#faf8ff);border:1px solid var(--line);border-radius:18px;padding:20px 24px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.goal-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.goal-d{font-size:14px;font-weight:800;color:var(--muted);flex:none}
.goal-d b{font-size:30px;color:var(--brand);font-weight:900;line-height:1}
.goal-title{flex:1;min-width:0}
.goal-title h3{margin:0 0 2px;font-size:18px;font-weight:900;color:var(--ink)}
.goal-sub{font-size:12.5px;color:var(--muted);font-weight:600}
.goal-sub b{color:var(--ink)}
.goal-pct{font-size:30px;font-weight:900;color:var(--brand2);flex:none;line-height:1}
.goal-pct span{font-size:15px;font-weight:800;margin-left:1px}
.goal-pct.done{color:var(--ok)}
.goal-bar{height:16px;background:#eef2f7;border-radius:10px;overflow:hidden;margin-bottom:14px;box-shadow:inset 0 1px 2px rgba(16,24,40,.06)}
.goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:10px}
.goal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 16px;margin-bottom:10px}
.goal-grid>div{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.goal-grid b{font-weight:900;color:var(--ink);font-size:16px;line-height:1.2}
.goal-grid b.t-up{color:var(--ok)}
.goal-grid small{font-size:10px;color:var(--muted)}
.t-up{color:var(--ok)!important}
.goal-note{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.goal-note b{color:var(--ink)}
.goal-edit{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:4px;padding-top:10px;border-top:1px solid #f0f0f0}
.goal-edit input{width:80px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-weight:700;color:var(--ink)}
.goal-edit button{font-size:11px;padding:4px 12px;border:none;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:6px;cursor:pointer;font-weight:700;transition:.15s}
.goal-edit button:hover{box-shadow:0 2px 8px rgba(109,40,217,.25)}
/* 2. 各平台粉丝基数 share 条 */
.pc-share{margin:4px 0 2px}
.pc-share-bar{height:6px;background:#eef2f7;border-radius:5px;overflow:hidden}
.pc-share-bar i{display:block;height:100%;border-radius:5px;opacity:.85}
.pc-share-pct{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px;display:block}
/* 3. 折线图卡片加当前值 */
.chart-card-val{margin-left:auto;font-size:13px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
/* 5. KPI 容器 */
.kpi-wrap{margin-bottom:4px}
/* 6. 本周洞察 */
.insights-wrap{margin-bottom:0}
.ins-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.ins-col{display:flex;flex-direction:column}
.ins-summary-box{display:flex;gap:10px;background:#faf8ff;border:1px solid #ede9fe;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--ink);margin-bottom:14px}
.ins-summary-box b{color:var(--brand)}
.ins-summary-ico{font-size:18px;flex:none;line-height:1.4}
.ins-h{font-size:13.5px;font-weight:800;margin:6px 0 8px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.ins-col .ins-h:not(:first-child){margin-top:16px}
@media(max-width:760px){
  .goal-grid{grid-template-columns:repeat(2,1fr)}
  .goal-top{flex-wrap:wrap}
  .ins-grid{grid-template-columns:1fr}
  .goal-d b{font-size:24px}
  .goal-pct{font-size:24px}
}
@media(max-width:520px){
  .goal-grid{grid-template-columns:1fr}
}
.ov-row-top{display:grid;grid-template-columns:1fr;gap:14px}
.ov{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 18px;box-shadow:var(--shadow-sm);transition:.2s}
.ov:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ov--wide{display:flex;align-items:center;gap:16px}
.ov--wide .k{font-size:12px;color:var(--muted);white-space:nowrap}
.ov--wide .v{font-size:28px;font-weight:900;margin:0;letter-spacing:-.5px}
.ov .k{font-size:12px;color:var(--muted)}
.ov .v{font-size:26px;font-weight:800;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ov .v small{font-size:13px;color:var(--muted);font-weight:600}

/* 统一平台表（占比条形 + 数值 + 周涨，合并原卡片网格与占比面板） */
/* 统一平台表：grid 精确对齐 + 细条形 + 真实占比% + 色块图标 */
.uni-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px 12px;box-shadow:var(--shadow-sm)}
.uni-head{display:grid;grid-template-columns:184px 1fr 88px 100px;align-items:center;gap:14px;padding:0 6px 12px;margin-bottom:6px;border-bottom:1px solid var(--line);font-size:11px;color:#94a3b8;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.uni-head .r{text-align:right}
.uni-row{display:grid;grid-template-columns:184px 1fr 88px 100px;align-items:center;gap:14px;padding:9px 6px;border-radius:12px;transition:background .15s}
.uni-row:hover{background:#f8fafc}
.uni-info{display:flex;align-items:center;gap:10px;min-width:0}
.uni-ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;letter-spacing:.3px}
.uni-meta{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.uni-name{font-size:13.5px;font-weight:800;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uni-handle{font-size:10.5px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uni-trackwrap{display:flex;align-items:center;gap:10px;min-width:0}
.uni-track{flex:1;height:9px;background:#eef2f7;border-radius:6px;overflow:hidden;min-width:0}
.uni-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.22,1,.36,1);min-width:2px}
.uni-pct{width:40px;flex:none;text-align:right;font-size:11px;font-weight:700;color:#64748b;font-variant-numeric:tabular-nums}
.uni-val{text-align:right;font-size:15px;font-weight:900;color:#0f172a;font-variant-numeric:tabular-nums}
.uni-wk{text-align:right}

/* 本周涨粉标签（共用） */
.wk-up{font-size:11px;font-weight:700;color:var(--ok);background:#ecfdf5;border:1px solid #a7f3d0;padding:2px 8px;border-radius:8px;display:inline-flex;align-items:center}
.wk-down{font-size:11px;font-weight:700;color:var(--err);background:#fef2f2;border:1px solid #fecaca;padding:2px 8px;border-radius:8px;display:inline-flex;align-items:center}
.wk-flat{font-size:11px;font-weight:600;color:var(--muted);background:#f9fafb;border:1px solid var(--line);padding:2px 8px;border-radius:8px;display:inline-flex;align-items:center}
.wk-total{font-size:12px;font-weight:700;color:#fff!important;background:linear-gradient(135deg,var(--brand),var(--brand2));padding:2px 9px;border-radius:8px;margin-left:4px}

/* 平台卡片网格（每张含：图标/名称/handle/数值/周增长/折线图/note/链接） */
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-bottom:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 17px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.2s}
.pc:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pc-bar{position:absolute;top:0;left:0;width:5px;height:100%;border-radius:16px 0 0 16px}
.pc-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.pc-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pc-titles{min-width:0;flex:1}
.pc-name{font-size:14.5px;font-weight:800}
.pc-handle{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-link{font-size:16px;color:var(--muted);text-decoration:none;flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.15s}
.pc-link:hover{background:var(--brand-soft);color:var(--brand)}
.pc-valrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.pc-val{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}

/* ===== v4 交互层：按周分块 + 核心议题点击展开真实玩家反馈 ===== */
.fb4-weeks{margin-top:28px}
.fb4-weeks-h{font-size:13px;font-weight:700;color:#64748b;margin:0 2px 14px;letter-spacing:.01em}
.fb4-wk{background:#fff;border:1px solid #EEF0F4;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.03),0 4px 14px rgba(16,24,40,.04)}
.fb4-wk+.fb4-wk{margin-top:16px}
.fb4-wk-head{display:flex;align-items:center;gap:14px;padding:18px 24px;cursor:pointer;user-select:none;transition:background .15s}
.fb4-wk-head:hover{background:#fafbfc}
.fb4-wk-week{font-size:15px;font-weight:800;color:#0f172a}
.fb4-wk-sub{font-size:12.5px;color:#64748b;margin-top:3px;max-width:560px;line-height:1.5}
.fb4-wk-att{font-size:12px;font-weight:800;padding:3px 12px;border-radius:999px;background:#f1f5f9;color:#64748b;white-space:nowrap}
.fb4-wk-att.pos{background:#ecfdf5;color:#059669}.fb4-wk-att.neg{background:#fef2f2;color:#dc2626}.fb4-wk-att.wave{background:#fffbeb;color:#b45309}
.fb4-wk-mini{display:flex;gap:12px;font-size:12px;font-weight:800;margin-left:auto;white-space:nowrap}
.fb4-wk-mini .pos{color:#16a34a}.fb4-wk-mini .neg{color:#dc2626}
.fb4-wk-chev{color:#94a3b8;font-size:13px;transition:transform .2s;margin-left:4px}
.fb4-wk.open .fb4-wk-chev{transform:rotate(90deg)}
.fb4-wk-body{display:none;border-top:1px solid #f1f5f9;padding:6px 24px 22px}
.fb4-wk.open .fb4-wk-body{display:block}
.fb4-issues{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.fb4-grp{margin-top:18px}
.fb4-grp:first-child{margin-top:12px}
.fb4-grp-h{display:flex;align-items:center;gap:9px;padding:2px 2px 10px;border-bottom:1px solid #f1f5f9;margin-bottom:4px}
.fb4-grp-ic{font-size:14px;line-height:1}
.fb4-grp-n{font-size:13px;font-weight:800}
.fb4-grp-c{font-size:11px;font-weight:800;color:#64748b;background:#f1f5f9;border-radius:999px;padding:2px 9px;margin-left:auto}
.fb4-grp-good .fb4-grp-n{color:#047857}.fb4-grp-good .fb4-grp-c{background:#ecfdf5;color:#059669}
.fb4-grp-sug .fb4-grp-n{color:#b45309}.fb4-grp-sug .fb4-grp-c{background:#fffbeb;color:#b45309}
.fb4-grp-bad .fb4-grp-n{color:#b91c1c}.fb4-grp-bad .fb4-grp-c{background:#fef2f2;color:#dc2626}
.fb4-iss{background:#fff;border:1px solid #EEF0F4;border-radius:12px;overflow:hidden}
.fb4-iss-head{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;user-select:none}
.fb4-iss-head:hover{background:#fafbfc}
.fb4-iss-dot{width:9px;height:9px;border-radius:50%;flex:none}
.fb4-iss-dot.good{background:#16a34a}.fb4-iss-dot.sug{background:#f59e0b}.fb4-iss-dot.bad{background:#dc2626}
.fb4-iss-title{font-size:14.5px;font-weight:800;color:#0f172a;line-height:1.4;flex:1;min-width:0}
.fb4-iss-cnt{font-size:12px;color:#64748b;font-weight:700;white-space:nowrap}
.fb4-iss-chev{color:#94a3b8;font-size:12px;transition:transform .2s}
.fb4-iss.open .fb4-iss-chev{transform:rotate(90deg)}
.fb4-iss-body{display:none;border-top:1px solid #f1f5f9;padding:0 18px 18px}
.fb4-iss.open .fb4-iss-body{display:block}
.fb4-fb{background:#F8F9FB;border-radius:12px;padding:16px;margin-top:12px}
.fb4-fb-zh{font-size:14px;line-height:1.75;color:#0f172a;white-space:pre-wrap;word-break:break-word}
.fb4-fb-en{font-size:12.5px;line-height:1.6;color:#64748b;margin-top:10px;white-space:pre-wrap;word-break:break-word;border-left:3px solid #e2e8f0;padding-left:12px}
.fb4-fb-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.fb4-tag{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 12px;white-space:nowrap}
.fb4-tag.st-good{background:#ecfdf5;color:#059669}.fb4-tag.st-sug{background:#fffbeb;color:#b45309}.fb4-tag.st-bad{background:#fef2f2;color:#dc2626}.fb4-tag.st-def{background:#f1f5f9;color:#64748b}
.fb4-tag.ch{background:#eef2ff;color:#4338ca}
.fb4-evi{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#2563eb;text-decoration:none;background:#eff6ff;border-radius:999px;padding:4px 12px}
.fb4-empty{padding:40px;text-align:center;color:#94a3b8;font-size:13px}
@media(max-width:600px){.fb4-wk-head{flex-wrap:wrap;gap:10px}.fb4-wk-mini{margin-left:0;width:100%}.fb4-wk-sub{max-width:none}}

.lg{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}
.lg.g{background:#22c55e}.lg.s{background:#eab308}.lg.b{background:#ef4444}
@media(max-width:1000px){.fb-weekly-grid{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.fb-weekly-grid{grid-template-columns:1fr}.fb-banner{grid-template-columns:1fr}.ch-name{width:84px}.fb-week-tab{min-width:90px}.fb-banner-val{font-size:22px}}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:.2s;box-shadow:var(--shadow-sm)}
.pc:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.pc .bar{position:absolute;top:0;left:0;width:4px;height:100%;border-radius:14px 0 0 14px}
.pc .ph{display:flex;align-items:center;gap:8px}
.pc .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.pc .nm{font-size:13px;font-weight:800}
.pc .hd{font-size:10.5px;color:var(--muted)}
.pc .big{font-size:24px;font-weight:800;letter-spacing:-.5px}
.pc .big small{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:4px}
.pc .delta{font-size:11.5px;font-weight:700}
.pc .delta.up{color:var(--ok)}.pc .delta.down{color:var(--err)}.pc .delta.flat{color:#9ca3af}
.pc .note{font-size:11px;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:4px 8px}
/* 折线图区域 */
.chart-area{margin-top:2px;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:6px}
.chart-area svg{width:100%;height:auto}
.pc .lk{font-size:11px;color:var(--brand);text-decoration:none;word-break:break-all}
.pc .lk:hover{text-decoration:underline}

/* ===== 洞察区：目标进度（与平台表并排） ===== */
.insights{margin-bottom:18px}
.insights>.panel{display:flex;flex-direction:column}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);transition:.2s}
.panel:hover{box-shadow:var(--shadow-md)}
.panel h3{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.panel h3 .em{font-size:15px}

/* ---- 左面板：作战进度（紧凑仪表盘） ---- */
.mission-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.mission-d{font-size:28px;font-weight:900;color:var(--brand);line-height:1;flex:none}
.mission-dl{font-size:12.5px;color:var(--muted);line-height:1.3}
.mission-pct{margin-left:auto;font-size:22px;font-weight:900;color:var(--brand2);flex:none;line-height:1}
.prog{height:14px;background:#eef2f7;border-radius:9px;overflow:hidden;margin-bottom:10px;box-shadow:inset 0 1px 2px rgba(16,24,40,.06)}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:9px;transition:width .6s}
.mission-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr .9fr;gap:6px 14px;margin-bottom:8px}
.mission-cell{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.mission-cell b{font-weight:900;color:var(--ink);font-size:15px;line-height:1.2}
.mission-cell .v-ok{color:var(--ok)}
.mission-cell--fan b{color:var(--brand);font-size:17px}
.target-edit{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:8px;border-top:1px solid #f0f0f0}
.target-edit input{width:72px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-weight:700;color:var(--ink)}
.target-edit button{font-size:11px;padding:4px 10px;border:none;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:6px;cursor:pointer;font-weight:700;transition:.15s}
.target-edit button:hover{box-shadow:0 2px 8px rgba(109,40,217,.25)}

/* 本周涨粉总结 */
.wk-summary{font-size:12.5px;line-height:1.5;color:var(--ink);margin-top:8px;padding:8px 10px;border-left:3px solid var(--brand2);border-radius:0 8px 8px 0;background:linear-gradient(135deg,#fafbff,#f5f3ff)}
.wk-summary p{margin:0}
.wk-summary b{font-weight:800}
.wk-summary .up{color:var(--ok)}
.wk-inline{margin-top:5px;font-size:11.5px;line-height:1.45;color:var(--ink)}
.wk-inline p{margin:0}
.wk-inline b{font-weight:800}
.wk-inline .up{color:var(--ok)}

.badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:6px 13px;border-radius:20px;font-size:13px;font-weight:800;box-shadow:0 3px 10px rgba(217,119,6,.3)}

/* 卡片动能行 */
.momentum{display:flex;gap:10px;flex-wrap:wrap;margin-top:1px}
.momentum .m{display:flex;flex-direction:column;gap:1px}
.momentum .m .k{font-size:9.5px;color:var(--muted)}
.momentum .m .v{font-size:12px;font-weight:800}
.m-up{color:var(--ok)}.m-down{color:var(--err)}.m-flat{color:#9ca3af}

/* ===== 区域素材周历 ===== */
.regional{padding:32px 48px 52px;max-width:var(--page-max);margin:0 auto;position:relative}
.regional h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.regional .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
/* 周历表头 */
.cal-head{display:grid;grid-template-columns:140px repeat(7,1fr);gap:0;border:1px solid var(--line);border-radius:14px 14px 0 0;overflow:hidden;box-shadow:var(--shadow-sm)}
.cal-head>div{text-align:center;padding:12px 6px;font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.cal-head>div:first-child{background:#fbfbfe;color:var(--ink);border-right:1px solid var(--line)}
.cal-head .date-num{font-size:15px;display:block;margin-top:2px}
.cal-head .dow{font-size:11px;opacity:.85}
.cal-head .today-ring{box-shadow:inset 0 0 0 2px #fbbf24,0 0 8px rgba(251,191,36,.4);border-radius:8px}
/* 周历行 */
.cal-body{display:grid;grid-template-columns:140px repeat(7,1fr);gap:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.cal-row{display:contents}
.type-label{padding:12px 14px;font-size:12px;font-weight:700;color:var(--ink);background:#fafbfc;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.type-label .dot{width:9px;height:9px;border-radius:3px;flex:none}
.cell{padding:8px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:56px;background:#fff;font-size:12px;position:relative;transition:background .12s}
.cell:hover{background:#fcfcff}
.cell:last-child{border-right:none}
/* 素材卡片 */
.item{background:#fafbfd;border:1px solid #eef0f4;border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:12px;line-height:1.5;transition:box-shadow .15s,transform .12s;position:relative;text-align:left}
.item.dragging{opacity:.3}
.drag-ghost{position:fixed !important;left:0;top:0;margin:0 !important;pointer-events:none;z-index:9999;opacity:.96;box-shadow:0 12px 28px rgba(0,0,0,.2);transform:rotate(-1.5deg);background:#fff;transition:none !important;will-change:transform}
.cell.drop-over{background:#fff7ed;outline:2px dashed #f59e0b;outline-offset:-3px}
.item:hover{box-shadow:0 4px 14px rgba(16,24,40,.09);transform:translateY(-1px)}
/* 头部：DELAY + 类别 + 操作按钮（含拖拽手柄），flex 分层排布，互不重叠 */
.it-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;text-align:left}
.it-acts{margin-left:auto;display:flex;align-items:center;gap:1px;flex:none}
.item .drag-handle{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e2e5ea;border-radius:5px;background:#eef0f4;color:#9aa1ac;font-size:11px;line-height:1;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:.12s;flex:none}
.item .drag-handle:hover{background:#f59e0b;border-color:#f59e0b;color:#fff;transform:scale(1.08)}
.item .drag-handle:active{cursor:grabbing}
.it-body{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left}
.item .iact{cursor:pointer;font-size:10px;line-height:1.4;color:#9aa1ac;padding:1px 3px;border-radius:3px;user-select:none;-webkit-user-select:none}
.item .iact:hover{background:#eef0f4;color:#64748b}
.item .iact.del:hover{color:#ef4444}
.item .iact.cancel.on{color:#e14b4b;background:#fbdddd}
.item.cancelled .title,.item.cancelled .tag,.item.cancelled .partner{text-decoration:line-through;opacity:.6}
.reg-add{cursor:pointer;margin-left:5px;font-weight:800;opacity:.4;color:#fff;transition:.15s}
.reg-add:hover{opacity:1}
.cal-head>div{position:relative}
.item .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;display:inline-block;outline:none}
.item .title{font-weight:600;color:var(--ink);font-size:12.5px;line-height:1.45}
.item .partner{color:var(--muted);font-size:10.5px;margin-top:3px;line-height:1.4}
.item .partner u{color:var(--brand2);text-decoration:none;font-weight:600}
.item .req-row{margin-top:5px}
.req-box{display:inline-flex;align-items:center;gap:3px;margin-top:5px;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:9.5px;color:#c0c7d2;transition:.15s}
.req-box:hover{color:#959ba5}
.req-box .mk{width:12px;height:12px;border:1.2px solid #d0d5de;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;line-height:1;color:transparent;transition:.12s}
.req-box.on{color:#6aab54}
.req-box.on .mk{background:#58a83c;border-color:#58a83c;color:#fff}
/* 延期 / Delay：整卡高亮标记（点右上角「延」按钮触发） */
.sa-post.delayed,.item.delayed{border:1.5px solid #e53e3e !important;background:rgba(229,62,62,.08) !important}
.delay-badge{display:inline-block;flex:none;background:#e2e8f0;color:#4a5568;font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 6px;border-radius:4px;line-height:1.4}
/* 卡片右上角「延」按钮，置于「划」旁 */
.sa-post .act.delay{color:#9f7aea}
.sa-post .act.delay:hover{color:#e53e3e;background:#fff5f5}
.sa-post .act.delay.on{color:#fff;background:#e53e3e}
.item .iact.delay{color:#9f7aea}
.item .iact.delay:hover{color:#e53e3e;background:#fff5f5}
.item .iact.delay.on{color:#fff;background:#e53e3e}
/* 类型色 */
.t-copost{border-left:3px solid #2f80ed}.t-copost .tag{background:#dbeafe;color:#1d4ed8}
.t-meme{border-left:3px solid #f2994a}.t-meme .tag{background:#fdebd7;color:#b45309}
.t-kol{border-left:3px solid #e05299}.t-kol .tag{background:#fbdcee;color:#b0307a}
.t-koc{border-left:3px solid #12a594}.t-koc .tag{background:#d2f0eb;color:#0b7a6e}
.t-poster{border-left:3px solid #58a83c}.t-poster .tag{background:#e0f0d8;color:#3a7a24}
.t-gameplay{border-left:3px solid #8b5a2b}.t-gameplay .tag{background:#f3e9dc;color:#5c3a1e}
.t-drama{border-left:3px solid #eab308}.t-drama .tag{background:#fef9c3;color:#a16207}
/* 统计条 */
.regional-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rstat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 17px;min-width:122px;box-shadow:var(--shadow-sm);transition:.2s}
.rstat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.rstat .rk{font-size:11px;color:var(--muted)}.rstat .rv{font-size:18px;font-weight:800;margin-top:2px}
/* 周导航 */
.week-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.week-nav button{padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow-sm)}
.week-nav button:hover{border-color:var(--brand);color:var(--brand);box-shadow:var(--shadow-md)}
.week-nav .wlbl{font-size:15px;font-weight:800;color:var(--ink)}

/* ===== 区域素材周历 · 响应式（随窗口尺寸自适应排版）===== */
/* 周历容器常开横向滚动：小窗口保持固定列宽，允许左右滑动查看 */
.regional-week{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:#cbd5e0 transparent}
.regional-week::-webkit-scrollbar{height:11px}
.regional-week::-webkit-scrollbar-track{background:#f1f5f9;border-radius:6px}
.regional-week::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:6px;border:2px solid #f1f5f9}
.regional-week::-webkit-scrollbar-thumb:hover{background:#94a3b8}
/* 横滑箭头：鼠标点击左右滑动（小窗口查看当周被裁切的日期） */
.cal-arrows{position:absolute;right:16px;bottom:16px;z-index:9;display:flex;gap:6px}
.cal-arrow{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-md);font-size:20px;line-height:1;color:#475569;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.cal-arrow:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.cal-arrow:active{transform:scale(.94)}
.cal-head,.cal-body{grid-template-columns:140px repeat(7,minmax(122px,1fr));min-width:1024px}
@media (max-width:1080px){
  .regional{padding:18px 16px 36px}
  .type-label{padding:10px 10px}
  .cell{padding:7px 7px;min-height:52px}
  .item{padding:8px 9px;font-size:11.5px}
  .item .title{font-size:11.5px}
  .rstat{min-width:104px;padding:9px 13px}
  .rstat .rv{font-size:16px}
}
@media (max-width:760px){
  .regional{padding:14px 10px 28px}
  .regional h2{font-size:19px}
  .regional .sub{font-size:12px}
  /* 手机：标签列略缩，列最小宽保留，整体仍横向滚动 */
  .cal-head,.cal-body{grid-template-columns:104px repeat(7,minmax(110px,1fr));min-width:920px}
  .cal-head>div,.type-label,.cell{padding-left:8px;padding-right:8px}
  .cell{min-height:46px}
  .item{font-size:11px;padding:7px 8px}
  .item .title{font-size:11px}
  .it-head{gap:4px}
  .item .iact{padding:1px 2px}
  .week-nav{flex-wrap:wrap;gap:8px}
  .week-nav button{padding:6px 11px;font-size:12px}
