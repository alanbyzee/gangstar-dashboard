}

/* ===== 南亚社群排期（HQ + 区域 合并）===== */
.southasia{padding:32px 48px 52px;max-width:var(--page-max);margin:0 auto}
.issues{max-width:var(--page-max);margin:0 auto;padding:32px 48px 52px}
.southasia h2{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:.2px}
.southasia .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
/* 筛选开关 */
.sa-filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;align-items:center}
.sa-filters .f-label{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.chip{padding:7px 15px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#6b7280;transition:.15s;user-select:none;box-shadow:var(--shadow-sm)}
.chip:hover{border-color:#c5cad0;color:#4b5563;box-shadow:var(--shadow-md)}
.chip.on{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.chip.all.on{background:#64748b}
/* 莫兰迪色系：低饱和灰调，柔和耐看 */
.chip[data-f="hq"]{border-color:#e3dff0}
.chip[data-f="hq"].on{background:#7c5cd6}
.chip[data-f="copost"]{border-color:#dbeafe}
.chip[data-f="copost"].on{background:#2f80ed}
.chip[data-f="kol"]{border-color:#fbdcee}
.chip[data-f="kol"].on{background:#e05299}
.chip[data-f="koc"]{border-color:#d2f0eb}
.chip[data-f="koc"].on{background:#12a594}
.chip[data-f="meme"]{border-color:#fdebd7}
.chip[data-f="meme"].on{background:#f2994a}
.chip[data-f="poster"]{border-color:#e0f0d8}
.chip[data-f="poster"].on{background:#58a83c}
.chip[data-f="gameplay"]{border-color:#f3e9dc}
.chip[data-f="gameplay"].on{background:#8b5a2b;color:#fff}
.chip[data-f="drama"]{border-color:#fef9c3}
.chip[data-f="drama"].on{background:#eab308;color:#fff}
.chip[data-f="delay"]{border-color:#fbd5d5}
.chip[data-f="delay"].on{background:#e53e3e;color:#fff}
/* 分区标题带 */
.sa-section{margin-bottom:30px}
.sa-banner{display:flex;align-items:center;gap:10px;padding:12px 19px;border-radius:13px 13px 0 0;font-size:15px;font-weight:800;color:#fff;box-shadow:var(--shadow-sm)}
.sa-banner.hq{background:linear-gradient(135deg,#8b6fe0,#7c5cd6)}
.sa-banner.region{background:linear-gradient(135deg,#f59e0b,#d97706)}
.sa-banner .cnt{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:9px}
.sa-restore{margin-left:8px;font-size:12px;font-weight:700;background:rgba(255,255,255,.28);padding:2px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.sa-restore:hover{background:rgba(255,255,255,.45)}
/* 团队产能 — 2列网格卡片 */
.cap-sup-row{display:flex;gap:16px;margin-bottom:16px;align-items:flex-start}
.cap-sup-row>.sa-cap{margin-bottom:0;flex:1 1 0;min-width:0}
.cap-sup-row>.supplier-cap{flex:0 1 auto;min-width:520px}
@media(max-width:1100px){.cap-sup-row{flex-direction:column}.cap-sup-row>.supplier-cap{min-width:auto;width:100%}}
.sa-cap{display:flex;flex-direction:column;gap:8px;padding:14px 18px;background:#faf9fc;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.sa-cap .ca-t{font-weight:800;color:var(--ink);font-size:15px;line-height:1;margin-bottom:2px}
/* 分组标签 */
.cap-grp{font-size:12px;font-weight:800;padding:3px 10px;border-radius:6px;display:inline-block;width:fit-content;margin-top:4px}
.cap-grp.old{color:#6b7280;background:#f3f4f6}
.cap-grp.cur{color:#4338ca;background:#ede9fe}
.cap-grp.month{color:#92400e;background:#fef3c7;width:100%;text-align:center;margin-top:6px}
/* 2列网格 */
.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cap-card{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e5e7eb;border-left:3px solid var(--c);border-radius:10px;padding:8px 12px;transition:box-shadow .15s}
.cap-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cap-card .cc-icon{font-size:20px;flex-shrink:0}
.cap-card .cc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cap-card .cc-name{font-size:12.5px;font-weight:700;color:#374151}
.cap-card .cc-val{font-size:17px;font-weight:900;color:var(--c);line-height:1.2}
.cap-card .cc-badge{font-size:9px;font-weight:800;color:#fff;background:var(--c);border-radius:5px;padding:2px 7px;flex-shrink:0;line-height:1.4}
.cap-card.old{opacity:.5;background:#fafafa}
.cap-card.old .cc-name,.cap-card.old .cc-val{color:#9ca3af!important;border-color:#d1d5db}
/* 月产能在底部 */
.cap-month{font-size:12.5px;font-weight:700;color:#92400e;background:linear-gradient(90deg,#fff7ed,#fffbf5);border:1px dashed #fbbf24;border-radius:8px;padding:7px 14px;text-align:center;margin-top:2px}
.cap-month b{color:#d97706}
/* 供应商人力安排块 — 2x2 网格 */
.sa-cap.supplier-cap{background:#f4f8fc;border-color:#d6e6f5;flex-direction:column;align-items:stretch;gap:12px}
.sa-cap.supplier-cap .ca-t{color:#1d4e89;line-height:normal}
.sup-org{display:flex;flex-direction:column;align-items:center}
.sup-root{background:linear-gradient(135deg,#1d4e89,#2563eb);color:#fff;padding:9px 28px;border-radius:12px;font-weight:800;font-size:15px;box-shadow:0 2px 7px rgba(37,99,235,.25)}
.sup-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:6px}
.sup-col{position:relative}
.sup-head{border-radius:10px 10px 0 0;padding:9px 10px;text-align:center;font-weight:800;color:#fff;font-size:13px;background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sup-list{list-style:none;margin:0;padding:0;border:1px solid #e0e6ef;border-top:none;border-radius:0 0 10px 10px;overflow:hidden;background:#fff}
.sup-list li{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:12.5px;color:#3a3a44;border-bottom:1px solid #f0f1f4}
.sup-list li:last-child{border-bottom:none}
.sup-list li span{font-weight:800;color:var(--c);white-space:nowrap}
.sup-list li span.isnew{background:var(--c);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px}
.sup-extra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px}
.sup-extra-t{font-size:12.5px;font-weight:800;color:#1d4e89}
.sup-chip{font-size:12px;font-weight:700;color:#1d4e89;background:#fff;border:1px solid #cfe0f5;border-radius:20px;padding:4px 13px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.sup-foot{margin-top:2px;font-size:12.5px;font-weight:700;color:#1d4e89;background:#e8f0fb;border:1px solid #cfe0f5;border-radius:10px;padding:8px 14px;text-align:center}
.sup-foot b{color:#2563eb}
/* HQ 周历网格 */
.sa-grid-wrap{position:relative}
.sa-grid{border:1px solid var(--line);border-radius:0 0 14px 14px;overflow-x:auto;overflow-y:hidden;background:#fff;box-shadow:var(--shadow-sm);scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
.sa-grid::-webkit-scrollbar{height:11px}
.sa-grid::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
.sa-grid::-webkit-scrollbar-track{background:transparent}
.sa-week{border-bottom:1px solid var(--line);min-width:min-content}
.sa-week:last-child{border-bottom:none}
.sa-wband{display:flex;align-items:center;gap:12px;padding:11px 17px;font-weight:700;font-size:13px;color:#fff;min-width:max-content}
.sa-wband .wk{font-size:11px;background:rgba(255,255,255,.22);padding:2px 9px;border-radius:9px;font-weight:700;white-space:nowrap}
.sa-wband .rng{font-size:12px;opacity:.92;white-space:nowrap}
.sa-wband .th{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa-wband .cur{font-size:11px;background:rgba(0,0,0,.22);padding:2px 9px;border-radius:9px;white-space:nowrap}
.sa-wband .toggle{margin-left:auto;cursor:pointer;border:none;background:rgba(255,255,255,.28);color:#fff;font-size:12px;font-weight:700;padding:5px 13px;border-radius:9px;white-space:nowrap}
.sa-wband .toggle:hover{background:rgba(255,255,255,.45)}
.sa-wbody.collapsed{display:none}
.sa-cells{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr))}
/* 南亚社群排期 · 横滑箭头（小窗口左右滑动周历） */
.sa-arrows{display:flex;gap:8px;z-index:5;justify-content:center;padding:10px 0 4px}
.sa-arrow{width:34px;height:34px;border-radius:50%;border:none;background:rgba(99,102,241,.92);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transition:.15s}
.sa-arrow:hover{background:#6366f1;transform:translateY(-1px)}
.sa-cell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:9px 9px;min-height:68px;background:#fcfcfd;font-size:12px;transition:background .12s}
.sa-cell:hover{background:#f7f8fc}
.sa-cell:first-child{border-left:none}
.sa-cell.empty{background:transparent}
.sa-cell.launch{background:linear-gradient(135deg,#fffbeb,#fef3c7)}
.sa-dhead{font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.sa-dcnt{margin-left:auto;font-size:10px;font-weight:800;color:#4f46e5;background:#eef2ff;border-radius:8px;padding:1px 7px;line-height:1.5;white-space:nowrap}
.sa-dcnt.zero{color:#94a3b8;background:#f1f5f9}
.sa-dhead .dow{font-size:10px;color:var(--muted);font-weight:600}
/* 当天高亮（莫兰迪暖陶土色） */
.sa-cell.is-today{background:linear-gradient(160deg,#fff8f1,#fcefe3);box-shadow:inset 0 0 0 2px #c0896a;position:relative}
.sa-cell.is-today .sa-dhead{margin-bottom:4px}
.sa-cell.is-today .sa-dhead>span:first-child{background:#c0896a;color:#fff;border-radius:5px;padding:1px 6px;font-size:12px;box-shadow:0 1px 4px rgba(192,137,106,.4)}
.sa-cell.is-today .sa-dhead .dow{color:#c0896a;font-weight:800}
.sa-cell.is-today .sa-add-btn:hover{background:#f3ddd0;color:#9c6b4f}
.sa-post{border:1px solid #eef0f4;border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:7px;box-shadow:0 1px 2px rgba(16,24,40,.03);transition:box-shadow .15s,.18s;position:relative;text-align:left}
.sa-post:hover{box-shadow:0 3px 10px rgba(16,24,40,.08);transform:translateY(-1px)}
.sp-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;text-align:left}
.sp-body{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left}
.sp-acts{margin-left:auto;display:flex;align-items:center;gap:1px;flex:none}
.sa-post .t{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#94a3b8;border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px}
.sa-post .b{font-size:12.5px;color:var(--ink);word-break:break-word;font-weight:600;line-height:1.45}
.sa-post .p{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.sa-empty-tip{font-size:11px;color:#cbd5e1;text-align:center;padding:14px 0}
.sa-mtime{font-size:10px;color:var(--muted);font-weight:700;margin-left:5px}

.sa-add-btn{display:block;text-align:center;font-size:14px;color:#d0d5de;cursor:pointer;padding:4px 0;border-radius:5px;transition:.15s;line-height:1}
.sa-add-btn:hover{background:#f1f5f9;color:#64748b}
/* 操作按钮：头部右侧内联，始终可见 */
.sa-post .sp-acts .act{cursor:pointer;font-size:11px;line-height:1.4;color:#c0c5d0;transition:.2s;padding:1px 4px;border-radius:4px}
.sa-post .sp-acts .act:hover{color:#64748b;background:#f1f5f9}
.sa-post .sp-acts .act.del:hover{color:#ef4444}
.sa-post .sp-acts .act.cancel.on{color:#e14b4b;background:#fbdddd}
.sa-post .sp-acts .act.edit:hover{color:#2f80ed;background:#dbeafe}
.sa-post .sp-acts .act.sa-drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:12px}
.sa-post .sp-acts .act.sa-drag:hover{background:#f59e0b;color:#fff}
.sa-post .sp-acts .act.sa-drag:active{cursor:grabbing}
.sa-post.cancelled{opacity:.5}
.suppost.cancelled .b,.sa-post.cancelled .b,.sa-post.cancelled .p,.sa-post.cancelled .t,.sa-post.cancelled .sa-mtime{text-decoration:line-through}
.sa-post .act.sa-drag{cursor:grab;color:#c0c5d0;touch-action:none;user-select:none;-webkit-user-select:none;font-size:12px}
.sa-post .act.sa-drag:hover{background:#f59e0b;color:#fff}
.sa-post .act.sa-drag:active{cursor:grabbing}
.sa-post.dragging{opacity:.3}
.sa-post.rb{box-shadow:inset 0 3px 0 -1px #f59e0b!important}
.sa-post.ra{box-shadow:inset 0 -3px 0 -1px #f59e0b!important}
.item.rb{box-shadow:inset 0 3px 0 -1px #f59e0b!important}
.item.ra{box-shadow:inset 0 -3px 0 -1px #f59e0b!important}
.sa-cell.drop-over{background:#fff7ed;outline:2px dashed #f59e0b;outline-offset:-2px}
/* 模态框 */
.sa-modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.4);backdrop-filter:blur(2px);z-index:9999;display:flex;align-items:center;justify-content:center;animation:sa-bg-in .15s ease}
.sa-modal{background:#fff;border-radius:16px;padding:25px 29px;width:380px;max-width:90vw;box-shadow:var(--shadow-lg);animation:sa-pop .14s}
.sa-modal h3{font-size:16px;font-weight:800;margin-bottom:16px;color:var(--ink)}
.sa-modal label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;margin-top:12px}
.sa-modal label:first-of-type{margin-top:0}
.sa-modal input,.sa-modal select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--ink);background:#fff;box-sizing:border-box;transition:.15s}
.sa-modal input:focus,.sa-modal select:focus{outline:none;border-color:#7c5cd6;box-shadow:0 0 0 3px rgba(124,92,214,.13)}
.sa-modal .sa-modal-btns{display:flex;gap:10px;margin-top:20px}
.sa-modal .sa-modal-btns button{flex:1;padding:10px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.sa-modal .btn-save{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.sa-modal .btn-save:hover{box-shadow:0 4px 12px rgba(109,40,217,.28)}
.sa-modal .btn-cancel{background:#f1f5f9;color:#64748b}
.sa-modal .btn-cancel:hover{background:#e2e8f0}
/* Hashtag 选择器 */
.ht-row{margin-top:12px}
.ht-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.ht-chip{display:inline-block;padding:3px 9px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;user-select:none;transition:.15s;background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;line-height:1.5}
.ht-chip:hover{background:#e8ecf1;border-color:#cbd5e1}
.ht-chip.ht-active{background:#7c5cd6;color:#fff;border-color:#7c5cd6}
#ht-custom{font-size:11px!important;padding:6px 9px!important}
.ht-sel{min-height:28px}
.ht-chip .ht-x{margin-left:5px;font-weight:800;opacity:.6;cursor:pointer}
.ht-chip .ht-x:hover{opacity:1}
/* 卡片上的 Hashtag 标签 */
.ht-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.ht-tag{display:inline-block;font-size:9.5px;font-weight:600;color:#7c5cd6;background:#f3effa;border-radius:8px;padding:1px 6px;line-height:1.6;white-space:nowrap}
.sa-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(16,24,40,.82);color:#fff;padding:9px 23px;border-radius:22px;font-size:13px;font-weight:600;z-index:10000;animation:sa-fade .15s;backdrop-filter:blur(4px)}
@keyframes sa-fade{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.sa-popover{position:fixed;z-index:9999;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:15px 17px;width:330px;max-width:90vw;font-size:13px;line-height:1.7;color:var(--ink);animation:sa-pop .12s}
@keyframes sa-pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes sa-bg-in{from{opacity:0}to{opacity:1}}
.sa-popover .pop-close{float:right;cursor:pointer;color:#cbd5e1;font-size:16px;line-height:1;margin-left:8px}
.sa-popover .pop-close:hover{color:#64748b}
.sa-popover .pop-meta{font-size:11px;color:var(--muted);margin-bottom:6px}
.sa-popover .pop-body{white-space:pre-wrap;word-break:break-word}

/* 区域素材：按类别列表 */
.cat-block{border:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;margin-bottom:14px;background:#fff;box-shadow:var(--shadow-sm)}
.cat-head{display:flex;align-items:center;gap:8px;padding:10px 17px;font-size:13px;font-weight:800;background:#fafbfc;border-bottom:1px solid var(--line)}
.cat-head .dot{width:10px;height:10px;border-radius:3px;flex:none}
.cat-head .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.cat-items{padding:9px 15px 13px}
.cat-item{border-left:3px solid #ddd;border-radius:9px;background:#f8f9fb;padding:9px 13px;margin-top:8px;display:flex;flex-direction:column;gap:2px;transition:box-shadow .15s}
.cat-item:hover{box-shadow:0 2px 8px rgba(16,24,40,.06)}
.cat-item:first-child{margin-top:4px}
.cat-item .ci-top{display:flex;align-items:center;gap:10px}
.cat-item .ci-date{font-size:11px;font-weight:700;color:var(--brand2);background:#eff6ff;border-radius:5px;padding:1px 7px;white-space:nowrap}
.cat-item .ci-title{font-size:13px;font-weight:700;color:var(--ink)}
.cat-item .ci-partner{font-size:11px;color:var(--muted)}
.cat-item .ci-partner u{color:var(--brand2);text-decoration:none;font-weight:600}

footer{text-align:center;font-size:12px;color:var(--muted);padding:15px;border-top:1px solid var(--line);background:rgba(255,255,255,.5)}

/* ============================================================
   Community Command Center — 通用组件（浅色 · 专业 dense 风格）
   ============================================================ */
.cc-section{margin-bottom:20px}
.cc-sec-head{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.cc-sec-head h3{font-size:16px;font-weight:800;letter-spacing:.2px}
.cc-sec-head .cc-emoji{font-size:18px}
.cc-sec-head .cc-sub{font-size:12px;color:var(--muted);margin-left:auto;font-weight:600}
.cc-sec-head .cc-link{font-size:12px;font-weight:700;color:var(--brand);cursor:pointer;text-decoration:none}
.cc-sec-head .cc-link:hover{text-decoration:underline}

/* 状态点 / 优先级徽章 */
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.sdot.green{background:var(--ok)} .sdot.amber{background:var(--warn)} .sdot.red{background:var(--err)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.green{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.pill.amber{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.pill.red{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.pill.gray{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.pill.blue{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.prio{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px;letter-spacing:.3px}
.prio.p1{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.prio.p2{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.prio.p3{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}

/* Community Health Score */
.health{display:grid;grid-template-columns:230px 1fr;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.health-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 4px;border-right:1px solid var(--line)}
.health-score{font-size:52px;font-weight:900;line-height:1;letter-spacing:-1px}
.health-score small{font-size:18px;color:var(--muted);font-weight:700}
.health-status{margin-top:8px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px}
.health-status.green{background:#ecfdf5;color:#047857}
.health-status.amber{background:#fffbeb;color:#b45309}
.health-status.red{background:#fef2f2;color:#b91c1c}
.health-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-top:10px;text-transform:uppercase}
.health-dims{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.hdim{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:4px}
.hdim .hd-name{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:4px}
.hdim .hd-val{font-size:19px;font-weight:900}
.hdim .hd-chg{font-size:11px;font-weight:700}
.hdim .hd-up{color:var(--ok)} .hdim .hd-down{color:var(--err)}
.hdim .hd-spark{height:22px;display:flex;align-items:flex-end;gap:2px;margin-top:2px}
.hdim .hd-spark i{flex:1;background:var(--brand);border-radius:2px 2px 0 0;opacity:.55;min-height:2px}

/* KPI 卡网格 */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi .kpi-name{font-size:11.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.kpi .kpi-val{font-size:23px;font-weight:900;margin-top:6px;letter-spacing:-.4px}
.kpi .kpi-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.kpi .kpi-wow{font-size:11.5px;font-weight:800}
.kpi .kpi-wow.up{color:var(--ok)} .kpi .kpi-wow.down{color:var(--err)} .kpi .kpi-wow.flat{color:var(--muted)}
.kpi .kpi-spark{height:26px;display:flex;align-items:flex-end;gap:2px;width:64px}
.kpi .kpi-spark i{flex:1;background:linear-gradient(180deg,var(--brand),var(--brand2));border-radius:2px 2px 0 0;opacity:.6;min-height:3px}

/* Insights / Action / Alerts 三联 */
.cc-three{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
.cc-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.cc-card h4{font-size:13.5px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.insight-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed #eef1f6;font-size:12.5px;line-height:1.5}
.insight-item:last-child{border-bottom:none}
.insight-item .ii-emoji{font-size:15px;flex:none;margin-top:1px}
.insight-item b{color:var(--brand);font-weight:800}
.insight-item .ii-num{color:var(--ok);font-weight:800}
.action-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed #eef1f6;font-size:12.5px}
.action-row:last-child{border-bottom:none}
.action-row .ar-count{font-weight:900;font-size:15px;min-width:30px;text-align:right}
.alert-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #eef1f6;font-size:12px;line-height:1.45}
.alert-item:last-child{border-bottom:none}
.alert-item .al-ico{font-size:14px;flex:none}

/* Topic Trend 表 */
.trend-table{width:100%;border-collapse:collapse;font-size:12.5px}
.trend-table th{text-align:left;padding:9px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
.trend-table th:hover{color:var(--brand)}
.trend-table td{padding:10px;border-bottom:1px solid #f0f2f7;vertical-align:middle}
.trend-table tr:hover td{background:#f8fafc}
.trend-bar{height:7px;background:#eef2f7;border-radius:5px;overflow:hidden;min-width:60px}
.trend-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.wow-up{color:var(--ok);font-weight:800} .wow-down{color:var(--err);font-weight:800} .wow-flat{color:var(--muted);font-weight:700}

/* Issue Tracker */
.issue-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.istat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow-sm)}
.istat .is-val{font-size:22px;font-weight:900}
.istat .is-name{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.istat.accent{background:linear-gradient(135deg,var(--brand-soft),#fff);border-color:#ddd0f5}
.issue-board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start}
.icol{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.icol h5{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.4px}
.icol h5 .c-count{background:#fff;border:1px solid var(--line);border-radius:20px;padding:0 8px;font-size:11px;color:var(--ink)}
.icard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.15s}
.icard:hover{border-color:var(--brand);box-shadow:0 3px 10px rgba(109,40,217,.12);transform:translateY(-1px)}
.icard .ic-topic{font-size:12.5px;font-weight:800;line-height:1.3}
.icard .ic-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px;font-size:11px;color:var(--muted)}
.icard .ic-vol{font-weight:800;color:var(--ink)}

/* Content Performance */
.content-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filter-sel{padding:7px 12px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:600;background:#fff;color:var(--ink);cursor:pointer;font-family:inherit}
.filter-sel:focus{outline:none;border-color:var(--brand)}
.perf-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow-sm);margin-bottom:14px}
/* 玩家心声：紧凑单面板布局 */
.pv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.pv-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pv-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--ink)}
.pv-title .sub{font-size:11px;font-weight:600;color:var(--muted)}
.pv-range{margin-left:auto;display:flex;gap:3px;background:#f1f5f9;padding:3px;border-radius:9px}
.pv-rng{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s ease}
.pv-rng:hover{color:var(--ink)}
.pv-rng.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.pv-rng:active{transform:scale(.96)}
.pv-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.pv-kpi{background:linear-gradient(180deg,#fbfcfe,#f6f8fb);border:1px solid var(--line);border-radius:11px;padding:9px 8px;text-align:center}
.pv-kpi .v{font-size:20px;font-weight:900;line-height:1.1;color:var(--ink)}
.pv-kpi .n{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.pv-kpi.green .v{color:var(--ok)} .pv-kpi.red .v{color:var(--err)} .pv-kpi.blue .v{color:var(--brand2)} .pv-kpi.gray .v{color:var(--muted)}
.pv-sec-t{font-size:12px;font-weight:800;color:var(--ink);margin:0 0 9px;display:flex;align-items:center;gap:7px}
.pv-sec-t .tag{font-size:10px;font-weight:700;color:var(--muted);background:#f1f5f9;padding:1px 7px;border-radius:6px}
.pv-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px;margin-bottom:16px}
.pv-cat{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px 11px;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
.pv-cat:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(16,24,40,.10)}
.pv-cat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#64748b)}
.pv-cat .nm{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.pv-cat .ct{font-size:18px;font-weight:900;color:var(--ink);line-height:1.2;margin-top:1px}
.pv-cat .ct span{font-size:10px;font-weight:700;color:var(--muted);margin-left:2px}
.pv-cat .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#f1f5f9}
.pv-cat .bar i{display:block;height:100%;background:var(--c,#64748b);border-radius:0 3px 0 0}
.pv-table{width:100%;border-collapse:collapse;font-size:12.5px}
.pv-table thead th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--line);white-space:nowrap}
.pv-table thead th.num{text-align:right}
.pv-table tbody td{padding:9px 10px;border-bottom:1px solid #f0f2f7;vertical-align:middle}
.pv-table tbody tr:last-child td{border-bottom:0}
.pv-table .tt{font-weight:700;color:var(--ink)}
.pv-table .num{text-align:right;font-weight:800}
@media(max-width:680px){ .pv-kpis{grid-template-columns:repeat(3,1fr)} .pv-cats{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))} }

.perf-insights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.perf-ins-col h5{font-size:12.5px;font-weight:800;margin-bottom:8px;color:var(--brand)}
.perf-rank{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px}
.perf-rank .rk{width:20px;height:20px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.perf-rank .rk.t1{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.conv-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:10px 0;font-size:11px;font-weight:700;color:#fff}
.conv-bar span{display:flex;align-items:center;justify-content:center;padding:0 4px;white-space:nowrap;overflow:hidden}

@media(max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .cc-three{grid-template-columns:1fr}
  .health{grid-template-columns:1fr} .health-main{border-right:none;border-bottom:1px solid var(--line);padding-bottom:14px}
  .health-dims{grid-template-columns:repeat(3,1fr)}
  .issue-stats{grid-template-columns:repeat(3,1fr)} .issue-board{grid-template-columns:repeat(3,1fr)}
  .perf-insights{grid-template-columns:1fr}
}
@media(max-width:680px){
  .kpi-grid{grid-template-columns:1fr}
  .health-dims{grid-template-columns:repeat(2,1fr)}
  .issue-stats{grid-template-columns:repeat(2,1fr)} .issue-board{grid-template-columns:1fr}
}

/* ===== 交互微动效 ===== */
/* 卡片/区块入场：淡入上移 */
.cc-section,.kpi,.istat,.icard,.perf-card,.cc-card,.health,.uni-row,.pc,.pv-cat{
  animation:fadeUp .42s cubic-bezier(.22,1,.36,1) backwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 入场级联（同容器内依次浮现） */
.kpi-grid .kpi:nth-child(1){animation-delay:.02s}.kpi-grid .kpi:nth-child(2){animation-delay:.06s}.kpi-grid .kpi:nth-child(3){animation-delay:.10s}.kpi-grid .kpi:nth-child(4){animation-delay:.14s}
.kpi-grid .kpi:nth-child(5){animation-delay:.18s}.kpi-grid .kpi:nth-child(6){animation-delay:.22s}.kpi-grid .kpi:nth-child(7){animation-delay:.26s}.kpi-grid .kpi:nth-child(8){animation-delay:.30s}
.issue-stats .istat:nth-child(1){animation-delay:.02s}.issue-stats .istat:nth-child(2){animation-delay:.06s}.issue-stats .istat:nth-child(3){animation-delay:.10s}
.issue-stats .istat:nth-child(4){animation-delay:.14s}.issue-stats .istat:nth-child(5){animation-delay:.18s}.issue-stats .istat:nth-child(6){animation-delay:.22s}

/* 悬浮抬升 */
.kpi,.cc-card,.health,.perf-card{transition:box-shadow .2s ease,transform .2s ease}
.kpi:hover,.cc-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,36,51,.10)}
.icard{transition:border-color .15s,box-shadow .15s,transform .15s}

/* Tab / 按钮按压反馈 */
.tab{transition:color .2s ease,background .2s ease,border-color .2s ease,transform .12s ease}
.tab:active{transform:scale(.96)}
.filter-sel{transition:all .18s ease}
.filter-sel:hover{border-color:var(--brand);color:var(--brand)}
.filter-sel:active{transform:scale(.97)}
.pv-rng{transition:all .18s ease}
.pv-rng:active{transform:scale(.96)}

/* 条形动效：宽度平滑过渡（载入即生长） */
.uni-fill,.trend-bar i,.pct-fill{transition:width .7s cubic-bezier(.22,1,.36,1)}

/* 模态淡入放大（与现有 sa-pop 叠加增强） */
.sa-modal-bg{animation:sa-fade .18s ease}
.sa-modal{animation:popIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}

/* 关注点闪烁：新内容提示 */
.sdot{transition:transform .2s ease}
.icard:hover .ic-topic{color:var(--brand)}

/* ============================================================
   FANS TAB — EXECUTIVE REDESIGN (dark / premium / clear hierarchy)
   Layout & visual hierarchy only. No data or logic changed.
   All rules scoped to .fan so other tabs are unaffected.
   ============================================================ */
#view-fan{background:#eef1f7}
.fan{
  --bg:#eef1f7; --card:#ffffff; --card2:#f4f6fa; --ink:#1a2230; --muted:#64748b;
  --line:#e6eaf1; --line2:#eef2f7; --brand:#8b5cf6; --brand2:#3b82f6; --brand-soft:#f3eefe;
  --ok:#16a34a; --err:#dc2626; --warn:#d97706; --radius:16px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06); --shadow-md:0 12px 34px rgba(15,23,42,.08);
  display:block; max-width:var(--page-max); margin:0 auto; padding:32px 48px 52px;
  color:var(--ink);
  background:transparent;
}
.fan *{box-sizing:border-box}

/* page header */
.fan .fan-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:42px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.fan .fan-head h2{font-size:22px;font-weight:800;letter-spacing:.3px}
.fan .fan-head .sub{font-size:13px;color:var(--muted);margin-top:3px}

/* section block + header */
.fan .fan-block{margin-bottom:60px}
.fan .fan-block:last-child{margin-bottom:0}
.fan .cc-sec-head{display:flex;align-items:center;gap:12px;margin:0 0 20px}
.fan .cc-sec-head .cc-num{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--brand);background:var(--brand-soft);border:1px solid #e9defb;padding:3px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.fan .cc-sec-head h3{font-size:20px;font-weight:800;letter-spacing:.3px;margin:0}
.fan .cc-sec-head .cc-emoji{font-size:18px;opacity:.9}
.fan .cc-sec-head .cc-sub{font-size:12.5px;color:var(--muted);margin-left:auto;font-weight:600}

/* ===== 01 HERO (Goal) ===== */
.fan .goal-card{background:linear-gradient(160deg,#ffffff,#f7f9fc);border:1px solid var(--line);border-radius:20px;padding:30px 34px;box-shadow:var(--shadow-md);margin-bottom:60px}
.fan .hero{display:flex;flex-direction:column;gap:22px}
.fan .hero-row{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap}
.fan .hero-cur .hero-k{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.4px;margin-bottom:6px;text-transform:uppercase}
.fan .hero-cur .hero-v{font-size:58px;font-weight:900;line-height:1;letter-spacing:-2px;color:var(--ink);font-variant-numeric:tabular-nums}
.fan .hero-cur .hero-delta{margin-top:8px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:8px}
.fan .hero-cur .hero-delta.up{color:var(--ok);background:rgba(22,163,74,.1)}
.fan .hero-cur .hero-delta.down{color:var(--err);background:rgba(220,38,38,.1)}
.fan .hero-prog{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:4px}
.fan .hero-prog-v{font-size:40px;font-weight:900;line-height:1;color:var(--brand2);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.fan .hero-prog-v span{font-size:20px;font-weight:800;margin-left:1px}
.fan .hero-prog-k{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px;letter-spacing:.3px}
.fan .hero-tgt{margin-left:auto;text-align:right;padding-bottom:4px}
.fan .hero-tgt-v{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fan .hero-tgt-k{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.fan .hero-bar{height:14px;background:#eef2f7;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fan .hero-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:10px}
.fan .hero-meta{display:flex;align-items:center;gap:22px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.fan .hero-meta b{color:var(--ink);font-weight:800}
.fan .hero-meta .up{color:var(--ok)}
.fan .hero-meta .t-up{color:var(--ok)}
.fan .hero-edit{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted)}
.fan .hero-edit input{width:84px;padding:5px 9px;border:1px solid var(--line2);border-radius:7px;background:#f4f6fa;color:var(--ink);font-size:12.5px;font-weight:700}
.fan .hero-edit button{border:none;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:5px 13px;border-radius:7px;font-weight:700;cursor:pointer;font-size:12px}

/* ===== 02 PLATFORM FAN BASE (metric grid) ===== */
.fan .plat-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-bottom:0;align-items:stretch}
.fan .plat-hero{grid-column:1/-1;display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:linear-gradient(120deg,#ffffff 0%,#f6f8ff 100%);border:1px solid var(--line);border-radius:16px;padding:20px 24px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.fan .plat-hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--brand),#7c3aed)}
.fan .ph-left{min-width:160px}
.fan .ph-title{font-size:16px;font-weight:800;color:var(--ink)}
.fan .ph-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.fan .ph-stats{display:flex;gap:28px;flex:1;flex-wrap:wrap}
.fan .ph-stat{display:flex;flex-direction:column;gap:3px}
.fan .ph-k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.fan .ph-v{font-size:26px;font-weight:900;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.fan .ph-v.up{color:var(--ok)}
.fan .ph-engine{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-sm)}
.fan .ph-engine-tag{font-size:11px;font-weight:800;color:#7c3aed;background:rgba(124,58,237,.1);padding:3px 9px;border-radius:999px;white-space:nowrap}
.fan .ph-engine-name{font-size:13px;font-weight:800}
.fan .ph-engine-pct{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.fan .pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);position:relative;transition:border-color .15s,transform .15s,box-shadow .15s;display:flex;flex-direction:column;height:100%;box-sizing:border-box}
.fan .pc:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.1)}
.fan .pc.featured{grid-column:span 6;padding:20px 22px;position:relative;overflow:hidden}
.fan .pc.featured::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:12px 12px 0 0}
.fan .pc.featured{box-shadow:0 4px 16px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.05)}
.fan .plat-std{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:stretch}
.fan .plat-std .pc{grid-column:auto}
.fan .pc-bar{display:none}
.fan .pc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fan .pc-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.fan .pc.featured .pc-ic{width:34px;height:34px;border-radius:10px}
.fan .pc-titles{min-width:0;flex:1}
.fan .pc-name{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fan .pc.featured .pc-name{font-size:15px}
.fan .pc-handle{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fan .pc-chip{margin-left:auto;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fan .pc-chip.up{color:#0a7f4f;background:rgba(16,185,129,.12)}
.fan .pc-chip.down{color:#b42318;background:rgba(244,63,94,.12)}
.fan .pc-link{font-size:14px;color:var(--muted);text-decoration:none;flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.fan .pc-link:hover{background:var(--brand-soft);color:var(--brand)}
.fan .pc-val{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.fan .pc.featured .pc-val{font-size:38px}
.fan .pc-val small{display:none}
.fan .pc-share{margin:11px 0 0}
.fan .pc-share-bar{height:6px;background:#eef2f7;border-radius:6px;overflow:hidden}
.fan .pc-share-bar i{display:block;height:100%;border-radius:6px;opacity:.9}
.fan .pc-share-pct{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:5px;display:block}
.fan .pc-chart{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);flex:1;display:flex;flex-direction:column;justify-content:center;min-height:96px}
.fan .pc-chart .chart-area{margin-top:0;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:8px 8px 4px}
.fan .pc-chart .chart-area svg{width:100%;height:auto;display:block}
.fan .pc.featured .pc-chart .chart-area{padding:10px 10px 5px}
.fan .pc-src{font-size:10px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:5px;cursor:help}
.fan .pc-src-i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:9px;font-weight:800;color:var(--muted)}

/* ===== 03 FOLLOWER GROWTH (single large chart) ===== */
.fan .charts-section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow-sm);margin-bottom:0}
.fan .charts-head{display:none}
.fan .charts-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fan .mc{display:none}
.fan .mc-legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.fan .mc-leg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.fan .mc-leg i{width:12px;height:12px;border-radius:3px;flex:none}
.fan .mc-leg b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.fan .mc-leg em{font-style:normal;font-weight:800}
.fan .mc-leg em.up{color:var(--ok)} .fan .mc-leg em.down{color:var(--err)}
.fan .mc-svg{width:100%;height:auto;display:block}
.fan .mc-cap{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.5}
.fan .mc-empty{font-size:13px;color:var(--muted);padding:20px;text-align:center}

/* ===== 04 HEALTH + KPI — POLISHED LAYOUT ===== */
.fan .health-kpi-merged{display:block}
.fan .health-kpi-merged #healthSection{margin:0}
.fan .health-kpi-merged #kpiSection{margin:0}

/* Main container: left health col + right KPI grid */
.fan .hk-layout{display:grid;grid-template-columns:296px 1fr;gap:16px;align-items:stretch}

/* ---- LEFT: Health Score Card (fixed width) ---- */
.fan .hk-health-col{min-width:0;display:flex;flex-direction:column;gap:0}
.fan .health{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow-sm);height:100%;box-sizing:border-box;gap:0;grid-template-columns:none}
/* 顶部：分数(左) + 状态/结论(右) 横向排布，压缩纵向高度 */
.fan .health-main{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;gap:14px;padding:0 0 12px 0;border:none;border-bottom:1px solid var(--line2)}
.fan .health-left{display:flex;flex-direction:column;align-items:flex-start;flex-shrink:0}
.fan .health-right{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.fan .health-score{font-size:38px;font-weight:900;line-height:1.05;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.fan .health-score small{font-size:14px;color:var(--muted);font-weight:700}
.fan .health-status{font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;margin-top:0}
.fan .health-status.green{background:rgba(22,163,74,.12);color:#15803d}
.fan .health-status.amber{background:rgba(217,119,6,.12);color:#b45309}
.fan .health-status.red{background:rgba(220,38,38,.12);color:#b91c1c}
.fan .health-label{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase;margin-top:3px}
.fan .health-verdict{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:0;line-height:1.4;padding:0;text-align:left}

/* Dimension pills inside health card — 两列紧凑网格 */
.fan .health-dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding-top:12px;align-content:start;flex:1}
.fan .hdim{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;padding:6px 9px;background:var(--card2);border:none;border-radius:8px}
.fan .hdim .hd-name{font-size:10.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:flex-start;gap:4px;white-space:nowrap;flex:none}
.fan .hdim .hd-val{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;margin-left:auto}
.fan .hdim .hd-chg{font-size:9.5px;font-weight:700;white-space:nowrap}
.fan .hdim .hd-up{color:var(--ok)} .fan .hdim .hd-down{color:var(--err)}
.fan .hdim .hd-spark{display:none}

/* ---- RIGHT: KPI Cards Grid (auto-fit) ---- */
.fan .hk-kpi-col{min-width:0;display:flex;flex-direction:column}
.fan .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:stretch;flex:1;min-height:0}
.fan .kpi-wrap{margin:0}

/* KPI card — strict 3-layer hierarchy */
.fan .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;height:100%;box-sizing:border-box}
/* body fills remaining space so footer is always pinned to the bottom */
.fan .kpi .kpi-body{flex:1;display:flex;flex-direction:column;min-height:0}
/* Layer 1: Name (top) */
.fan .kpi .kpi-name{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
/* Layer 2: Value (center, prominent) */
.fan .kpi .kpi-val{font-size:30px;font-weight:900;margin-top:8px;letter-spacing:-.8px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
/* Layer 3: Foot (bottom, pushed down) */
.fan .kpi .kpi-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px;border-top:1px solid var(--line2)}
.fan .kpi .kpi-wow{font-size:12px;font-weight:800}
.fan .kpi .kpi-wow.up{color:var(--ok)} .fan .kpi .kpi-wow.down{color:var(--err)} .fan .kpi .kpi-wow.flat{color:var(--muted)}
.fan .kpi .kpi-spark{height:24px;display:flex;align-items:end;gap:2px;width:56px}
.fan .kpi .kpi-spark i{flex:1;background:linear-gradient(180deg,var(--brand),var(--brand2));border-radius:2px 2px 0 0;opacity:.55;min-height:3px}
/* Methodology subtitle (between value & foot) */
.fan .kpi .kpi-method{font-size:9.5px;color:var(--muted);font-weight:600;margin-top:6px;line-height:1.35;opacity:.75}
/* Interpretation note (above foot border) */
.fan .kpi .kpi-note{font-size:10.5px;font-weight:800;color:var(--brand);margin-top:6px;line-height:1.4;padding-top:8px;border-top:1px dashed var(--line2)}

/* ---- Executive Summary Banner ---- */
.fan .hk-summary{display:flex;align-items:center;flex-wrap:wrap;gap:12px;background:linear-gradient(90deg,var(--brand-soft),var(--card2));border:1px solid var(--line);border-radius:12px;padding:13px 18px;margin-bottom:16px;box-shadow:var(--shadow-sm);width:100%;box-sizing:border-box}
.fan .hk-badge{display:inline-flex;align-items:center;white-space:nowrap;font-size:12px;font-weight:900;padding:6px 14px;border-radius:20px}
.fan .hk-badge.green{background:rgba(22,163,74,.14);color:#15803d}
.fan .hk-badge.amber{background:rgba(217,119,6,.16);color:#b45309}
.fan .hk-badge.red{background:rgba(220,38,38,.14);color:#b91c1c}
.fan .hk-sum-txt{font-size:12.5px;color:var(--ink);line-height:1.55;font-weight:600;flex:1;min-width:280px}
.fan .hk-sum-txt b{color:var(--brand);font-weight:900}

/* ===== responsive ===== */
@media(max-width:1200px){
  .fan .hk-layout{grid-template-columns:264px 1fr}

}

  .fan .kpi-grid{grid-template-columns:repeat(5,1fr)}
}

  .fan .charts-grid{grid-template-columns:repeat(2,1fr)}

  .fan .ph-v{font-size:22px}

  .fan .hero-prog,.fan .hero-tgt{text-align:left}
  .fan .hero-meta{gap:14px}
  .fan .hero-edit{margin-left:0}
  .fan .charts-grid{grid-template-columns:1fr}
  .fan .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .fan .health-dims{grid-template-columns:repeat(2,1fr)}
}
/* ===== 04 本周洞察：左右双卡片（等高） ===== */
.fan .ins-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:stretch}
.fan .ins-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;height:100%;box-sizing:border-box;min-width:0}
.fan .ins-sec-title{font-size:14px;font-weight:900;color:var(--ink);margin:2px 0 14px;display:flex;align-items:center;gap:7px;letter-spacing:.2px}
/* 数据总结 · Accent Header */
.fan .ins-accent{background:linear-gradient(90deg,var(--brand-soft),#fbfaff);border:1px solid #e3d9f7;border-radius:13px;padding:16px 18px;margin-bottom:18px}
.fan .ins-accent-label{display:block;font-size:11.5px;font-weight:900;color:var(--brand);letter-spacing:.6px;margin-bottom:8px;text-transform:uppercase}
.fan .ins-conclusion{font-size:17px;font-weight:900;color:var(--ink);line-height:1.35;margin-bottom:8px;letter-spacing:-.2px}
.fan .ins-conclusion b{color:var(--brand)}
.fan .ins-conclusion .hl-num{color:var(--brand);font-variant-numeric:tabular-nums}
.fan .ins-accent-txt{font-size:13px;line-height:1.7;color:#475569;font-weight:600}
.fan .ins-accent-txt b{color:var(--brand);font-weight:900}
/* 核心话题焦点卡 */
.fan .ins-focus{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1px solid #e3d5ff;border-radius:13px;padding:15px 17px;margin-bottom:16px;display:flex;flex-direction:column;gap:11px}
.fan .ins-focus-tag{align-self:flex-start;font-size:11px;font-weight:900;color:#7c3aed;background:rgba(124,58,237,.13);padding:4px 11px;border-radius:20px;letter-spacing:.3px}
.fan .ins-focus-main{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.fan .ins-focus-name{font-size:16px;font-weight:900;color:var(--ink)}
.fan .ins-focus-num{font-size:28px;font-weight:900;color:#7c3aed;font-variant-numeric:tabular-nums;white-space:nowrap}
.fan .ins-focus-num i{font-size:13px;font-style:normal;font-weight:800;color:#a78bfa;margin-left:2px}
.fan .ins-focus-pct{align-self:flex-start;font-size:12px;font-weight:800;color:#7c3aed;background:rgba(124,58,237,.12);padding:3px 11px;border-radius:20px}
/* 指标小卡 grid */
.fan .ins-metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fan .ins-metric{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:13px 10px;text-align:center}
.fan .ins-metric .im-val{font-size:23px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.fan .ins-metric.im-pos .im-val{color:var(--ok)}
.fan .ins-metric .im-lab{font-size:11px;color:var(--muted);font-weight:700;margin-top:5px}
/* 行动中心 */
.fan .ins-actions{display:flex;flex-direction:column;gap:9px}
.fan .ins-action{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:11px}
.fan .ins-action .ia-txt{flex:1;min-width:0;font-size:13px;color:var(--ink);font-weight:700;line-height:1.4}
.fan .ins-action .ia-num{font-size:25px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;min-width:36px;text-align:right;flex:none}
/* 预警区 */
.fan .ins-alert-zone{margin-top:auto;padding-top:18px}
.fan .ins-alert-title{margin-top:0}
.fan .ins-alerts{display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,#fff7ed,#fef2f2);border:1px solid #fed7aa;border-radius:13px;padding:14px 15px}
.fan .ins-alert{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.5;color:#7c2d12}
.fan .ins-alert .al-ico{flex:none;font-size:15px;margin-top:1px}
.fan .ins-alert .ia-txt{font-weight:600}
.fan .ins-alert .ia-txt b{color:#b91c1c}
.fan .ins-alert-danger{background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:11px 13px;color:#b91c1c}
.fan .ins-alert-danger .ia-txt{font-weight:800;color:#b91c1c;font-size:12.5px}
.fan .ins-alert-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;border-radius:10px;padding:11px 13px;font-weight:700}
@media(max-width:860px){
  .fan .ins-grid{grid-template-columns:1fr}
  .fan .ins-card{height:auto}
}
@media(max-width:560px){
  .fan .ins-card{padding:16px 15px}
  .fan .ins-conclusion{font-size:15px}
}
/* ===== 行动中心 · 可折叠明细 ===== */
.fan .ins-hint{font-size:10.5px;font-weight:700;color:var(--muted);margin-left:auto;letter-spacing:0}
.fan .ins-action-wrap{display:flex;flex-direction:column}
.fan .ins-action{cursor:pointer;user-select:none;transition:.15s}
.fan .ins-action:hover{background:#eef2ff;border-color:#c7d2fe}
.fan .ins-action.open{background:#eef2ff;border-color:#c7d2fe;border-bottom-left-radius:0;border-bottom-right-radius:0}
.fan .ins-action .ia-chev{flex:none;font-size:11px;color:var(--muted);margin-left:4px;transition:transform .2s}
.fan .ins-action.open .ia-chev{transform:rotate(180deg);color:var(--brand)}
.fan .ins-action-items{display:none;flex-direction:column;gap:8px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-top:none;border-radius:0 0 11px 11px}
.fan .ins-action-items.open{display:flex}
.fan .ins-ai{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.fan .ins-ai-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fan .ins-ai-id{font-size:10px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.fan .ins-ai-title{font-size:12.5px;font-weight:800;color:var(--ink);flex:1;min-width:0}
.fan .ins-ai-vol{font-size:10.5px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:20px;padding:2px 9px;white-space:nowrap}
.fan .ins-ai-cat{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 9px;border:1px solid}
.fan .ins-ai-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.fan .ins-ai-pill{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.fan .ins-ai-pill.pri-p1{background:rgba(220,38,38,.1);color:#b91c1c;border-color:#fecaca}
.fan .ins-ai-pill.pri-p2{background:rgba(217,119,6,.12);color:#b45309;border-color:#fed7aa}
.fan .ins-ai-pill.pri-p3{background:rgba(100,116,139,.12);color:#475569;border-color:#e2e8f0}
.fan .ins-ai-date{font-size:10.5px;color:var(--muted);font-weight:700;margin-left:auto;white-space:nowrap}
.fan .ins-ai-note{font-size:11px;color:#0369a1;background:#f0f9ff;border:1px solid #bae6fd;border-radius:7px;padding:6px 9px;margin-top:8px;line-height:1.45;font-weight:600}
.fan .ins-ai-hint{font-size:11px;color:var(--muted);text-align:center;padding:10px}

/* ===== 玩家反馈看板 · 微交互 & 状态感知升级 (2026-09-16) ===== */
/* 1. 全局白色卡片悬浮浮起：translateY(-3px) + 柔和投影 0 10px 20px rgba(0,0,0,.06) */
.fan .pc,.fan .plat-hero,.fan .goal-card,.fan .charts-section,.fan .kpi-card,.fan .ins-card,.fan [class*="-card"],
.issues [class*="-card"],.regional [class*="-card"],.southasia [class*="-card"],
.fb3-health,.fb3-wk,.fb-ref-card,.fb4-wk,.fb4-iss,.fb3-row,.fb-q,.fb-card,.fb-col,.fb4-grp{

// ===== 工具函数 =====
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return Number(n).toLocaleString('en-US');}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const GOAL_MONTH_DATE='2026-09-20'; // 上线后一个月（launch 2026-08-20 + 1月）
function daysTo(targetStr){
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.max(0, Math.round((new Date(targetStr)-today)/86400000));
}
function daysToLaunch(){ return daysTo('2026-08-20'); }
function todayStr(){
  const t=new Date();
  const y=t.getFullYear();
  const m=String(t.getMonth()+1).padStart(2,'0');
  const d=String(t.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

// ===== 历史按天归一化：同天多条取最高值，按日期升序 =====
function dedupeHistory(hist){
  if(!hist||!hist.length) return [];
  const map={};
  hist.forEach(h=>{
    const v=Number(h.value)||0;
    if(map[h.date]===undefined || v>map[h.date]) map[h.date]=v;
  });
  return Object.keys(map).sort().map(date=>({date,value:map[date]}));
}
// 图表最多显示天数（按天数据）
const FAN_DISPLAY_DAYS=30;

// ===== 折线图绘制（内联 SVG） =====
function drawChart(hist,color,events,vw,vh){
  // 按天归一化 + 仅显示最近 FAN_DISPLAY_DAYS 天（完整历史仍存于 fan_data.json，不丢失）
  hist=dedupeHistory(hist).slice(-FAN_DISPLAY_DAYS);
  if(!hist||hist.length<2){
    return `<div class="chart-area" style="text-align:center;padding:20px;color:var(--muted);font-size:12px">
      数据点不足（需至少 2 次记录），继续更新后将自动画出增长曲线
    </div>`;
  }
  const W=vw||250,H=vh||76,padL=36,padR=14,padT=16,padB=16;
  const vals=hist.map(p=>p.value);
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const minV = lo<=0 ? 0 : lo*0.84;
  const maxV = hi<=0 ? 1 : hi*1.16;
  const span=(maxV-minV)||1;
  const n=vals.length;
  // 坐标映射
  function px(i,v){return{x:padL+(W-padL-padR)*Math.max(0,Math.min(1,(n<=1?0.5:i/(n-1)))),y:padT+(H-padT-padB)*(1-Math.max(0,Math.min(1,(v-minV)/span)))};}
  const pts=vals.map((v,i)=>px(i,v));
  // 路径
  let lineD='';pts.forEach((p,i)=>lineD+=(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)+' ');
  // 面积填充
  const areaD=lineD+`L${pts[pts.length-1].x.toFixed(1)},${(H-padB).toFixed(1)} L${pts[0].x.toFixed(1)},${(H-padB).toFixed(1)} Z`;
  // 数据点圆（关键事件点高亮为金色 + 事件名标注）
  const evtMap={};(events||[]).forEach(e=>evtMap[e.date]=e.label);
  const dotsCircs=pts.map((p,i)=>{
    const ev=evtMap[hist[i].date];
    if(ev){
      const ty=Math.max(padT+10,p.y-9);
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.6" fill="#f59e0b" stroke="#fff" stroke-width="1.6"/>`+
        `<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#b45309" font-weight="800">${esc(ev)}</text>`;
    }
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.8" fill="${color}" opacity=".75"/>`;
  }).join('');
  // 仅【最新一天】显示数值（写在数据点正上方，绘制顺序在折线之后→绝不被线挡住）；之前每天不标
  const lastIdx=n-1;
  const lastLabel=evtMap[hist[lastIdx].date]?'':(()=>{
    const p=pts[lastIdx];
    let ty=p.y-7; if(ty<padT+1) ty=padT+1;
    const anchor=(p.x<padL+10)?'start':(p.x>W-padR-10)?'end':'middle';
    return `<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" font-size="10" fill="${color}" font-weight="700">${fmt(vals[lastIdx])}</text>`;
  })();
  // X轴标签（每隔几个显示一个）
  const xLabels=[];
  const step=Math.ceil(n/(W>=400?10:6));
  hist.forEach((p,i)=>{if(i%step===0||i===n-1)xLabels.push(`<text x="${pts[i].x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="9" fill="#9ca3af">${p.date.slice(5)}</text>`);});
  // Y轴标签
  const yTicks=[minV,minV+(maxV-minV)*0.5,maxV];
  const yLabels=yTicks.map(v=>`<text x="${padL-4}" y="${padT+(H-padT-padB)*(1-(v-minV)/span).toFixed(1)}" text-anchor="end" font-size="9" fill="#9ca3af">${Math.round(v)}</text>`).join('');
  // 网格线
  const gridLines=[0,.5,1].map(f=>`<line x1="${padL}" y1="${padT+(H-padT-padB)*(1-f)}" x2="${W-padR}" y2="${padT+(H-padT-padB)*(1-f)}" stroke="#e5e7eb" stroke-dasharray="3,3"/>`).join('');
  // 悬停：十字指示 + 透明命中区（命中区必须最后绘制，保证在最上层）
  const slotW=(W-padL-padR)/Math.max(1,n-1);
  const hoverG=`<g class="ch-hover" style="display:none"><line class="ch-vline" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="${color}" stroke-width="1" stroke-dasharray="3,3" opacity=".55"/><circle class="ch-hdot" cx="-99" cy="-99" r="4.2" fill="#fff" stroke="${color}" stroke-width="2.4"/></g>`;
  const hits=pts.map((p,i)=>{
    const x0=Math.max(0,p.x-slotW/2), w0=Math.min(W-x0,slotW||W);
    const dd=(i>0)?(vals[i]-vals[i-1]):'';
    return `<rect class="ch-hit" x="${x0.toFixed(1)}" y="0" width="${Math.max(6,w0).toFixed(1)}" height="${H}" fill="transparent" data-d="${hist[i].date}" data-v="${vals[i]}" data-dd="${dd}" data-cx="${p.x.toFixed(1)}" data-cy="${p.y.toFixed(1)}" data-color="${color}"/>`;
  }).join('');

  return `<div class="chart-area">
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <!-- 网格 -->${gridLines}
      <!-- 面积 --><path d="${areaD}" fill="${color}" opacity=".08"/>
      <!-- 线条 --><path d="${lineD}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 点 -->${dotsCircs}${lastLabel}
      <!-- X轴 -->${xLabels.join('')}
      <!-- Y轴 -->${yLabels}
      <!-- 悬停 -->${hoverG}${hits}
    </svg>
  </div>`;
}

function drawSpark(hist,color,uid){
  hist=dedupeHistory(hist).slice(-FAN_DISPLAY_DAYS);
  if(!hist||hist.length<2){
    return '<div style="text-align:center;padding:14px;color:var(--muted);font-size:11px">数据点不足，继续更新后自动绘制</div>';
  }
  const W=260,H=60,padT=8,padB=8;
  const vals=hist.map(p=>p.value);
  const lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  const minV=lo<=0?0:lo*0.9,maxV=hi<=0?1:hi*1.08;
  const span=(maxV-minV)||1,n=vals.length;
  const px=(i,v)=>({x:10+(W-20)*(n<=1?0.5:i/(n-1)),y:padT+(H-padT-padB)*(1-(v-minV)/span)});
  const pts=vals.map(px);
  let line='';pts.forEach((p,i)=>line+=(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)+' ');
  const area=line+'L'+pts[n-1].x.toFixed(1)+','+(H-padB)+' L'+pts[0].x.toFixed(1)+','+(H-padB)+' Z';
  const gid='sg'+String(uid).replace(/[^a-zA-Z0-9]/g,'');
  const last=pts[n-1];
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0%" stop-color="'+color+'" stop-opacity="0.16"/>'
      +'<stop offset="100%" stop-color="'+color+'" stop-opacity="0.02"/>'
    +'</linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#'+gid+')"/>'
    +'<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+last.x.toFixed(1)+'" cy="'+last.y.toFixed(1)+'" r="3.2" fill="#fff" stroke="'+color+'" stroke-width="2.2"/>'
    +'</svg>';
}

// ===== 周增长计算（基于历史，找 ~7 天前锚点）=====
function weeklyGrowth(pl){
  const hist=dedupeHistory(pl.history||[]);
  if(hist.length<2) return null;
  const last=hist[hist.length-1];
  const lastDate=new Date(last.date+'T00:00:00');
  const target=new Date(lastDate); target.setDate(target.getDate()-7);
  let base=null;
  for(const h of hist){
    const d=new Date(h.date+'T00:00:00');
    if(d<=target) base=h.value; else break;
  }
  if(base===null) base=hist[0].value;
  const diff=last.value-base;
  const pct=base? (diff/base*100):0;
  return {diff, pct, daily:diff/7};
}

// ===== 较昨日增长（最后一条 vs 倒数第二条）=====
function dailyGrowth(pl){
  const hist=dedupeHistory(pl.history||[]);
  if(hist.length<2) return null;
  const last=hist[hist.length-1].value;
  const prev=hist[hist.length-2].value;
  const diff=last-prev;
  return {diff, pct:prev? (diff/prev*100):0};
}

// 迷你 sparkline（竖条）
function sparkline(arr,cls){
  if(!arr||!arr.length) return '';
  const mx=Math.max(...arr),mn=Math.min(...arr),rng=(mx-mn)||1;
  return '<div class="'+(cls||'kpi-spark')+'">'+arr.map(v=>{
    const h=Math.max(3,Math.round((v-mn)/rng*70+30));
    return '<i style="height:'+h+'%"></i>';
  }).join('')+'</div>';
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// 粉丝历史 → 总粉丝 spark 序列
function totalHistorySpark(data){
  const p=data.platforms;
  const keys=['instagram','facebook','youtube','x','discord','moj','sharechat'];
  const lens=keys.map(k=>(p[k]&&p[k].history)?p[k].history.length:0);
  const n=Math.max(...lens,0);
  if(!n) return [50,60,70,80,90,95,100];
  const out=[];
  for(let i=0;i<n;i++){
    let s=0;
    keys.forEach(k=>{const h=p[k]&&p[k].history; if(h&&h[i]) s+=h[i].value;});
    out.push(s);
  }
  return out;
}

// Health Score 综合计算（全部基于真实信号：涨粉幅度 + 玩家反馈）
function computeHealth(data){
  const p=data.platforms;
  const order=['instagram','facebook','youtube','x','discord','moj','sharechat'].sort((a,b)=>(p[b]?.value||0)-(p[a]?.value||0));
  const total=order.reduce((s,k)=>s+(p[k]?.value||0),0);
  const wg=order.reduce((s,k)=>s+(weeklyGrowth(p[k])?.diff||0),0);
  const growRate= total>0 ? wg/total*100 : 0;
  const growthScore=clamp(Math.round(55+growRate*3.5),0,100);

  // 真实情感分：基于最新周反馈的正面占比
  const fb=getFeedback(); const lw=fb.weeks&&fb.weeks[0];
  const arr=(lw&&lw.community)||[];
  let pos=0,neg=0,neu=0,totalFb=0;
  arr.forEach(t=>{ const c=t.count||0; totalFb+=c; if(t.type==='good')pos+=c; else if(t.type==='bad')neg+=c; else neu+=c; });
  const sentScore = totalFb>0 ? clamp(Math.round(pos/totalFb*100),0,100) : 72;

  // 真实活跃度分：基于反馈总量（越多=越活跃），归一化到 40-95
  const actScore = totalFb>0 ? clamp(Math.round(40 + Math.min(totalFb/50, 55)), 40, 95) : 50;

  // 真实互动分：基于涨粉平台覆盖度（几个平台在涨）+ 周增长率绝对值
  const growingPlatforms = order.filter(k => (weeklyGrowth(p[k])?.diff||0) > 0).length;
  const engScore = clamp(Math.round(45 + growingPlatforms*8 + Math.min(Math.abs(growRate)*2, 30)), 45, 95);

  // 真实响应分：负面占比越低越好（负面少=团队响应好）
  const negRatio = totalFb>0 ? neg/totalFb : 0.2;
  const respScore = clamp(Math.round(95 - negRatio*100), 50, 95);

  const overall=Math.round(growthScore*0.28+sentScore*0.30+engScore*0.18+actScore*0.12+respScore*0.12);
  let status='green',label='健康';
  if(overall<60){status='red';label='风险';} else if(overall<78){status='amber';label='关注';}
  return {overall,status,label,growthScore,sentScore,engScore,actScore,respScore,growRate:Math.round(growRate*10)/10,wg,total};
}

// 反馈情感拆分（真实：基于最新周 community 主题 type）
function feedbackSentiment(){
  const fb=getFeedback(); const lw=fb.weeks&&fb.weeks[0];
  const arr=(lw&&lw.community)||[];
  let pos=0,neu=0,neg=0;
  arr.forEach(t=>{ if(t.type==='good')pos+=t.count; else if(t.type==='bad')neg+=t.count; else neu+=t.count; });
  const tot=pos+neu+neg||1;
  return {pos:Math.round(pos/tot*100),neu:Math.round(neu/tot*100),neg:Math.round(neg/tot*100),total:arr.reduce((s,t)=>s+t.count,0)};
}

function pvParseDate(s){
  if(!s) return null;
  s=String(s).trim();
  var m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[月.](\d{1,2})[日]?/);
  if(m) return new Date(2026,+m[1]-1,+m[2]);
  return null;
}
function pvMonday(d){ var x=new Date(d); var day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }

function pvTopicOf(text){
  text=String(text||'').toLowerCase();
  var best=null,bs=0;
  PV_TOPICS.forEach(function(tp){ var sc=0; tp.kw.forEach(function(k){ if(text.indexOf(k.toLowerCase())>=0) sc++; }); if(sc>bs){bs=sc;best=tp;} });
  return best||{key:'other',label:'其他',cat:'General'};
}
// rangeDays: 7 / 30 / 'all' —— 按真实日期窗口过滤，全部指标由过滤后的真实条目计算
function derivePlayerVoice(rangeDays){
  rangeDays = rangeDays || 'all';
  var fb=getFeedback(); var weeks=fb.weeks||[];
  var items=[];
  weeks.forEach(function(w, wi){
    (w.community||[]).concat(w.official||[]).forEach(function(it){
      var d=pvParseDate(it.date);
      items.push({it:it,d:d,ws:d?pvMonday(d):null,wi:wi});
    });
  });
  // 反馈真实跨度仅约 9 天（8/23–8/31），按绝对日期切窗会让「近7天≈近30天≈全部」。
  // 改为按「周分群（cohort）」：近7天=最新一周，近30天=最近4周（当前3周即全部），使区间明显可区分。
  // 周数组为倒序存储（最新周在前），需按周起始日期定位「最新周」索引，不能取数组末位。
  var lastWi = 0, maxStart = null;
  weeks.forEach(function(w, wi){
    var lbl = (w.week||'').split(/\s*[-–]\s*/)[0].trim();
    var sd = pvParseDate(lbl);
    if(sd && (!maxStart || sd>maxStart)){ maxStart=sd; lastWi=wi; }
  });
  var filt;
  if(rangeDays==='all') filt=items;
  else if(rangeDays==='7') filt=items.filter(function(o){ return o.wi===lastWi; });
  else filt=items.filter(function(o){ return o.wi>=Math.max(0,lastWi-3); }); // 近30天 = 最近4周
  function cnt(o){ return Number(o.it.count)||0; }
  var total=0,pos=0,neu=0,neg=0,act=0;
  filt.forEach(function(o){ var c=cnt(o), t=o.it.type;
    total+=c;
    if(t==='good'){pos+=c;} else if(t==='bad'){neg+=c;act+=c;}
    else {neu+=c; if(t==='sug')act+=c;}
  });
  var catCnt={};
  filt.forEach(function(o){ var c=cnt(o); var tp=pvTopicOf((o.it.theme||'')+' '+(o.it.orig||'')); catCnt[tp.cat]=(catCnt[tp.cat]||0)+c; });
  var topics=PV_TOPICS.map(function(tp){
    var ms=filt.filter(function(o){return pvTopicOf((o.it.theme||'')+' '+(o.it.orig||'')).key===tp.key;});
    var n=ms.reduce(function(s,o){return s+cnt(o);},0);
    var g=ms.filter(function(o){return o.it.type==='good';}).reduce(function(s,o){return s+cnt(o);},0);
    var b=ms.filter(function(o){return o.it.type==='bad';}).reduce(function(s,o){return s+cnt(o);},0);
    var gb=g+b, sentiment=gb?Math.round(g/gb*100):null;
    var prio=(sentiment!=null&&sentiment<55)?'P1':(ms.some(function(o){return o.it.type==='sug';})?'P2':'P3');
    return {topic:tp.label,cat:tp.cat,mentions:n,sentiment:sentiment,priority:prio,items:ms};
  }).filter(function(t){return t.mentions>0;});
  // 按周聚类算 spark（用过滤后的真实周分布，按 Count 加权）
  var byWeek={};
  filt.forEach(function(o){ if(o.ws){ var k=o.ws.getTime(); (byWeek[k]=byWeek[k]||[]).push(o); } });
  var wkKeys=Object.keys(byWeek).map(Number).sort(function(a,b){return a-b;});
  topics.forEach(function(t){
    var wk=wkKeys.map(function(k){ return t.items.filter(function(o){return o.ws&&o.ws.getTime()===k;}).reduce(function(s,o){return s+cnt(o);},0); });
    t.spark=wk.slice(-7);
  });
  topics.sort(function(a,b){return b.mentions-a.mentions;});
  return {total:total,pos:pos,neu:neu,neg:neg,act:act,catCnt:catCnt,topics:topics};
}

      '非负占比':'正面% + 中性%（来自反馈情感分析）',

        +'<div class="ins-ai-top"><span class="ins-ai-title">'+esc(t.topic)+'</span>'

        +'<div class="ins-ai-meta"><span class="ins-ai-pill pri-'+t.priority.toLowerCase()+'">'+t.priority+'</span>'

        +'<span class="ins-ai-date">周增 '+(t.wow>0?'+':'')+t.wow+'%</span></div>'

      +'<h4 class="ins-sec-title">🎯 行动中心<span class="ins-hint">点击展开明细</span></h4>'
      +'<div class="ins-actions">'

          +'<div class="ins-action-items">'+itemsHtml+'</div>'
        +'</div>';
      }).join('')
      +'</div>'
      +'<div class="ins-alert-zone"><h4 class="ins-sec-title ins-alert-title">🚨 预警区</h4>'
      +(alerts.length?'<div class="ins-alerts">'

    iEl.innerHTML='<div class="ins-grid">'+leftHtml+rightHtml+'</div>';

    // 折叠交互：点击 / 回车 / 空格 展开对应明细
    iEl.querySelectorAll('.ins-action[data-acc]').forEach(function(el){
      var toggle=function(){
        var wrap=el.closest('.ins-action-wrap');
        var items=wrap?wrap.querySelector('.ins-action-items'):null;
        var open=el.classList.toggle('open');
        if(items) items.classList.toggle('open',open);
        el.setAttribute('aria-expanded',open?'true':'false');
      };
      el.addEventListener('click',toggle);
      el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();} });
    });
  }
}

function renderIssues(){
  const el=document.getElementById('issuesView');
  if(!el) return;
  const iss=CC_DATA.issues;
  const cnt=st=>iss.filter(i=>i.status===st).length;
  const resolved=cnt('Fixed')+cnt('Communicated');
  const rate=iss.length?Math.round(resolved/iss.length*100):0;

  const stats=[
    {v:iss.length,n:'问题总数',accent:true},
    {v:cnt('New'),n:'新建'},
    {v:cnt('Reported to Dev'),n:'已报开发'},
    {v:cnt('In Progress'),n:'处理中'},
    {v:cnt('Fixed')+cnt('Communicated'),n:'已解决'},
    {v:cnt('Communicated'),n:'已同步'}
  ];

  el.innerHTML=`
    <div class="fan-head" style="grid-column:1/-1">
      <div><h2>🐞 问题追踪</h2><div class="sub">玩家反馈 → 开发闭环 · 解决率 <b style="color:var(--ok)">${rate}%</b>（${resolved}/${iss.length} 已解决并同步）</div></div>
    </div>
    <div class="issue-stats" style="grid-column:1/-1">
      ${stats.map(s=>`<div class="istat ${s.accent?'accent':''}"><div class="is-val">${s.v}</div><div class="is-name">${s.n}</div></div>`).join('')}
    </div>
    <div class="content-toolbar" style="grid-column:1/-1">
      <input id="issSearch" class="filter-sel" style="flex:1;min-width:200px" placeholder="🔍 搜索 主题 / 负责人 / 来源…">
      <select id="issPrio" class="filter-sel"><option value="">全部优先级</option><option>P1</option><option>P2</option><option>P3</option></select>
      <span class="cc-sec-head" style="margin:0"><span class="cc-sub">点击卡片查看 / 修改处理记录</span></span>
    </div>
    <div class="issue-board" id="issBoard" style="grid-column:1/-1"></div>`;

  const board=el.querySelector('#issBoard');
  function draw(){
    const q=(el.querySelector('#issSearch').value||'').toLowerCase();
    const pq=el.querySelector('#issPrio').value;
    board.innerHTML=CC_ISSUE_STATES.map(st=>{
      const list=iss.filter(i=>i.status===st && (!q||(i.topic+i.owner+i.source).toLowerCase().includes(q)) && (!pq||i.priority===pq));
      return `<div class="icol"><h5>${stateLabel(st)}<span class="c-count">${list.length}</span></h5>${
        list.map(i=>`<div class="icard" data-id="${i.id}" onclick="openIssue('${i.id}')">
          <div class="ic-topic">${esc(i.topic)}</div>
          <div class="ic-meta"><span class="ic-vol">${i.volume} 条提及</span><span class="prio ${i.priority.toLowerCase()}">${i.priority}</span></div>
          <div class="ic-meta"><span>${esc(i.source)} · ${esc(i.owner)}</span></div>
        </div>`).join('')||'<div style="font-size:11px;color:var(--muted);padding:6px">—</div>'
      }</div>`;
    }).join('');
  }
  draw();
  el.querySelector('#issSearch').oninput=draw;
  el.querySelector('#issPrio').onchange=draw;
}

  const i=CC_DATA.issues.find(x=>x.id===id); if(!i) return;

  const bg=document.createElement('div'); bg.className='sa-modal-bg';

function saveIssue(id){
  const i=CC_DATA.issues.find(x=>x.id===id); if(!i) return;
  const bg=document.querySelector('.sa-modal-bg');
  i.status=bg.querySelector('#issStatus').value;
  i.devResp=bg.querySelector('#issDev').value;
  i.playerComm=bg.querySelector('#issComm').value;
  i.updated=new Date().toISOString().slice(0,10);
  if(bg)bg.remove(); renderIssues(); showToast('✅ 问题 '+id+' 已更新','ok');
}

// ===== 粉丝监控工具函数 =====
function wkTag(wg,label){
  if(!wg) return '';
  const L=label||'较昨日';
  const v=wg.diff;
  if(v>0) return '<span class="wk-up">'+L+' ▲+'+fmt(v)+'</span>';
  if(v<0) return '<span class="wk-down">'+L+' ▼'+fmt(v)+'</span>';
  return '<span class="wk-flat">'+L+' ±0</span>';
}
function dimSpark(score, realArr){
  if(realArr&&realArr.length>=2) return realArr.slice(-7);
  const base=Math.max(8,score-18), out=[];
  for(let i=0;i<7;i++){ out.push(Math.round(base+(score-base)*(i/6))); }
  return out;
}

// ===== 1. 粉丝目标进度 =====
function renderGoalProgress(data){
  const el=document.getElementById('goalProgress'); if(!el) return;
  const p=data.platforms;
  const order=['instagram','facebook','youtube','x','discord','moj','sharechat'].sort((a,b)=>(p[b]?.value||0)-(p[a]?.value||0));
  const total=order.reduce((s,k)=>s+(p[k]?.value||0),0);
  const totalWg=order.reduce((s,k)=>s+(weeklyGrowth(p[k])?.diff||0),0);
  const target=Number(lsGet('gangstar_fan_target')||500000);
  const prog=Math.min(100,total/target*100);
  const remain=Math.max(0,target-total);
  const dl=daysTo(GOAL_MONTH_DATE);
  const needDaily=dl>0?remain/dl:0;
  const over= total>target ? (total/target).toFixed(1) : null;
  el.innerHTML='<div class="hero">'
    +'<div class="hero-row">'
      +'<div class="hero-cur"><div class="hero-k">当前社区总粉丝</div><div class="hero-v">'+fmt(total)+'</div><div class="hero-delta '+(totalWg>=0?'up':'down')+'">'+(totalWg>=0?'▲':'▼')+' '+fmt(Math.abs(totalWg))+' 本周</div></div>'
      +'<div class="hero-prog"><div class="hero-prog-v">'+prog.toFixed(1)+'<span>%</span></div><div class="hero-prog-k">目标进度</div></div>'
      +'<div class="hero-tgt"><div class="hero-tgt-v">'+fmt(target)+'</div><div class="hero-tgt-k">首月目标</div></div>'
    +'</div>'
    +'<div class="hero-bar"><i style="width:'+prog+'%"></i></div>'
    +'<div class="hero-meta">'
      +(remain>0?'<span>距目标 <b>'+fmt(remain)+'</b></span><span>日均需增 <b class="up">+'+needDaily.toFixed(0)+'</b> / '+dl+' 天</span>':'<span class="t-up">✅ 已达成首月目标</span>')
      +(over?'<span class="t-up">🎉 超越首月目标 '+over+'×</span>':'')
      +'<span>目标日 <b>'+GOAL_MONTH_DATE+'</b></span>'
      +'<span class="hero-edit">目标值 <input id="targetInput" type="number" value="'+target+'" min="1"> <button id="targetSave">设为目标</button></span>'
    +'</div>'
  +'</div>';
  const saveBtn=document.getElementById('targetSave');
  if(saveBtn) saveBtn.onclick=()=>{
    const v=Number(document.getElementById('targetInput').value);
    if(v>0){pushUndo();lsSet('gangstar_fan_target',v);renderFans(lastData);}
  };
}

// ===== 2. 各平台粉丝监控（Hero 总览 + 主卡片 + 标准卡） =====
function renderPlatformCards(data){
  const el=document.getElementById('platforms'); if(!el) return;
  const p=data.platforms;
  const order=['instagram','facebook','youtube','x','discord','moj','sharechat'].sort((a,b)=>(p[b]?.value||0)-(p[a]?.value||0));
  const total=order.reduce((s,k)=>s+(p[k]?.value||0),0);
  // 周增长与增长引擎
  const wgs=order.map(k=>({k,pl:p[k],wg:weeklyGrowth(p[k])})).filter(o=>o.wg);
  const totalWg=wgs.reduce((s,o)=>s+o.wg.diff,0);
  const prevTotal=total-totalWg;
  const rate=prevTotal>0?(totalWg/prevTotal*100):0;
  const pos=wgs.filter(o=>o.wg.diff>0).sort((a,b)=>b.wg.diff-a.wg.diff);
  const posSum=pos.reduce((s,o)=>s+o.wg.diff,0);
  const topP=pos[0];
  const topShare=posSum>0?Math.round(topP.wg.diff/posSum*100):0;
  const initial=k=>(p[k]&&p[k].name||'').replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()||'??';
  // 主卡折线图坐标空间按实际卡宽自适应：保证各屏宽下轴标签视觉字号与标准卡一致
  let _platW=el.getBoundingClientRect().width||0;
  if(_platW<200) _platW=Math.min(1366,Math.max(320,window.innerWidth-96));
  const _colW=(_platW-16*11)/12;
  const _featW=Math.max(240,_colW*6+16*5);
  const _fvw=Math.max(250,Math.round(_featW-60));
  const _fvh=Math.round(_fvw*150/520);
  const card=(k,featured)=>{
    const pl=p[k]; if(!pl) return '';
    const v=pl.value||0;
    const share= total>0?Math.round(v/total*100):0;
    const wg=weeklyGrowth(pl);
    const chip=wg?(wg.diff>=0?'<span class="pc-chip up">▲ +'+fmt(wg.diff)+'</span>':'<span class="pc-chip down">▼ '+fmt(wg.diff)+'</span>'):'';
    const note=pl.note?'<div class="pc-src" title="'+esc(pl.note).replace(/"/g,'&quot;')+'">📌 数据来源 <span class="pc-src-i">ⓘ</span></div>':'';
    return '<div class="pc'+(featured?' featured':'')+'">'
      +'<div class="pc-head"><div class="pc-ic" style="background:'+pl.color+'">'+(PLATFORM_ICONS[k]||initial(k))+'</div><div class="pc-titles"><div class="pc-name">'+esc(pl.name)+'</div><div class="pc-handle">'+esc(pl.handle||'')+'</div></div>'+chip+'<a class="pc-link" href="'+esc(pl.url)+'" target="_blank" rel="noopener" title="打开 '+esc(pl.name)+'">↗</a></div>'
      +'<div class="pc-val">'+fmt(v)+'</div>'
      +'<div class="pc-share"><div class="pc-share-bar"><i style="width:'+share+'%;background:'+pl.color+'"></i></div><span class="pc-share-pct">占总粉丝 '+share+'%</span></div>'
      +'<div class="pc-chart">'+drawChart(pl.history,pl.color,[],featured?_fvw:250,featured?_fvh:76)+'</div>'
      +note
      +'</div>';
  };
  const featuredKeys=['instagram','youtube'];
  const stdKeys=order.filter(k=>!featuredKeys.includes(k));
  const hero='<div class="plat-hero">'
    +'<div class="ph-left"><div class="ph-title">🛰️ 全平台总览</div><div class="ph-sub">截至 '+esc(data.updated_at)+' · 7 平台合计</div></div>'
    +'<div class="ph-stats">'
      +'<div class="ph-stat"><div class="ph-k">总粉丝数</div><div class="ph-v">'+fmt(total)+'</div></div>'
      +'<div class="ph-stat"><div class="ph-k">本周净增</div><div class="ph-v up">▲ +'+fmt(totalWg)+'</div></div>'
      +'<div class="ph-stat"><div class="ph-k">整体周增长率</div><div class="ph-v up">+'+rate.toFixed(1)+'%</div></div>'
    +'</div>'
    +'<div class="ph-engine"><span class="ph-engine-tag">🚀 增长引擎</span><span class="ph-engine-name" style="color:'+(topP?topP.pl.color:'#333')+'">'+esc(topP?topP.pl.name:'—')+'</span><span class="ph-engine-pct">贡献 '+topShare+'%</span></div>'
    +'</div>';
  el.innerHTML=hero

}

// ===== Toast 通知 =====
let toastTimer=null;
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;
  clearTimeout(toastTimer);
  // 强制 reflow 后加 show
  void t.offsetWidth;
  t.classList.add('show');
  toastTimer=setTimeout(()=>t.classList.remove('show'),4000);
}
