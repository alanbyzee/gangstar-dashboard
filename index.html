async function loadFans(){
  // 内联 FALLBACK 即部署最新值（看板铁律：双文件同步 + FALLBACK 内联）。
  // 直接用它渲染，避免线上 fan_data.json 漏推导致旧值覆盖新值。

const btn=document.getElementById('refreshBtn');

function setStatus(text,type){
  statusEl.textContent=text;statusEl.className='status show '+type;
}

const SHARED = location.hostname.endsWith('github.io');
btn.onclick=async()=>{
  btn.disabled=true;btn.classList.add('loading');
  // 公网版（GitHub Pages）：无本地爬虫，刷新 = 重新拉取仓库内最新 fan_data.json
  if(SHARED){
    setStatus('⏳ 正在拉取最新粉丝数据…','info');
    try{
      const r=await fetch('./fan_data.json?t='+Date.now(),{cache:'no-store'});
      if(r.ok){
        const nd=await r.json();
        lastData=nd;renderFans(nd);
        btn.disabled=false;btn.classList.remove('loading');
        setStatus('✅ 已同步至 '+nd.updated_at,'ok');
        showToast('✅ 粉丝数据已同步\nIG: '+fmt(nd.platforms.instagram.value)+' | FB: '+fmt(nd.platforms.facebook.value)+' | YTB: '+fmt(nd.platforms.youtube.value),'ok');
      }else{ throw new Error('HTTP '+r.status); }
    }catch(e){
      btn.disabled=false;btn.classList.remove('loading');
      setStatus('⚠️ 拉取失败，请稍后重试','err');
    }
    return;
  }
  // ===== 以下为本地版（连接后台爬虫）逻辑 =====
  // 1. 进入加载态
  btn.disabled=true;btn.classList.add('loading');
  setStatus('⏳ 正在连接刷新服务…','info');

  try{
    // 2. POST 刷新请求
    const r=await fetch('/api/fan-refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ts:Date.now()})});

    if(r.ok){
      setStatus('✅ 请求已提交！后台正在读取 IG / FB / YTB / X…','ok');

      // 3. 轮询等待结果（最多 90 秒）
      let pollCount=0;
      const prevUpdate=lastData?lastData.updated_at:'';
      const pollTimer=setInterval(async()=>{
        pollCount++;
        try{
          const cr=await fetch('/fan_data.json?t='+Date.now(),{cache:'no-store'});
          if(cr.ok){
            const newData=await cr.json();
            if(newData.updated_at!==prevUpdate){
              // 数据已更新！
              clearInterval(pollTimer);
              lastData=newData;renderFans(newData);
              btn.disabled=false;btn.classList.remove('loading');
              setStatus('✅ 刷新成功！已更新至 '+newData.updated_at,'ok');
              showToast('✅ 粉丝数据刷新成功\nIG: '+fmt(newData.platforms.instagram.value)+
                ' | FB: '+fmt(newData.platforms.facebook.value)+
                ' | YTB: '+fmt(newData.platforms.youtube.value),'ok');
            }
          }
        }catch(e){/* ignore */}
        // 超时（已等待约 3.5 分钟）
        if(pollCount>70){
          clearInterval(pollTimer);
          btn.disabled=false;btn.classList.remove('loading');
          setStatus('⏱ 后台仍在读取中（通常几分钟内完成）。稍后切回本页即可看到更新；或直接在对话里让我「刷新粉丝数」立即更新','warn');
          showToast('⏱ 刷新请求已提交，后台读取中\n通常几分钟内完成，可稍后查看','err');
        }
      },3000);

    }else{
      throw new Error('HTTP '+r.status);
    }

  }catch(e){
    // 服务未连接 / file:// 直接打开：不跳走，仅提示正确打开方式
    btn.disabled=false;btn.classList.remove('loading');
    if(isFile){
      setStatus('请双击「Gangstar看板.app」打开看板，刷新按钮才能连接后台','warn');
    }else{
      setStatus('刷新服务未连接 — 请双击「Gangstar看板.app」重新打开','warn');
    }
  }
};

(function bindSaDrag(){
  const root=document.getElementById('southAsiaView');
  if(!root) return;
  let drag=null;

  function cellAt(x,y){
    const els=document.elementsFromPoint(x,y)||[];
    for(const el of els){ if(el&&el.closest){const c=el.closest('.sa-cell'); if(c) return c;} }
    return null;
  }
  function moveGhost(x,y){
    if(!drag) return;
    drag.gx=x-drag.dx; drag.gy=y-drag.dy;
    if(!drag.raf){
      drag.raf=requestAnimationFrame(function(){
        drag.raf=0;
        drag.ghost.style.transform='translate3d('+drag.gx+'px,'+drag.gy+'px,0) rotate(-1.5deg)';
      });
    }
  }
  function cleanup(){
    if(!drag) return;
    const d=drag; drag=null;
    if(d.raf) cancelAnimationFrame(d.raf);
    if(d.ghost&&d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    d.item.classList.remove('dragging');
    if(d.cell) d.cell.classList.remove('drop-over');
    document.body.style.userSelect='';
    return d;
  }

  root.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0) return;
    const h=e.target.closest&&e.target.closest('.sa-drag');
    if(!h) return;
    const item=h.closest('.sa-post');
    if(!item||!item.getAttribute('data-pid')) return;
    e.preventDefault(); e.stopPropagation();
    const cell0=item.closest('.sa-cell')?item.closest('.sa-cell'):null;
    const originDate=cell0?cell0.getAttribute('data-date'):'';
    const rect=item.getBoundingClientRect();
    const ghost=item.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width=rect.width+'px';
    ghost.style.left='0px'; ghost.style.top='0px';
    ghost.style.transform='translate3d(0,0,0)';
    ghost.style.willChange='transform';
    document.body.appendChild(ghost);
    drag={pid:item.getAttribute('data-pid'),ruid:item.getAttribute('data-ruid')||'',date:originDate,item:item,ghost:ghost,dx:e.clientX-rect.left,dy:e.clientY-rect.top,cell:null,moved:false,raf:0,gx:0,gy:0};
    item.classList.add('dragging');
    try{h.setPointerCapture(e.pointerId);}catch(_){}
    document.body.style.userSelect='none';
    moveGhost(e.clientX,e.clientY);
  });

  document.addEventListener('pointermove',e=>{
    if(!drag) return;
    e.preventDefault();
    drag.moved=true;
    moveGhost(e.clientX,e.clientY);
    const cell=cellAt(e.clientX,e.clientY);
    if(drag.cell&&drag.cell!==cell) drag.cell.classList.remove('drop-over');
    if(cell) cell.classList.add('drop-over');
    drag.cell=cell;
    if(cell && cell.getAttribute('data-date')===drag.date){
      cell.querySelectorAll('.sa-post.rb,.sa-post.ra').forEach(x=>x.classList.remove('rb','ra'));
      const sp=[...cell.querySelectorAll('.sa-post')].filter(x=>x!==drag.item);
      let tgt=null;
      for(const p of sp){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){tgt=p;break;}}
      if(tgt) tgt.classList.add('rb'); else if(sp.length){sp[sp.length-1].classList.add('ra');}
    }else{
      root.querySelectorAll('.sa-post.rb,.sa-post.ra').forEach(x=>x.classList.remove('rb','ra'));
    }
  },{passive:false});

  document.addEventListener('pointerup',e=>{
    if(!drag) return;
    const cell=drag.cell, pid=drag.pid, ruid=drag.ruid, moved=drag.moved, od=drag.date, di=drag.item;
    cleanup();
    if(!cell||!moved) return;
    const target=cell.getAttribute('data-date');
    if(target===od){
      pushUndo();
      const c=root.querySelector('.sa-cell[data-date="'+target+'"]');
      const sp=[...c.querySelectorAll('.sa-post')].filter(x=>x!==di);
      let beforePid=null;
      for(const p of sp){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){beforePid=p.getAttribute('data-pid');break;}}
      let seq=sp.map(x=>x.getAttribute('data-pid'));
      if(beforePid===null) seq.push(pid); else{const i=seq.indexOf(beforePid);if(i<0)seq.push(pid);else seq.splice(i,0,pid);}
      setSaOrder(target,seq);
      renderSouthAsia();
      return;
    }
    if(!target) return;
    pushUndo();
    if(ruid){
      // 区域素材：与「区域素材周历」共用同一份移动记录，两个视图保持一致
      const orig=(ruid.split('|')[1])||'';
      const rm=getRegionMoves();
      if(target===orig) delete rm[ruid]; else rm[ruid]=target;
      localStorage.setItem('gangstar_regional_moves',JSON.stringify(rm));
    }else if(pid.indexOf('cus|')===0){
      // 自定义素材：与区域周历共用 gangstar_regional_moves（cus|<id> -> 目标日期），两表同步
      const cid=pid.slice(4);

      const rm=getRegionMoves();
      if(target===orig) delete rm[pid]; else rm[pid]=target;

      const orig=(pid.split('|')[1])||'';

      localStorage.setItem('gangstar_sa_moves',JSON.stringify(moves));
    }

  });

  document.addEventListener('pointercancel',()=>{cleanup();});

})();

  // 绑定筛选开关

// 全局撤销见 doUndo()（快照整个本地状态，覆盖所有表的所有操作）
function saToast(msg){
  const old=document.querySelector('.sa-toast');
  if(old) old.remove();
  const t=document.createElement('div');
  t.className='sa-toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1500);
}
// 弹窗关闭守卫：只要用户在任一输入框按下/聚焦/选中/输入，就视为已介入，点遮罩不再能误关
// （防编辑标题/描述时选中文字、拖选松手落背景等把弹窗秒关丢内容）。只有「完全没碰过」且
// 点击手势确实从背景开始（排除框内拖选松手到背景），点遮罩才允许直接关。保存/取消始终可用。
function modalChangedGuard(bg){
  let engaged=false;
  const fields=bg.querySelectorAll('input,select,textarea');
  fields.forEach(el=>{
    el.addEventListener('input',()=>engaged=true);
    el.addEventListener('change',()=>engaged=true);
    el.addEventListener('focus',()=>engaged=true);
    el.addEventListener('pointerdown',()=>engaged=true);
    el.addEventListener('mousedown',()=>engaged=true);
  });
  let downOnBg=false;
  bg.addEventListener('pointerdown',e=>{ downOnBg=(e.target===bg); });
  bg.addEventListener('click',e=>{
    if(e.target!==bg) return;        // 只处理点到背景遮罩
    if(!downOnBg) return;            // 手势不是从背景开始（如框内拖选松手到背景）→ 忽略
    if(engaged) return;             // 已介入过 → 必须点 取消/保存
    bg.remove();
  });
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();doUndo();}
});

// 添加素材模态框
function openAddModal(date){
  const old=document.querySelector('.sa-modal-bg');
  if(old) old.remove();
  const opts=`<option value="hq">HQ公线素材</option>`+(CONTENT_TYPES||[]).map(t=>`<option value="${t.key}">${t.name}</option>`).join('');
  const bg=document.createElement('div');
  bg.className='sa-modal-bg';
  bg.innerHTML=`<div class="sa-modal">
    <h3>添加素材 · ${date}</h3>
    <label>标题</label>
    <input type="text" id="m-title" placeholder="素材标题" autofocus>
    <label>类别</label>
    <select id="m-type">${opts}</select>
    <label>合作方（选填）</label>
    <input type="text" id="m-partner" placeholder="合作方">
    <label>描述（选填）</label>
    <input type="text" id="m-desc" placeholder="补充描述">
    ${buildHashtagPicker([])}
    <div class="sa-modal-btns">
      <button class="btn-cancel" type="button">取消</button>
      <button class="btn-save" type="button">保存</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('.btn-cancel').onclick=()=>bg.remove();
  modalChangedGuard(bg);
  // hashtag 芯片点击切换
  bg.querySelector('.ht-row').addEventListener('click',e=>{
    if(e.target.classList.contains('ht-x')){ const c=e.target.closest('.ht-chip'); if(c)c.remove(); return; }
    if(e.target.classList.contains('ht-chip')){
      const chip=e.target.closest('.ht-chip');
      if(chip.closest('#ht-selected')){ chip.remove(); return; }   // 已选里点一下=移除
      toggleHashtagSelected(bg, chip.dataset.tag);                  // 池/最近里点一下=加入
    }
  });
  // 自定义标签：回车即时变成可点选 chip
  const htInput=bg.querySelector('#ht-custom');
  if(htInput) htInput.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const v=htInput.value.trim(); if(!v) return;
    let t=v; if(!t.startsWith('#')) t='#'+t;
    const sel=bg.querySelector('#ht-selected');
    const existed=sel && [...sel.querySelectorAll('.ht-chip')].some(c=>c.dataset.tag.toLowerCase()===t.toLowerCase());
    if(existed){ htInput.value=''; return; }
    toggleHashtagSelected(bg, t);
    htInput.value='';
  });
  const saveFn=()=>{
    const title=document.getElementById('m-title').value.trim();
    if(!title) return;
    const type=document.getElementById('m-type').value;
    const partner=document.getElementById('m-partner').value.trim();
    const desc=document.getElementById('m-desc').value.trim();
    const hashtags=collectHashtags();
          recordHashtagUsage(hashtags);
    pushUndo();
    try{
      const custom=JSON.parse(localStorage.getItem('gangstar_custom')||'{}');
      if(!custom[date]) custom[date]=[];
      custom[date].push({_id:Date.now()+''+Math.random().toString(36).slice(2,6),type,title,partner,desc,hashtags});
      localStorage.setItem('gangstar_custom',JSON.stringify(custom));
    }catch(e){}
    bg.remove();
    renderSouthAsia(); renderRegional();
  };
  bg.querySelector('.btn-save').onclick=saveFn;
}

    <input type="text" id="m-desc" value="${esc(cur.desc||'')}" placeholder="补充描述">

    <div class="sa-modal-btns">
      <button class="btn-cancel" type="button">取消</button>
      <button class="btn-save" type="button">保存</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const typeSel=bg.querySelector('#m-type');
  if(isHQ){ typeSel.value='hq'; typeSel.disabled=true; }
  else if(cur.type){ typeSel.value=cur.type; }
  bg.querySelector('.btn-cancel').onclick=()=>bg.remove();
  modalChangedGuard(bg);
  bg.querySelector('.ht-row').addEventListener('click',e=>{
    if(e.target.classList.contains('ht-x')){ const c=e.target.closest('.ht-chip'); if(c)c.remove(); return; }
    if(e.target.classList.contains('ht-chip')){
      const chip=e.target.closest('.ht-chip');
      if(chip.closest('#ht-selected')){ chip.remove(); return; }   // 已选里点一下=移除
      toggleHashtagSelected(bg, chip.dataset.tag);                  // 池/最近里点一下=加入
    }
  });
  // 自定义标签：回车即时变成可点选 chip
  const htInput=bg.querySelector('#ht-custom');
  if(htInput) htInput.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const v=htInput.value.trim(); if(!v) return;
    let t=v; if(!t.startsWith('#')) t='#'+t;
    const sel=bg.querySelector('#ht-selected');
    const existed=sel && [...sel.querySelectorAll('.ht-chip')].some(c=>c.dataset.tag.toLowerCase()===t.toLowerCase());
    if(existed){ htInput.value=''; return; }
    toggleHashtagSelected(bg, t);
    htInput.value='';
  });
  const saveFn=()=>{
    const title=document.getElementById('m-title').value.trim();
    if(!title) return;
    const type=document.getElementById('m-type').value;
    const partner=document.getElementById('m-partner').value.trim();
    const desc=document.getElementById('m-desc').value.trim();
    const hashtags=collectHashtags();
          recordHashtagUsage(hashtags);
    try{
      const all=JSON.parse(localStorage.getItem('gangstar_edits')||'{}');
      pushUndo();
      all[pid]={title,type,partner,desc,hashtags};
      localStorage.setItem('gangstar_edits',JSON.stringify(all));
    }catch(e){}
    bg.remove();
    renderSouthAsia();
  };
  bg.querySelector('.btn-save').onclick=saveFn;
}

// HQ 详情查看（帖子旁浮窗）
function openDetailModal(pid, anchorEl){
  const d=saDetailMap[pid];
  if(!d||!anchorEl) return;
  const old=document.querySelector('.sa-popover');
  if(old) old.remove();
  const pop=document.createElement('div');
  pop.className='sa-popover';
  pop.innerHTML=`<span class="pop-close">×</span><div class="pop-meta">📅 ${esc(d.fullTime||'--')}${d.plat?' · 📡 '+esc(d.plat):''}</div><div class="pop-body">${esc(d.fullBrief)}</div>`;
  document.body.appendChild(pop);
  const rect=anchorEl.getBoundingClientRect();
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=rect.left;
  let top=rect.bottom+6;
  if(left+pw>window.innerWidth-10) left=window.innerWidth-pw-10;
  if(left<10) left=10;
  if(top+ph>window.innerHeight-10) top=rect.top-ph-6;
  if(top<10) top=10;
  pop.style.left=left+'px';
  pop.style.top=top+'px';
  pop.querySelector('.pop-close').onclick=()=>pop.remove();
  setTimeout(()=>{
    document.addEventListener('click',function close(e){
      if(!pop.contains(e.target)&&!anchorEl.contains(e.target)){pop.remove();document.removeEventListener('click',close);}
    });
  },10);
}

const HASHTAG_PRESETS=[

  '#FreeToPlay','#GameDev'
];

// 构建 Hashtag 选择器 HTML（返回 HTML 字符串，existing=已选数组）
function buildHashtagPicker(existing){
  const sel=new Set((existing||[]).map(h=>h.toLowerCase()));
  // 最近使用（7天内）置顶区
  let recentHtml='';
  try{
    const KEY='gangstar_hashtag_history';
    const hist=JSON.parse(localStorage.getItem(KEY)||'[]');
    const cutoff=Date.now()-7*24*3600*1000;
    const recent=hist.filter(h=>h.ts>=cutoff).sort((a,b)=>b.ts-a.ts).map(h=>h.tag);
    if(recent.length){
      const rc=recent.map(h=>`<span class="ht-chip" data-tag="${esc(h)}">${esc(h)}</span>`).join('');
      recentHtml=`<label class="ht-recent-label">最近使用（7天内）</label><div class="ht-chips ht-recent" id="ht-recent">${rc}</div>`;
    }
  }catch(e){}
  const chips=HASHTAG_PRESETS.map(h=>`<span class="ht-chip" data-tag="${esc(h)}">${esc(h)}</span>`).join('');
  const selHtml=(existing||[]).map(h=>`<span class="ht-chip ht-active" data-tag="${esc(h)}">${esc(h)}<b class="ht-x" title="移除">×</b></span>`).join('');
  return `<div class="ht-row">${recentHtml}
    <label>已选 Hashtag（点下方标签或输入回车添加；点 × 或点已选标签移除）</label>
    <div class="ht-chips ht-sel" id="ht-selected">${selHtml}</div>
    <label>推荐 / 最近标签</label>
    <div class="ht-chips" id="ht-pool">${chips}</div>
    <input type="text" id="ht-custom" placeholder="自定义标签，回车添加">
  </div>`;
}
// 在「已选」行中加入/移出某个 hashtag（按标签去重）
function toggleHashtagSelected(bg, tag){
  if(!bg||!tag) return;
  const sel=bg.querySelector('#ht-selected'); if(!sel) return;
  const found=[...sel.querySelectorAll('.ht-chip')].find(c=>c.dataset.tag.toLowerCase()===tag.toLowerCase());
  if(found){ found.remove(); return; }
  const sp=document.createElement('span');
  sp.className='ht-chip ht-active'; sp.dataset.tag=tag;
  sp.innerHTML=esc(tag)+'<b class="ht-x" title="移除">×</b>';
  sel.appendChild(sp);
}

// 从弹窗 DOM 收集已选 Hashtags（返回数组）——「已选」行为唯一数据源
function collectHashtags(){
  const chips=[...document.querySelectorAll('#ht-selected .ht-chip')].map(el=>el.dataset.tag);
  const custom=document.getElementById('ht-custom').value.trim();
  if(custom) custom.split(/[,，]/).forEach(h=>{ h=h.trim(); if(h){ if(!h.startsWith('#'))h='#'+h; if(!chips.some(c=>c.toLowerCase()===h.toLowerCase())) chips.push(h); }});
  return chips;
}

// 记录使用过的 hashtag（写入 localStorage，自动经 Firebase 同步多端；保留 7 天）
function recordHashtagUsage(tags){
  try{
    const KEY='gangstar_hashtag_history';
    let hist=[];
    try{ hist=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ hist=[]; }
    const now=Date.now();
    (tags||[]).forEach(t=>{
      t=(t||'').trim(); if(!t) return;
      if(!t.startsWith('#')) t='#'+t;
      const i=hist.findIndex(h=>h.tag.toLowerCase()===t.toLowerCase());
      if(i>=0) hist[i].ts=now; else hist.push({tag:t,ts:now});
    });
    const cutoff=now-7*24*3600*1000;
    hist=hist.filter(h=>h.ts>=cutoff);
    localStorage.setItem(KEY,JSON.stringify(hist));
  }catch(e){}
}

// ===== 区域素材独立看板（周历格式，保留独立入口）=====
// 拖拽移动记录：localStorage 增量（uid -> 目标日期），不改动源数据
function getRegionMoves(){
  try{return JSON.parse(localStorage.getItem('gangstar_regional_moves')||'{}');}catch(e){return {};}
}
function regionUid(range,date,it,i){return range+'|'+date+'|'+it.type+'|'+it.title+'|'+(i||0);}
// 单日排序：区域周历按「日期 -> [uid 序列]」记忆（跨类型行完整序列）
function getRegOrder(){try{return JSON.parse(localStorage.getItem('gangstar_regional_order')||'{}');}catch(e){return {};}}
function setRegOrder(date,pids){const o=getRegOrder();if(!pids||!pids.length)delete o[date];else o[date]=pids;localStorage.setItem('gangstar_regional_order',JSON.stringify(o));}
function sortRegItems(arr,date){const ord=getRegOrder()[date];if(!ord||!ord.length)return arr;const idx={};ord.forEach((u,i)=>idx[u]=i);return arr.slice().sort((a,b)=>{const ia=(a.uid in idx)?idx[a.uid]:1e9;const ib=(b.uid in idx)?idx[b.uid]:1e9;return ia-ib;});}

// ===== 区域素材统一状态（两表共享）=====
function getRegionHidden(){try{return new Set(JSON.parse(localStorage.getItem('gangstar_hidden')||'[]'));}catch(e){return new Set();}}
function getRegionCancelled(){try{return new Set(JSON.parse(localStorage.getItem('gangstar_cancelled')||'[]'));}catch(e){return new Set();}}
function getRegionEdits(){try{return JSON.parse(localStorage.getItem('gangstar_edits')||'{}');}catch(e){return {};}}
function getRegionCustom(){try{return JSON.parse(localStorage.getItem('gangstar_custom')||'{}');}catch(e){return {};}}
function getReqSubmitted(){try{return JSON.parse(localStorage.getItem('gangstar_req_submitted')||'{}');}catch(e){return {};}}
function toggleReq(uid){pushUndo();const m=getReqSubmitted();if(m[uid])delete m[uid];else m[uid]=true;localStorage.setItem('gangstar_req_submitted',JSON.stringify(m));renderSouthAsia();renderRegional();}
function getDelayed(){try{return JSON.parse(localStorage.getItem('gangstar_delayed')||'{}');}catch(e){return {};}}
function toggleDelay(uid){pushUndo();const m=getDelayed();if(m[uid])delete m[uid];else m[uid]=true;localStorage.setItem('gangstar_delayed',JSON.stringify(m));renderSouthAsia();renderRegional();}

// ===== 全局撤销：快照整个本地状态，覆盖所有表的所有操作 =====
const UNDO_KEYS=['gangstar_sa_moves','gangstar_regional_moves','gangstar_hidden','gangstar_cancelled','gangstar_edits','gangstar_custom','gangstar_fan_target','gangstar_req_submitted','gangstar_delayed','gangstar_sa_order','gangstar_regional_order'];
function snapshotApp(){const o={};UNDO_KEYS.forEach(k=>{try{o[k]=localStorage.getItem(k);}catch(e){o[k]=null;}});return o;}
function pushUndo(){let s=[];try{s=JSON.parse(localStorage.getItem('gangstar_undo')||'[]');}catch(e){}s.push(snapshotApp());if(s.length>50)s=s.slice(-50);localStorage.setItem('gangstar_undo',JSON.stringify(s));}
function doUndo(){let s=[];try{s=JSON.parse(localStorage.getItem('gangstar_undo')||'[]');}catch(e){}if(!s.length){saToast('没有可撤销的操作');return;}const snap=s.pop();localStorage.setItem('gangstar_undo',JSON.stringify(s));UNDO_KEYS.forEach(k=>{if(snap[k]===null||snap[k]===undefined)localStorage.removeItem(k);else try{localStorage.setItem(k,snap[k]);}catch(e){}});renderSouthAsia();renderRegional();saToast('已撤销 ⌘Z');}

// 区域素材编辑弹窗（写入 gangstar_edits[uid]，与南亚社群排期同一份）
function openRegionEditModal(uid){
  const old=document.querySelector('.sa-modal-bg');if(old)old.remove();
  const cur=regEditMap[uid]||{};
  const opts=(CONTENT_TYPES||[]).map(t=>`<option value="${t.key}">${t.name}</option>`).join('');
  const bg=document.createElement('div');bg.className='sa-modal-bg';
  bg.innerHTML=`<div class="sa-modal"><h3>编辑区域素材</h3>
    <label>标题</label><input type="text" id="m-title" value="${esc(cur.title||'')}" autofocus>
    <label>类别</label><select id="m-type">${opts}</select>
    <label>合作方（选填）</label><input type="text" id="m-partner" value="${esc(cur.partner||'')}">
    <label>描述（选填）</label><input type="text" id="m-desc" value="${esc(cur.desc||'')}">
    ${buildHashtagPicker(cur.hashtags)}
    <div class="sa-modal-btns"><button class="btn-cancel" type="button">取消</button><button class="btn-save" type="button">保存</button></div></div>`;
  document.body.appendChild(bg);
  const typeSel=bg.querySelector('#m-type');if(cur.type)typeSel.value=cur.type;
  bg.querySelector('.btn-cancel').onclick=()=>bg.remove();
  modalChangedGuard(bg);
  bg.querySelector('.ht-row').addEventListener('click',e=>{
    if(e.target.classList.contains('ht-x')){ const c=e.target.closest('.ht-chip'); if(c)c.remove(); return; }
    if(e.target.classList.contains('ht-chip')){
      const chip=e.target.closest('.ht-chip');
      if(chip.closest('#ht-selected')){ chip.remove(); return; }   // 已选里点一下=移除
      toggleHashtagSelected(bg, chip.dataset.tag);                  // 池/最近里点一下=加入
    }
  });
  // 自定义标签：回车即时变成可点选 chip
  const htInput=bg.querySelector('#ht-custom');
  if(htInput) htInput.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const v=htInput.value.trim(); if(!v) return;
    let t=v; if(!t.startsWith('#')) t='#'+t;
    const sel=bg.querySelector('#ht-selected');
    const existed=sel && [...sel.querySelectorAll('.ht-chip')].some(c=>c.dataset.tag.toLowerCase()===t.toLowerCase());
    if(existed){ htInput.value=''; return; }
    toggleHashtagSelected(bg, t);
    htInput.value='';
  });
  const saveFn=()=>{
    const title=document.getElementById('m-title').value.trim();if(!title)return;
    const type=document.getElementById('m-type').value;
    const partner=document.getElementById('m-partner').value.trim();
    const desc=document.getElementById('m-desc').value.trim();
    const hashtags=collectHashtags();
          recordHashtagUsage(hashtags);
    pushUndo();
    try{const all=JSON.parse(localStorage.getItem('gangstar_edits')||'{}');all[uid]={title,type,partner,desc,hashtags};localStorage.setItem('gangstar_edits',JSON.stringify(all));}catch(e){}
    bg.remove();renderRegional();
  };

}

function renderRegional(){
  const el=document.getElementById('regionalView');
  const today=new Date().toISOString().slice(0,10);
  const weeks=(REGIONAL_DATA&&REGIONAL_DATA.weeks)||[];
  if(!weeks.length){el.innerHTML='<p style="color:var(--muted);padding:40px;text-align:center">暂无素材数据</p>';return;}

  // 统一状态（与南亚社群排期共享：移动/隐藏/划线/编辑/自定义）
  const moves=getRegionMoves();
  const hidden=getRegionHidden();
  const cancelled=getRegionCancelled();
  const edits=getRegionEdits();
  const custom=getRegionCustom();
  const reqs=getReqSubmitted();
  const dels=getDelayed();
  regEditMap={};
  const dateWeek={};
  weeks.forEach((w,wi)=>w.days.forEach(d=>dateWeek[d.date]=wi));
  const dispItems=weeks.map(()=>({}));
  const addItem=(effDate,obj)=>{
    const ti=dateWeek[effDate];
    if(ti===undefined) return;
    (dispItems[ti][effDate]=dispItems[ti][effDate]||[]).push(obj);
  };
  // 源素材
  weeks.forEach((w,wi)=>{
    Object.entries(w.items||{}).forEach(([od,arr])=>{
      (arr||[]).forEach((it,ii)=>{
        const uid=regionUid(w.range,od,it,ii);
        if(hidden.has(uid)) return;
        const eff=moves[uid]||od;
        const ov=edits[uid]||null;
        regEditMap[uid]={type:ov?ov.type||it.type:it.type,title:ov?ov.title||it.title:it.title,partner:ov?ov.partner!==undefined?ov.partner:it.partner:it.partner,desc:ov?ov.desc!==undefined?ov.desc:it.desc:it.desc,hashtags:ov?ov.hashtags||[]:[],isCustom:false};
        addItem(eff,{it,uid,isCustom:false,can:cancelled.has(uid),ov});
      });
    });
  });
  // 自定义素材（与南亚社群排期同一份 gangstar_custom，移动用 gangstar_regional_moves）
  Object.entries(custom).forEach(([od,arr])=>{
    (arr||[]).forEach(it=>{
      const uid='cus|'+it._id;
      if(hidden.has(uid)) return;
      const eff=moves[uid]||od;
      const ov=edits[uid]||null;
      regEditMap[uid]={type:ov?ov.type||it.type:it.type,title:ov?ov.title||it.title:it.title,partner:ov?ov.partner!==undefined?ov.partner:it.partner:it.partner,desc:ov?ov.desc!==undefined?ov.desc:it.desc:it.desc,hashtags:ov?ov.hashtags||[]:[],isCustom:true};
      addItem(eff,{it,uid,isCustom:true,can:cancelled.has(uid),ov});
    });
  });

  const weeksHtml=weeks.map((week,wi)=>{
    const items=dispItems[wi];
    let totalItems=0;
    const typeCount={};
    CONTENT_TYPES.forEach(t=>typeCount[t.key]=0);
    Object.values(items||{}).forEach(dayItems=>{
      (dayItems||[]).forEach(x=>{const tp=(x.ov&&x.ov.type)?x.ov.type:x.it.type;totalItems++;if(typeCount[tp]!==undefined)typeCount[tp]++;});
    });

    const headHtml=`<div class="cal-head">
      <div>类型 \\ 日期</div>
      ${week.days.map(d=>{
        const isToday=d.date===today;
        return `<div class="${isToday?'today-ring':''}"><span class="date-num">${d.num}</span><span class="dow">${d.dow}</span><span class="reg-add" data-date="${d.date}" title="添加素材到此日">+</span></div>`;
      }).join('')}
    </div>`;

    const usedTypes=CONTENT_TYPES.filter(t=>typeCount[t.key]>0);
    const rowsHtml=usedTypes.map(t=>{
      const cells=week.days.map(d=>{
        let dayItems=(items[d.date]||[]).filter(x=>{const tp=(x.ov&&x.ov.type)?x.ov.type:x.it.type;return tp===t.key;});
        dayItems=sortRegItems(dayItems,d.date);
        // 延时项沉底（排到当天排期最后）
        dayItems=dayItems.slice().sort((a,b)=>(dels[a.uid]?1:0)-(dels[b.uid]?1:0));
        const cellContent=dayItems.map(x=>{
          const o=x.it, ov=x.ov, uid=x.uid, can=x.can, isCustom=x.isCustom;
          const tp=(ov&&ov.type)?ov.type:o.type;
          const title=(ov&&ov.title)?ov.title:o.title;
          const partner=(ov&&ov.partner!==undefined)?ov.partner:(o.partner||'');
          const desc=(ov&&ov.desc!==undefined)?ov.desc:(o.desc||'');
          const hashtags=(ov&&ov.hashtags)?ov.hashtags:(o.hashtags||[]);
          const typeCls='t-'+tp;
          const ti=(CONTENT_TYPES.find(c=>c.key===tp))||{name:tp};
          const partnerHtml=partner?`<div class="partner">合作方：<u>${esc(partner)}</u></div>`:'';
          const descHtml=desc?`<div class="partner" style="color:var(--ink);font-size:11px;margin-top:2px">${esc(desc)}</div>`:'';
          const htHtml=(hashtags&&hashtags.length)?`<div class="ht-tags">${hashtags.map(h=>`<span class="ht-tag">${esc(h)}</span>`).join('')}</div>`:'';
          const cancelCls=can?'iact cancel on':'iact cancel';
          const reqOn=reqs[uid];
          const delOn=!!dels[uid];
          const reqBox=`<div class="req-row"><span class="req-box ${reqOn?'on':''}" data-uid="${esc(uid)}" title="点此确认：已提交制作需求"><span class="mk">${reqOn?'✓':''}</span>${reqOn?'已提需求':'提需求'}</span></div>`;
          const delCls=delOn?' delayed':'';
          const delayBadge=delOn?'<span class="delay-badge">DELAY</span>':'';
          return `<div class="item ${typeCls}${can?' cancelled':''}${delCls}" data-uid="${esc(uid)}" data-custom="${isCustom?1:0}"><div class="it-head">${delayBadge}<span class="tag">${esc(ti.name)}</span><span class="it-acts"><span class="iact edit" data-uid="${esc(uid)}" title="编辑">✎</span><span class="${cancelCls}" data-uid="${esc(uid)}" title="划线/恢复">划</span><span class="iact delay ${delOn?'on':''}" data-uid="${esc(uid)}" title="标记此素材为延期 / Delay">延</span><span class="iact del" data-uid="${esc(uid)}" title="删除">×</span></span><span class="drag-handle" title="按住拖拽到其他日期">⠿</span></div><div class="it-body"><div class="title">${esc(title)}</div>${partnerHtml}${descHtml}${htHtml}${reqBox}</div></div>`;
        }).join('');
        return `<div class="cell" data-date="${d.date}">${cellContent}</div>`;
      }).join('');
      return `<div class="cal-row">
        <div class="type-label"><span class="dot" style="background:${t.color}"></span>${t.icon} ${t.name}<span style="margin-left:auto;color:var(--muted);font-size:11px;font-weight:700">${typeCount[t.key]}</span></div>
        ${cells}
      </div>`;
    }).join('');

    const statsHtml=`<div class="regional-stats">
      <div class="rstat"><div class="rk">周期</div><div class="rv">${week.range}</div></div>
      <div class="rstat"><div class="rk">素材</div><div class="rv">${totalItems} 条</div></div>
      ${usedTypes.map(t=>`<div class="rstat"><div class="rk" style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:24%;background:${t.color};flex:none"></span>${t.name}</div><div class="rv">${typeCount[t.key]}</div></div>`).join('')}
    </div>`;

    return `<div class="regional-week"><h3>${week.label} · ${week.range}</h3>${statsHtml}${headHtml}<div class="cal-body">${rowsHtml}</div></div>`;
  }).join('');

  el.innerHTML=`
    <h2>📝 区域素材周历</h2>
    <div class="sub">区域社媒素材排期追踪 · 电竞 / meme / KOC / 社群等 7 类素材 · 卡片可拖拽改日期 · 同日内可拖拽重排 · 增删 / 移动 / 划线 / 编辑 与「南亚社群排期」实时同步</div>
    ${weeksHtml}
  `;
  // 绑定区域素材操作（编辑 / 划线 / 删除 / 添加）—— 与南亚社群排期共用同一份本地状态
  el.querySelectorAll('.item .iact.edit').forEach(b=>b.onclick=()=>openRegionEditModal(b.dataset.uid));
  el.querySelectorAll('.item .iact.del').forEach(b=>b.onclick=()=>{
    pushUndo();
    const arr=JSON.parse(localStorage.getItem('gangstar_hidden')||'[]');
    if(!arr.includes(b.dataset.uid)){arr.push(b.dataset.uid);localStorage.setItem('gangstar_hidden',JSON.stringify(arr));}
    renderRegional();
  });
  el.querySelectorAll('.item .iact.cancel').forEach(b=>b.onclick=()=>{
    pushUndo();
    let arr=JSON.parse(localStorage.getItem('gangstar_cancelled')||'[]');
    if(arr.includes(b.dataset.uid)) arr=arr.filter(x=>x!==b.dataset.uid); else arr.push(b.dataset.uid);
    localStorage.setItem('gangstar_cancelled',JSON.stringify(arr));
    renderRegional();
  });
  el.querySelectorAll('.item .req-box').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleReq(b.dataset.uid);});
  el.querySelectorAll('.item .iact.delay').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleDelay(b.dataset.uid);});
  el.querySelectorAll('.reg-add').forEach(b=>b.onclick=()=>openAddModal(b.dataset.date));
  // 横滑箭头：鼠标点击左右滑动周历（横滑查看当周被裁切的日期）
  let arrows=el.querySelector('.cal-arrows');
  if(!arrows){
    arrows=document.createElement('div');
    arrows.className='cal-arrows';
    arrows.innerHTML='<button class="cal-arrow" data-dir="-1" title="向左滑动">‹</button><button class="cal-arrow" data-dir="1" title="向右滑动">›</button>';
    el.appendChild(arrows);
    arrows.querySelectorAll('.cal-arrow').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const w=el.querySelector('.regional-week');
        if(w) w.scrollBy({left:(parseInt(btn.dataset.dir)||1)*Math.max(300,w.clientWidth*0.6),behavior:'smooth'});
      });
    });
  }
}

// 区域素材拖拽改日期（按住卡片右上角手柄 · Pointer Events 实现，兼容性更好）
(function bindRegionDrag(){
  const rv=document.getElementById('regionalView');
  if(!rv) return;
  let drag=null;

  function cellFromPoint(x,y){
    const els=document.elementsFromPoint(x,y)||[];
    for(const el of els){
      if(el && el.closest){ const c=el.closest('.cell'); if(c) return c; }
    }
    return null;
  }
  function moveGhost(x,y){
    if(!drag) return;
    drag.gx=x-drag.dx; drag.gy=y-drag.dy;
    if(!drag.raf){
      drag.raf=requestAnimationFrame(function(){
        drag.raf=0;
        drag.ghost.style.transform='translate3d('+drag.gx+'px,'+drag.gy+'px,0) rotate(-1.5deg)';
      });
    }
  }
  function cleanup(){
    if(!drag) return;
    const d=drag; drag=null;
    if(d.raf) cancelAnimationFrame(d.raf);
    if(d.ghost&&d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    d.item.classList.remove('dragging');
    if(d.cell) d.cell.classList.remove('drop-over');
    document.body.style.userSelect='';
    return d;
  }

  rv.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0) return;
    const h=e.target.closest&&e.target.closest('.drag-handle');
    if(!h) return;
    const item=h.closest('.item');
    if(!item||!item.getAttribute('data-uid')) return;
    e.preventDefault();
    const cell0=item.closest('.cell');
    const originDate=cell0?cell0.getAttribute('data-date'):'';
    const rect=item.getBoundingClientRect();
    const ghost=item.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width=rect.width+'px';
    ghost.style.left='0px'; ghost.style.top='0px';
    ghost.style.transform='translate3d(0,0,0)';
    ghost.style.willChange='transform';
    document.body.appendChild(ghost);
    drag={uid:item.getAttribute('data-uid'),date:originDate,item:item,ghost:ghost,dx:e.clientX-rect.left,dy:e.clientY-rect.top,cell:null,moved:false,raf:0,gx:0,gy:0};
    item.classList.add('dragging');
    try{h.setPointerCapture(e.pointerId);}catch(_){}
    document.body.style.userSelect='none';
    moveGhost(e.clientX,e.clientY);
  });

  document.addEventListener('pointermove',e=>{
    if(!drag) return;
    e.preventDefault();
    drag.moved=true;
    moveGhost(e.clientX,e.clientY);
    const cell=cellFromPoint(e.clientX,e.clientY);
    if(drag.cell&&drag.cell!==cell) drag.cell.classList.remove('drop-over');
    if(cell) cell.classList.add('drop-over');
    drag.cell=cell;
    if(cell && cell.getAttribute('data-date')===drag.date){
      cell.querySelectorAll('.item.rb,.item.ra').forEach(x=>x.classList.remove('rb','ra'));
      const sp=[...cell.querySelectorAll('.item')].filter(x=>x!==drag.item);
      let tgt=null;
      for(const p of sp){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){tgt=p;break;}}
      if(tgt) tgt.classList.add('rb'); else if(sp.length){sp[sp.length-1].classList.add('ra');}
    }else{
      rv.querySelectorAll('.item.rb,.item.ra').forEach(x=>x.classList.remove('rb','ra'));
    }
  },{passive:false});

  document.addEventListener('pointerup',e=>{
    if(!drag) return;
    const cell=drag.cell, uid=drag.uid, moved=drag.moved, od=drag.date, di=drag.item;
    cleanup();
    if(!cell||!moved) return;
    const target=cell.getAttribute('data-date');
    if(target===od){
      pushUndo();
      const c=rv.querySelector('.cell[data-date="'+target+'"]');
      const it=[...c.querySelectorAll('.item')].filter(x=>x.getAttribute('data-uid')!==uid);
      let beforeUid=null;
      for(const p of it){const r=p.getBoundingClientRect();if(e.clientY<r.top+r.height/2){beforeUid=p.getAttribute('data-uid');break;}}
      let seq=[];
      rv.querySelectorAll('.cal-row').forEach(row=>{
        const cc=row.querySelector('.cell[data-date="'+target+'"]');
        if(!cc) return;
        cc.querySelectorAll('.item').forEach(x=>{const u=x.getAttribute('data-uid');if(u!==uid) seq.push(u);});
      });
      if(beforeUid===null) seq.push(uid); else{const i=seq.indexOf(beforeUid);if(i<0)seq.push(uid);else seq.splice(i,0,uid);}
      setRegOrder(target,seq);
      renderRegional();
      return;
    }
    if(!target) return;
    pushUndo();
    const orig=(uid.split('|')[1])||'';
    const moves=getRegionMoves();
    if(target===orig) delete moves[uid]; else moves[uid]=target;
    localStorage.setItem('gangstar_regional_moves',JSON.stringify(moves));
    renderRegional();
  });

  document.addEventListener('pointercancel',()=>{cleanup();});
  window.addEventListener('blur',()=>{cleanup();});
})();

var FB_TM={bug:['bug','🐞 Bug'],sug:['sug','🟦 中性'],bad:['bad','😤 吐槽'],good:['good','👍 好评'],oth:['oth','💬 其它']};
function fbParseTheme(txt){
  var mp={'🐞':'bug','💡':'sug','😤':'bad','👍':'good','bug':'bug','sug':'sug','bad':'bad','good':'good','建议':'sug','中性':'sug','吐槽':'bad','好评':'good'};
  return (txt||'').split('\n').map(function(l){return l.trim();}).filter(function(l){return l;}).map(function(l){
    var m=l.match(/^(🐞|💡|😤|👍|bug|sug|bad|good|建议|中性|吐槽|好评)\s*[:：]?\s*([\s\S]*?)(?:[（(](\d+)[）)])?\s*$/i);
    var type='oth',theme=l,count=0;
    if(m){type=mp[m[1]]||'oth';theme=m[2];count=Number(m[3]||0);}
    else{var c=l.match(/[（(](\d+)[）)]\s*$/);if(c){count=Number(c[1]);theme=l.replace(/[（(]\d+[）)]\s*$/,'').trim();}}
    return {theme:theme,count:count,type:type};
  });

function fbWeekStart(w){var m=/(\d{1,2})\.(\d{1,2})/.exec((w&&w.week)||'');if(!m)return null;var mo=parseInt(m[1],10),da=parseInt(m[2],10);if(mo<1||mo>12||da<1||da>31)return null;return new Date(2026,mo-1,da);}
function fbChName(c){var m={'IG':'Instagram','DC':'Discord','YTB':'YouTube','FB':'Facebook','RD':'Reddit','X':'X','NODWIN':'NODWIN','TG':'Telegram','WA':'WhatsApp','?':'其他'};return m[c]||c;}
function fbBucket(t){if(t==='good')return 'good';if(t==='sug'||t==='oth')return 'sug';return 'bad';}
function fbSeg(arr){var g=0,s=0,b=0;arr=(arr||[]);arr.forEach(function(it){var c=Number(it.count)||0;var k=fbBucket(it.type||'oth');if(k==='good')g+=c;else if(k==='sug')s+=c;else b+=c;});var t=g+s+b;return {g:g,s:s,b:b,t:t,gp:t?Math.round(g/t*100):0,sp:t?Math.round(s/t*100):0,bp:t?Math.round(b/t*100):0,np:t?Math.round((g+s)/t*100):0};}
function fbStrip(s){return (s||'').replace(/\*\*/g,'').replace(/\n+/g,' ').replace(/\s+/g,' ').trim();}

/* 议题标题：取首句、去 Markdown / 换行、截断，避免长文堆砌 */
function fbTitleSrc(it){
  var raw=((it&&it.theme)||'').replace(/\r/g,'');
  var lines=raw.split('\n').map(function(s){return fbStrip(s);}).filter(function(s){return s;});
  var t=lines.length?lines[0]:fbStrip(raw);
  t=t.replace(/^\s*\d+\s*[\.、\)．:：]\s*/,'').trim();
  if(!t)t=fbStrip(raw).replace(/^\s*\d+\s*[\.、\)．:：]\s*/,'').trim();
  return t;
}
function fbTitle(it){
  var t=fbTitleSrc(it);
  if(t.length>30)t=t.slice(0,30)+'…';
  return t||'未命名议题';
}
/* 议题副说明：按类型给出语义 + 渠道，浅灰一行说明 */
function fbSub(it){

  var kind=fbBucket(it.type||'oth');

function fbHealth(seg){var sc=Math.round(50+(seg.np-seg.bp)*0.6);sc=Math.max(0,Math.min(100,sc));var label='预警',cls='red';if(sc>=85){label='健康';cls='green';}else if(sc>=70){label='良好';cls='green';}else if(sc>=55){label='关注';cls='amber';}return {score:sc,label:label,cls:cls};}

function fbStatusCls(it){if(it.type==='bad')return 'st-bad';if(it.type==='sug')return 'st-sug';if(it.type==='good')return 'st-good';return 'st-def';}

/* 极简 Mini Sparkline（无坐标轴 / 无网格 / 无标注，仅一条平滑趋势线 + 极淡面积） */
function fbSparkSVG(arr){
  var W=150,H=44,pad=5;
  var n=arr.length;
  if(!n)return '';
  var max=Math.max.apply(null,arr),min=Math.min.apply(null,arr);
  var range=(max-min)||1;
  function X(i){return n<=1?W/2:pad+(W-2*pad)*i/(n-1);}
  function Y(v){return pad+(H-2*pad)*(1-(v-min)/range);}
  if(n===1){
    var cx=X(0).toFixed(1),cy=Y(arr[0]).toFixed(1);
    return '<svg class="fb3-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#475569"/></svg>';
  }
  var d='M'+X(0).toFixed(1)+' '+Y(arr[0]).toFixed(1);
  for(var i=0;i<n-1;i++){
    var x0=X(i),x1=X(i+1);
    var c1x=(x0+x1)/2,c1y=Y(arr[i]),c2x=(x0+x1)/2,c2y=Y(arr[i+1]);
    d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+x1.toFixed(1)+' '+Y(arr[i+1]).toFixed(1);
  }
  var area=d+' L'+X(n-1).toFixed(1)+' '+(H-pad)+' L'+X(0).toFixed(1)+' '+(H-pad)+' Z';
  return '<svg class="fb3-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    +'<path d="'+area+'" fill="#f1f5f9"/>'
    +'<path d="'+d+'" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    +'</svg>';
}

function fbHasWord(s){return (s||'').replace(/\s+/g,'').replace(/[^\p{L}\p{N}]/gu,'').length;}
function fbIsDrop(it){
  var s=(it&&(it.orig||it.theme))||'';
  if(window.FEEDBACK_DROP&&window.FEEDBACK_DROP[s])return true; /* 人工命中：系统提示 / 刷屏好评 */
  var w=fbHasWord(String(s).replace(/^\s*\d+\s*[\.、\)．:：]\s*/,''));
  if(w===0)return true;  /* 纯表情 / 纯符号 / 空白 → 无效 */
  if(w<=1)return true;   /* 单字符噪声（如 "1"、"好"、"a"）→ 无效 */
  return false;
}
function fbItems(w){return ((w.official||[]).concat(w.community||[])).filter(function(it){return !fbIsDrop(it);});}
function fbQuotesOf(it){

  if(pts.length>1){pts.slice(0,5).forEach(function(p){out.push({zh:p,en:'',src:it.channel||'玩家社区'});});}

/* 渠道占比环形图（纯内联 SVG 字符串，字符串内严禁裸换行） */
function fbDonut(ch,chKeys,center){

  }).join('');

    +'<g transform="rotate(-90 34 34)">'
      +'<circle cx="34" cy="34" r="26" fill="none" stroke="#f1f5f9" stroke-width="9"></circle>'

  var legHtml=chKeys.map(function(k,i){var pct=Math.round(ch[k]/(chSum||1)*100);return '<div class="fb-dl" data-prev="'+fbChName(k)+' '+pct+'% · '+chNum(ch[k])+'条" onmouseenter="showFbTip(this,event)" onmousemove="showFbTip(this,event)" onmouseleave="hideFbTip()"><i style="background:'+fbPal(i)+'"></i><span class="fb-dl-n">'+fbChName(k)+'</span><span class="fb-dl-v">'+pct+'%</span><span class="fb-dl-c">'+chNum(ch[k])+'条</span></div>';}).join('');
  var midHtml=chKeys.length?('<div class="fb-ref-mid">'+fbDonut(ch,chKeys)+'<div class="fb-donut-leg">'+legHtml+'</div></div>'):'';
  var sugItems=items.filter(function(it){return fbBucket(it.type||'oth')==='sug';});

  var catMap={'任务/内容':'任务','功能/系统':'功能','角色/服装':'角色','性能/优化':'性能','地图/世界':'地图'};

    var q=mx?t/mx:1;
    out.push(q>=0.6?'反馈量较高':(q>=0.25?'反馈量中等':'反馈量偏低'));
  }
  if(cats.length){
    out.push(topCh&&topPct>=35?('主要由 '+topCh+' 的'+cats.join('与')+'诉求拉动'):('主要集中在'+cats.join('与')+'等方向'));
  }else if(topCh&&topPct>=35){

  if(isCur&&pSeg&&pSeg.t){
    var d=seg.np-pSeg.np;

    var ops=keys.map(function(k){return writeKey(k, pk[k]?DEL:localStorage.getItem(k));});
    writeMeta();
    Promise.all(ops).then(function(){backupSnapshot();}).catch(function(e){console.warn("[sync] push failed",e);});
  }
  function writeMeta(){ if(localMode) return; try{fbRef.child("__meta").set({writer:MY_ID,ts:Date.now()});}catch(e){} }
  function pushAll(){
    if(!fbReady){toast(localMode?"本地服务未连接，改动仅存本地":"未连接云端，改动仅存本地");return;}
    if(localMode){
      var data={};SYNC_KEYS.forEach(function(k){var v=localStorage.getItem(k);data[k]=(v===null?DEL:v);});
      lsSetMany(data).then(function(){backupSnapshot();toast("已上传本地改动 ⇧");}).catch(function(e){console.warn("[sync] pushAll failed",e);toast("上传失败");});
      return;
    }
    var ops=[];
    SYNC_KEYS.forEach(function(k){var v=localStorage.getItem(k);ops.push(writeKey(k, v===null?DEL:v));});
    writeMeta();
    Promise.all(ops).then(function(){backupSnapshot();toast("已上传本地改动 ⇧");}).catch(function(e){console.warn("[sync] pushAll failed",e);toast("上传失败");});
  }
  function applyRemote(val){
    if(!val)return;
    var changed=false;
    for(var i=0;i<SYNC_KEYS.length;i++){var k=SYNC_KEYS[i];var rv=val[k];
      if(rv===undefined)continue;
      if(rv===DEL){try{_rm(k);}catch(e){}changed=true;continue;}
      var lv=localStorage.getItem(k);
      if(lv!==rv){try{_set(k,rv);}catch(e){}changed=true;}
    }
    if(changed)rerender();
  }
  function rerender(){
    try{
      var activePop=document.querySelector('.sa-popover');
      var activeModal=document.querySelector('.sa-modal');
      if(typeof views!=="undefined"&&views.sa&&views.sa.classList.contains("active")&&typeof renderSouthAsia==="function")renderSouthAsia();
      if(typeof views!=="undefined"&&views.regional&&views.regional.classList.contains("active")&&typeof renderRegional==="function")renderRegional();
      if(activePop||activeModal) toast('数据已同步刷新');
    }catch(e){}
  }
  function backupSnapshot(){
    if(!fbReady)return;
    if(localMode){
      var data={};SYNC_KEYS.forEach(function(k){try{data[k]=localStorage.getItem(k);}catch(e){data[k]=null;}});
      lsBackup(data);
      return;
    }
    var data={};SYNC_KEYS.forEach(function(k){try{data[k]=localStorage.getItem(k);}catch(e){data[k]=null;}});
    var ts=Date.now();
    try{firebase.database().ref(BACKUP_PATH+"/"+ts).set({data:data,meta:{writer:MY_ID,ts:ts}});}catch(e){console.warn("[backup] failed",e);}
    try{firebase.database().ref(BACKUP_PATH).once("value",function(snap){var o=snap.val()||{};var ks=Object.keys(o).map(Number).sort(function(a,b){return a-b;});if(ks.length>60){ks.slice(0,ks.length-60).forEach(function(old){try{firebase.database().ref(BACKUP_PATH+"/"+old).remove();}catch(e){}});}});}catch(e){}
  }
  function toast(msg){
    try{
      var t=document.createElement("div");
      t.textContent=msg;
      t.style.cssText="position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:10000;background:rgba(17,24,39,.92);color:#fff;font:13px/1.4 system-ui,sans-serif;padding:8px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);";
      document.body.appendChild(t);
      setTimeout(function(){t.remove();},1800);
    }catch(e){}
  }
  function ui(){
    var box=document.getElementById("syncBox");
    if(box)return;
    box=document.createElement("div");
    box.id="syncBox";
    box.style.cssText="position:fixed;right:12px;bottom:12px;z-index:9999;display:flex;gap:8px;align-items:center;";
    var badge=document.createElement("span");
    badge.id="syncBadge";
    badge.style.cssText="padding:5px 11px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.18);color:#fff;font:12px/1.4 system-ui,sans-serif;letter-spacing:.3px;";
    var up=document.createElement("button");
    up.textContent="⇧ 上传本地改动";
    up.style.cssText="border:none;cursor:pointer;padding:5px 10px;border-radius:8px;background:#4f46e5;color:#fff;font:12px system-ui;box-shadow:0 2px 8px rgba(0,0,0,.18);";
    up.onclick=function(){pushAll();};
    var bk=document.createElement("button");
    bk.textContent="🕘 备份";
    bk.style.cssText="border:none;cursor:pointer;padding:5px 10px;border-radius:8px;background:#0ea5e9;color:#fff;font:12px system-ui;box-shadow:0 2px 8px rgba(0,0,0,.18);";
    bk.onclick=function(){openBackups();};
    var mob=document.createElement("button");
    mob.textContent="📱 手机同步";
    mob.style.cssText="border:none;cursor:pointer;padding:5px 10px;border-radius:8px;background:#10b981;color:#fff;font:12px system-ui;box-shadow:0 2px 8px rgba(0,0,0,.18);";
    mob.onclick=function(){showMobileSync();};
    box.appendChild(badge);box.appendChild(up);box.appendChild(bk);box.appendChild(mob);
    document.body.appendChild(box);
  }
  function showMobileSync(){
    if(!localMode){toast("未连接本地服务，无法获取手机同步地址");return;}
    fetch(LOCAL_BASE+"/api/info",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
      var file=j.file||"Gangstar运营看板.html";
      var urls=(j.ips||[]).map(function(ip){return "http://"+ip+":"+j.port+"/"+file;});
      if(!urls.length)urls=["http://127.0.0.1:"+j.port+"/"+file];
      var lis=urls.map(function(u){return '<div style="padding:8px 0;border-bottom:1px solid #eee"><a href="'+u+'" target="_blank" style="color:#4f46e5;word-break:break-all">'+u+'</a></div>';}).join("");
      var html='<div id="msMask" onclick="if(event.target.id===\'msMask\')this.remove()" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10002;display:flex;align-items:center;justify-content:center"><div style="background:#fff;border-radius:14px;width:440px;max-width:92vw;max-height:80vh;overflow:auto;padding:18px;font:13px system-ui;color:#111"><h3 style="margin:0 0 6px">手机同步地址</h3><p style="color:#666;margin:0 0 10px">在手机浏览器打开以下任一地址，即可与当前 PC 实时同步（需手机与 PC 同一网络，且本机服务在运行）。</p><div id="msList">'+lis+'</div><p style="color:#888;font-size:11px;margin-top:10px">提示：github.io 公开版无法跨设备同步，请改用上方局域网地址。</p><button onclick="document.getElementById(\'msMask\').remove()" style="margin-top:12px;border:none;background:#4f46e5;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer">关闭</button></div></div>';
      document.body.insertAdjacentHTML('beforeend',html);
    }).catch(function(){toast("获取手机同步地址失败");});
  }
  function setBadge(ok){
    var b=document.getElementById("syncBadge");
    if(!b)return;
    b.textContent=ok?"● 实时同步中":"○ 仅本地 · 未同步";
    b.style.background=ok?"rgba(16,185,129,.95)":"rgba(120,120,128,.92)";
  }
  function openBackups(){
    if(!fbReady){toast(localMode?"本地服务未连接，无法读取备份":"未连接云端，无法读取备份");return;}
    if(localMode){
      lsBackups().then(function(list){
        var html='<div id="bkMask" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10001;display:flex;align-items:center;justify-content:center" onclick="if(event.target.id===\'bkMask\')this.remove()"><div style="background:#fff;border-radius:14px;width:380px;max-height:72vh;overflow:auto;padding:18px;font:13px system-ui;color:#111"><h3 style="margin:0 0 10px">本地备份（最近 '+Math.min(list.length,30)+' 条）</h3><div id="bkList">';
        if(!list.length)html+='<p style="color:#888">暂无备份</p>';
        list.slice(0,30).forEach(function(it){var d=new Date(it.ts);var t=d.toLocaleString();html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee"><span>'+t+'<br><span style="color:#888;font-size:11px">'+it.count+' 个数据块</span></span><button data-ts="'+it.ts+'" style="border:none;background:#4f46e5;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer">恢复</button></div>';});
        html+='</div><p style="color:#888;font-size:11px;margin-top:10px">恢复会把该时间点数据写回本地服务并同步</p></div></div>';
        document.body.insertAdjacentHTML('beforeend',html);
        var bkList=document.getElementById('bkList');
        bkList.addEventListener('click',function(e){var b=e.target.closest('button[data-ts]');if(!b)return;var ts=Number(b.getAttribute('data-ts'));var item=list.filter(function(x){return x.ts===ts;})[0];var data=(item&&item.data)||{};SYNC_KEYS.forEach(function(k){if(data[k]!==undefined&&data[k]!==null&&data[k]!==DEL)writeKey(k,data[k]);else writeKey(k,DEL);});writeMeta();backupSnapshot();var m=document.getElementById('bkMask');if(m)m.remove();toast('已恢复备份 '+new Date(ts).toLocaleString());});
      });
      return;
    }
    try{firebase.database().ref(BACKUP_PATH).once("value",function(snap){
      var o=snap.val()||{};var ks=Object.keys(o).map(Number).sort(function(a,b){return b-a;});
      var html='<div id="bkMask" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10001;display:flex;align-items:center;justify-content:center" onclick="if(event.target.id===\'bkMask\')this.remove()"><div style="background:#fff;border-radius:14px;width:380px;max-height:72vh;overflow:auto;padding:18px;font:13px system-ui;color:#111"><h3 style="margin:0 0 10px">云端备份（最近 '+Math.min(ks.length,30)+' 条）</h3><div id="bkList">';
      if(!ks.length)html+='<p style="color:#888">暂无备份</p>';
      ks.slice(0,30).forEach(function(ts){var d=new Date(ts);var t=d.toLocaleString();var data=(o[ts]&&o[ts].data)||{};var cnt=Object.keys(data).filter(function(k){return data[k]!=null&&data[k]!==DEL;}).length;html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee"><span>'+t+'<br><span style="color:#888;font-size:11px">'+cnt+' 个数据块</span></span><button data-ts="'+ts+'" style="border:none;background:#4f46e5;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer">恢复</button></div>';});
      html+='</div><p style="color:#888;font-size:11px;margin-top:10px">恢复会把该时间点数据写回云端并同步到所有设备</p></div></div>';
      document.body.insertAdjacentHTML('beforeend',html);
      var list=document.getElementById('bkList');
      list.addEventListener('click',function(e){var b=e.target.closest('button[data-ts]');if(!b)return;var ts=b.getAttribute('data-ts');var data=(o[ts]&&o[ts].data)||{};SYNC_KEYS.forEach(function(k){if(data[k]!==undefined&&data[k]!==null&&data[k]!==DEL)fbRef.child(k).set(data[k]);else fbRef.child(k).set(DEL);});writeMeta();backupSnapshot();var m=document.getElementById('bkMask');if(m)m.remove();toast('已恢复备份 '+new Date(Number(ts)).toLocaleString());});
    });}catch(e){toast("读取备份失败");}
  }
  function migrateOld(){
    try{fbRef.once("value",function(snap){var v=snap.val();if(v&&v.data&&typeof v.data==="object"){var d=v.data;SYNC_KEYS.forEach(function(k){if(d[k]!==undefined&&d[k]!==null)fbRef.child(k).set(d[k]);});fbRef.child("data").remove();if(v.meta)fbRef.child("meta").remove();fbRef.child("__meta").set({writer:MY_ID,ts:Date.now(),migrated:true});}});}catch(e){}
  }
  function loadFirebaseScripts(cb){
    if(typeof firebase!=="undefined"){cb(true);return;}
    var urls=["https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js","https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"];
    var loaded=0,done=false;
    function finish(ok){if(done)return;done=true;cb(ok);}
    var timer=setTimeout(function(){finish(false);},6000);
    urls.forEach(function(u){
      var s=document.createElement("script");
      s.src=u;s.async=true;
      s.onload=function(){if(++loaded===urls.length){clearTimeout(timer);finish(typeof firebase!=="undefined");}};
      s.onerror=function(){clearTimeout(timer);finish(false);};
      document.head.appendChild(s);
    });
  }
  function init(){
    ui();
    lsGet().then(function(keys){
      if(keys!==null){
        localMode=true; fbReady=true;
        applyRemote(keys);
        setBadge(true);
        startLocalPolling();
        try{backupTimer=setInterval(backupSnapshot,5*60*1000);window.addEventListener("beforeunload",backupSnapshot);}catch(e){}
        toast("已连接本地服务，改动可同步到本机");
        return;
      }
      fallbackFirebase();
    }).catch(function(){ fallbackFirebase(); });
  }
  function fallbackFirebase(){
    loadFirebaseScripts(function(ok){
      if(ok&&typeof firebase!=="undefined"){
        try{
          if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(FB_CFG);
          fbRef=firebase.database().ref(SYNC_PATH);
          fbReady=true;
          migrateOld();
          fbRef.on("value",function(snap){
            var val=snap.val();
            if(!val)return;
            if(val.__meta&&val.__meta.writer===MY_ID)return;
            applyRemote(val);
          });
          setBadge(true);
          try{backupTimer=setInterval(backupSnapshot,5*60*1000);window.addEventListener("beforeunload",backupSnapshot);}catch(e){}
        }catch(e){
          fbReady=false;console.warn("[sync] 降级本地模式：",e&&e.message);setBadge(false);
        }
      }else{
        fbReady=false;console.warn("[sync] Firebase SDK 未能加载(国内网络/离线)，已降级本地模式");setBadge(false);
      }
    });
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>
</body>
</html>
